<style>
/* ============ Sistema visual: preto e azul ============
   Fundo preto quente, superfícies em degraus de cinza-escuro e o azul da marca
   como único destaque. Bordas de 1px, sombras duras azuis (sem desfoque) e
   réguas estruturais aparentes. Tema escuro único. */
:root{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --border:#2e2e2b; --border-strong:#3c3c38; --line:#41403b;
  --text:#f0efec; --text-2:#c3c2b7; --text-3:#8f8e86;
  --accent:#3987e5;         /* azul de destaque (texto, linhas, sombras) */
  --accent-strong:#2a78d6;  /* azul de preenchimento: botão principal com texto branco */
  --accent-weak:#1c2b3e; --accent-text:#ffffff;
  --danger:#e66767; --danger-weak:#3a1f1f; --good:#3fb57a; --warn:#eda100;
  --series-1:#3987e5; --grid:#2c2c29;
  --shadow:none;
  --hard:3px 3px 0 var(--accent);
  --r:2px;
  /* tipografia profissional: Inter Tight nos títulos, Inter no texto e nos rótulos */
  --display:'Inter Tight','Inter',ui-sans-serif,system-ui,sans-serif;
  --sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Inter',ui-sans-serif,system-ui,sans-serif; /* rótulos em versalete com espaçamento, sem fonte de máquina */
  --ease:cubic-bezier(.16,1,.3,1);       /* saída longa: resposta física */
  --ease-press:cubic-bezier(.3,.7,.4,1);  /* clique curto e firme */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:272px 1fr;grid-template-rows:56px 1fr;height:100vh}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.logo-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.logo-mark svg{width:16px;height:16px}
.top .spacer{flex:1}
.status{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.dot.ok{background:var(--good)} .dot.warn{background:#eda100}
.userchip{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--border);border-radius:999px;font-size:13px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px}
.menu-btn{display:none;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 9px}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.logo{cursor:pointer;border-radius:10px;padding:4px 8px 4px 4px;margin-left:-4px}
.logo:hover{background:var(--surface-2)}
.logo:focus-visible{outline:2px solid var(--accent)}
.home{max-width:1100px;margin:0 auto}
.home-hero{text-align:center;padding-top:12px}
.home-hero h1{font-size:28px;letter-spacing:-.02em;margin:0 0 4px}
.home-hero p{color:var(--text-2);margin:0}
.home-stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:24px 0 34px}
.quick .qcard{flex:1 1 190px;max-width:220px}
.qcard{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;color:var(--text);transition:border-color .15s,transform .15s}
.qcard:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.qcard:disabled{opacity:.5;cursor:default}
.qcard .qi{width:38px;height:38px;border-radius:10px;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center}
.qcard b{font-size:14px}
.qcard small{color:var(--text-2);font-size:12.5px;line-height:1.4}
.sec-title{display:flex;flex-direction:column;align-items:center;gap:2px;margin:0 0 14px;text-align:center}
.sec-title h2{font-size:17px;margin:0}
.base-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.base-grid .bcard{flex:1 1 280px;max-width:350px}
.home-drop{max-width:760px;margin:26px auto 0;border:2px dashed var(--border-strong);border-radius:18px;padding:30px 24px 26px;text-align:center;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.home-drop:hover,.home-drop.over{border-color:var(--accent);background:var(--accent-weak)}
.home-drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.home-drop.disabled{opacity:.55;cursor:default}
.home-drop .di{width:54px;height:54px;border-radius:15px;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center;margin:0 auto 12px;transition:background .15s,color .15s}
.home-drop.over .di,.home-drop:hover .di{background:var(--accent);color:#fff}
.home-drop h3{margin:0 0 4px;font-size:18px;letter-spacing:-.01em}
.home-drop p{margin:0 0 16px;color:var(--text-2);font-size:13.5px}
.ftypes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.bcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;cursor:pointer;min-width:0}
.bcard:hover{border-color:var(--accent)}
.bcard .bt{display:flex;gap:10px;align-items:center;min-width:0}
.bcard .bt .ic{width:34px;height:34px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--text-2)}
.bcard .bn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard .bm{font-size:12px;color:var(--text-3)}
.bcard .ba{display:flex;gap:6px;flex-wrap:wrap}
/* modelo de dados */
.app.collapsed .nav-item .ic svg{display:block!important}
.model-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.model-head h1{font-size:22px;letter-spacing:-.02em;margin:0}
.model-head p{margin:4px 0 0;color:var(--text-2);max-width:680px}
.model-hint{font-size:12.5px;color:var(--text-2);margin:0 0 10px}
.model-hint.active{color:var(--accent);font-weight:600}
.model-canvas{position:relative;overflow:auto;border:1px solid var(--border);border-radius:14px;background-color:var(--bg);background-image:radial-gradient(var(--border-strong) 1px,transparent 1px);background-size:20px 20px;height:min(64vh,660px);min-height:340px}
.model-inner{position:relative;min-width:100%;min-height:100%}
.model-svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.rel-line{fill:none;stroke:var(--accent);stroke-width:2;transition:stroke-width .12s}
.rel-line.off{stroke:var(--text-3);stroke-dasharray:5 4}
.rel-line.hl{stroke-width:4}
.rel-hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.rel-lbl{fill:var(--text);font-size:13px;font-weight:700;font-family:Inter,system-ui,sans-serif}
.mcard{position:absolute;width:250px;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow);user-select:none;z-index:1}
.mcard.dragging{box-shadow:0 12px 32px rgba(0,0,0,.28);z-index:5}
.mhead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);cursor:grab;touch-action:none;background:var(--surface-2);border-radius:12px 12px 0 0;color:var(--text-2)}
.mcard.dragging .mhead{cursor:grabbing}
.mhead .mname{font-weight:600;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.mhead .mcount{font-size:11px;color:var(--text-3);white-space:nowrap}
.mcols{padding:4px 0}
.mcol{display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12.5px;height:27px;cursor:pointer}
.mcol:hover{background:var(--surface-2)}
.mcol.sel{background:var(--accent-weak);box-shadow:inset 3px 0 0 var(--accent)}
.mcol.linked .mcn{font-weight:600}
.mty{font-size:9px;font-weight:700;color:var(--text-3);width:34px;text-align:center;border:1px solid var(--border);border-radius:4px;flex:none;letter-spacing:.03em}
.mcn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mkey{font-size:12px;color:var(--accent);font-weight:800;width:14px;text-align:center}
.rel-list{display:grid;gap:8px}
.rel-item{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px}
.rel-item:hover{border-color:var(--accent)}
.rel-path{flex:1;min-width:220px;font-size:13px}
.rel-arrow{color:var(--text-3);margin:0 8px}
.rel-toggle{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text-2)}
.chip.warn{border-color:#eda100;background:rgba(237,161,0,.12);color:var(--text)}
.rel-form{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.rel-side{display:grid;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px}
.rel-side .field select{width:100%;min-width:0}
.rel-mid{font-size:20px;color:var(--text-3)}
.an-box{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:13px;margin-top:14px;line-height:1.55}
.an-row+.an-row{margin-top:3px}
.an-t{font-weight:600}
.an-warn{margin-top:8px;padding:8px 10px;border-radius:8px;border:1px solid #eda100;background:rgba(237,161,0,.1)}
@media (max-width:640px){.rel-form{grid-template-columns:1fr}.rel-mid{display:none}}
.userchip{cursor:pointer;background:var(--surface)}
.userchip:hover{background:var(--surface-2)}
.aside-foot{padding:8px 8px 4px;border-top:1px solid var(--border)}
.profile-page{max-width:900px}
.profile-hero{display:flex;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:16px}
.avatar.lg{width:72px;height:72px;font-size:24px;flex:none}
.profile-hero h1{margin:0;font-size:22px;letter-spacing:-.02em}
.profile-hero .role{color:var(--text-2);margin-top:2px}
.profile-hero .mail{color:var(--text-3);font-size:13px;margin-top:4px}
.p-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.p-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.p-card+.p-card{margin-top:16px}
.p-card h2{font-size:15px;margin:0 0 4px}
.p-card .desc{color:var(--text-3);font-size:13px;margin:0 0 14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .field input{width:100%;min-width:0;padding:8px 10px;font-size:14px}
.form-grid .field input:disabled{background:var(--surface-2);color:var(--text-3)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:16px}
.form-err{color:var(--danger);font-size:13px;margin-right:auto}
.stat-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--text-2);border-bottom:1px solid var(--border);padding:8px 0}
.stat-row:last-child{border-bottom:0}
.stat-row b{color:var(--text);font-variant-numeric:tabular-nums;text-align:right}
.pdf-sign{margin-top:14px;padding:10px 12px;background:var(--surface-2);border-radius:10px;font-size:12.5px;color:var(--text-2)}
@media (max-width:760px){.p-grid,.form-grid{grid-template-columns:1fr}.profile-hero{flex-direction:column;text-align:center}}
.app{transition:grid-template-columns .2s ease}
.aside-tools{display:flex;gap:2px;align-items:center}
.collapse-btn svg{transition:transform .2s}
.base-item .ic .ab{display:none}
/* menu lateral recolhido (só em telas largas; no celular o menu já é gaveta) */
@media (min-width:861px){
  .app.collapsed{grid-template-columns:64px 1fr}
  .app.collapsed .aside-head{flex-direction:column;gap:6px;padding:12px 8px 8px}
  .app.collapsed .aside-head h2,.app.collapsed .base-item .txt,.app.collapsed .dropzone{display:none}
  .app.collapsed .aside-tools{flex-direction:column-reverse;gap:4px}
  .app.collapsed .collapse-btn svg{transform:rotate(180deg)}
  .app.collapsed .bases{padding:0 6px 8px}
  .app.collapsed .aside-foot{padding:8px 6px}
  .app.collapsed .base-item{justify-content:center;padding:7px 0}
  .app.collapsed .base-item .ic svg{display:none}
  .app.collapsed .base-item .ic .ab{display:block;font-weight:600;font-size:11.5px;letter-spacing:.02em}
  .app.collapsed #profileNavIc{border-radius:50%}
}
@media (max-width:860px){.collapse-btn{display:none}}
.app.no-aside,.app.no-aside.collapsed{grid-template-columns:1fr}
.app.no-aside aside,.app.no-aside .menu-btn{display:none!important}
.login-box{max-width:440px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 28px;box-shadow:var(--shadow)}
.login-mark{width:52px;height:52px;border-radius:14px;background:var(--accent);display:grid;place-items:center;margin:0 auto}
.login-mark svg{width:26px;height:26px}
.google-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 16px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);font-weight:600;font-size:14px;color:var(--text)}
.google-btn:hover{background:var(--surface-2)}
.google-btn:disabled{opacity:.6;cursor:default}
.login-note{font-size:12px;color:var(--text-3);margin-top:14px}
.setup{max-width:620px;text-align:left}
.setup ol{padding-left:20px;color:var(--text-2)}
.setup li{margin-bottom:8px}
.setup code{background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:12px}

aside{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.aside-head{padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between}
.aside-head h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin:0;font-weight:600}
.bases{flex:1;overflow:auto;padding:0 8px 8px}
.base-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;color:var(--text)}
.base-item:hover{background:var(--surface-2)}
.base-item.active{background:var(--accent-weak)}
.base-item .ic{width:30px;height:30px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--text-2)}
.base-item.active .ic{background:var(--accent);color:#fff}
.base-item .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.base-item .sub{font-size:12px;color:var(--text-3)}
.base-item .txt{min-width:0}
.dropzone{margin:8px 12px 14px;border:1.5px dashed var(--border-strong);border-radius:12px;padding:16px;text-align:center;color:var(--text-2);font-size:13px;transition:.15s}
.dropzone.over{border-color:var(--accent);background:var(--accent-weak)}
.dropzone b{color:var(--text)}
.muted{color:var(--text-3)}

main{overflow:auto;min-width:0;display:flex;flex-direction:column}
.page-head{padding:20px 28px 0;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.title-wrap{flex:1;min-width:220px}
.title-input{font-size:22px;font-weight:700;letter-spacing:-.02em;border:1px solid transparent;background:transparent;border-radius:8px;padding:2px 6px;margin-left:-7px;width:100%;max-width:560px}
.title-input:hover{border-color:var(--border)}
.title-input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.meta-line{color:var(--text-3);font-size:13px;margin-top:2px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:16px 28px 0;border-bottom:1px solid var(--border)}
.tab{border:0;background:transparent;padding:10px 14px;font-weight:500;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.view{padding:20px 28px 40px;flex:1}

.btn{border:1px solid var(--border-strong);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-weak)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:4px 9px;font-size:12px}
.icon-btn{border:0;background:transparent;border-radius:6px;padding:4px 6px;color:var(--text-3)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:200px;max-width:380px;position:relative}
.search input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-3)}
input:focus,select:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
.count{color:var(--text-3);font-size:13px;margin-left:auto}

.table-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.table-scroll{overflow:auto;max-height:calc(100vh - 290px);min-height:200px}
table.data{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.data th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
table.data th .ty{font-weight:500;font-size:10px;color:var(--text-3);margin-left:6px;text-transform:uppercase;letter-spacing:.04em}
table.data th.num,table.data td.num{text-align:right}
table.data td{padding:7px 12px;border-bottom:1px solid var(--border);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
table.data tbody tr:hover td{background:var(--surface-2)}
table.data td.edit{cursor:text}
table.data td.rowact{width:34px;padding:2px 6px;text-align:center}
table.data td input{width:100%;min-width:80px;border:1px solid var(--accent);border-radius:4px;padding:3px 6px;background:var(--surface)}
.null{color:var(--text-3)}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--border);font-size:13px;color:var(--text-2)}
.dirtybar{display:flex;align-items:center;gap:10px;background:var(--accent-weak);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.dirtybar .spacer{flex:1}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-2)}
.field select,.field input{padding:6px 8px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);font-size:13px;min-width:130px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .lb{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .vl{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sm{font-size:12px;color:var(--text-3);margin-top:2px}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:16px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.chart-head{display:flex;align-items:flex-start;gap:8px}
.chart-title{font-weight:600;font-size:14px;flex:1}
.chart-sub{font-size:12px;color:var(--text-3)}
.chart-controls{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 8px}
.chart-controls select{padding:4px 6px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:12px;max-width:170px}
.chart-box{position:relative;height:280px}
.chart-note{margin-top:10px;padding:9px 11px;border-radius:8px;background:var(--surface-2);font-size:12.5px;line-height:1.5;color:var(--text-2)}
.chart-note b{color:var(--text);font-weight:600}
.filter-chip{margin-top:5px;border:1px solid var(--border);background:var(--accent-weak);color:var(--text);border-radius:999px;padding:2px 9px;font-size:11.5px}
.filter-chip:hover:not(:disabled){border-color:var(--accent)}
.filter-chip:disabled{cursor:default}
.chart-table{max-height:280px;overflow:auto}
.chart-table table{width:100%;border-collapse:collapse;font-size:12px}
.chart-table td,.chart-table th{padding:5px 8px;border-bottom:1px solid var(--border);text-align:left}
.chart-table td:last-child,.chart-table th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.add-card{border:1.5px dashed var(--border-strong);border-radius:12px;display:grid;place-items:center;min-height:200px;color:var(--text-2);background:transparent;font-weight:500}
.add-card:hover{border-color:var(--accent);color:var(--accent)}

.empty{display:grid;place-items:center;flex:1;padding:40px}
.empty-box{max-width:520px;text-align:center}
.empty-box h1{font-size:24px;letter-spacing:-.02em;margin:16px 0 6px}
.empty-box p{color:var(--text-2);margin:0 0 20px}
.big-drop{border:2px dashed var(--border-strong);border-radius:16px;padding:36px 24px;background:var(--surface);transition:.15s}
.big-drop.over{border-color:var(--accent);background:var(--accent-weak)}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px;text-align:left}
.feat div{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:12px;color:var(--text-2)}
.feat b{display:block;color:var(--text);font-size:13px;margin-bottom:2px}

.banner{margin:12px 28px 0;padding:10px 14px;border-radius:10px;font-size:13px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2)}
.banner.warn{border-color:#eda100;background:rgba(237,161,0,.1);color:var(--text)}

.toast-wrap{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--text);color:var(--surface);padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:360px}
.toast.err{background:var(--danger);color:#fff}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:20px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:85vh;overflow:auto}
.modal h3{margin:0 0 6px;font-size:17px}
.modal p{margin:0 0 14px;color:var(--text-2)}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.col-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.col-row span{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-row select{padding:5px 8px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface)}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;text-align:left;background:var(--surface);width:100%}
.choice:hover{border-color:var(--accent);background:var(--accent-weak)}
.choice b{display:block}
.choice small{color:var(--text-2)}
.modal.wide{max-width:780px}
.doc-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2)}
.doc-warn{font-size:13px;padding:9px 12px;border-radius:10px;border:1px solid #eda100;background:rgba(237,161,0,.1);margin-bottom:12px}
.doc-tbl-head{margin:12px 0 6px;font-size:13px}
.doc-tbl{box-shadow:none}
.doc-raw{margin-top:14px;font-size:13px}
.doc-raw summary{cursor:pointer;color:var(--accent);font-weight:500}
.doc-raw pre{white-space:pre-wrap;font-size:11.5px;max-height:240px;overflow:auto;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px;margin:8px 0 0}
.sec-lb{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:600;margin:14px 0 8px}
.sug-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.sug{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--surface);color:var(--text)}
.sug:hover,.sug.sel{border-color:var(--accent);background:var(--accent-weak)}
.sug .si{flex:none;width:30px;height:30px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent)}
.sug.sel .si{background:var(--accent);color:#fff}
.sug b{display:block;font-size:13px;font-weight:600}
.sug small{color:var(--text-2);font-size:12px;line-height:1.35;display:block;margin-top:1px}
.type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.type-opt{border:1px solid var(--border);border-radius:10px;padding:10px 8px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-weight:600;font-size:13px;color:var(--text)}
.type-opt svg{color:var(--text-2)}
.type-opt small{font-weight:400;font-size:11px;color:var(--text-3);line-height:1.3}
.type-opt:hover:not(:disabled){border-color:var(--accent)}
.type-opt.sel{border-color:var(--accent);background:var(--accent-weak)}
.type-opt.sel svg{color:var(--accent)}
.type-opt:disabled{opacity:.4;cursor:not-allowed}
.type-note{font-size:12px;color:var(--text-3);margin-top:6px}
.form-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.form-row .field select{width:100%;min-width:0}
.preview{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--surface);box-shadow:var(--shadow)}
.preview .chart-box{height:230px}
.preview-desc{font-size:12px;color:var(--text-2);background:var(--surface-2);border-radius:8px;padding:8px 10px;margin-top:10px}
@media (max-width:640px){.type-grid{grid-template-columns:repeat(2,1fr)}.form-row{grid-template-columns:1fr}}
.spinner{width:18px;height:18px;border:2px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;top:56px;left:0;bottom:0;width:280px;z-index:30;transform:translateX(-100%);transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  aside.open{transform:none}
  .menu-btn{display:inline-flex}
  .page-head,.tabs,.view{padding-left:16px;padding-right:16px}
  .banner{margin-left:16px;margin-right:16px}
  .charts{grid-template-columns:1fr}
  .feat{grid-template-columns:1fr}
  .userchip .nm{display:none}
}

/* =====================================================================
   CAMADA VISUAL: TEMA PRETO E AZUL (sobrepõe os estilos acima)
   Estrutura editorial (grade assimétrica, réguas de 1px, tipografia forte)
   sobre fundo preto, com o azul da marca como único destaque.
   Sem grão, sem hachuras e sem enfeites: só estrutura e conteúdo.
   ===================================================================== */
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}

/* tipografia */
h1,h2,h3,.chart-title,.kpi .vl,.title-input,.logo{font-family:var(--display);font-stretch:108%}
.mono,.aside-head h2,.sec-lb,.status,.meta-line,.count,.chip,.mty,.chart-sub,.kpi .lb,.kpi .sm,table.data th .ty,.pager,.type-note,.bcard .bm{font-family:var(--mono)}

/* estrutura: réguas */
header.top{background:var(--bg);border-bottom:1px solid var(--line);height:56px}
aside{background:var(--bg);border-right:1px solid var(--line)}
.aside-foot{border-top:1px solid var(--line)}
.tabs{border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:15px;letter-spacing:-.01em;border-radius:var(--r)}
.logo-mark{border-radius:var(--r);background:var(--accent-strong)}
.status{font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.userchip{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.userchip:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--accent);background:var(--surface)}
.avatar{background:var(--accent-weak);color:var(--accent)}

/* menu lateral */
.aside-head h2{font-size:10.5px;letter-spacing:.12em;color:var(--text-3);font-weight:500}
.base-item{border-radius:var(--r);transition:background .2s var(--ease),box-shadow .2s var(--ease)}
.base-item:hover{background:var(--surface-2)}
.base-item.active{background:var(--accent-weak);box-shadow:inset 3px 0 0 var(--accent)}
.base-item .ic{border-radius:var(--r);background:transparent;border:1px solid var(--border-strong)}
.base-item.active .ic{background:var(--accent-strong);color:#fff;border-color:var(--accent-strong)}
.icon-btn{border-radius:var(--r)}

/* botões: borda definida + sombra dura azul que "afunda" no clique */
.btn{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--text);font-weight:600;padding:7px 13px;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .18s var(--ease),border-color .18s}
.btn:hover:not(:disabled){background:var(--surface-2);border-color:var(--accent);transform:translate(-2px,-2px);box-shadow:var(--hard)}
.btn:active:not(:disabled){transform:translate(0,0);box-shadow:0 0 0 var(--accent);transition-duration:.06s;transition-timing-function:var(--ease-press)}
.btn.primary{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
.btn.primary:hover:not(:disabled){filter:none;background:var(--accent);border-color:var(--accent);box-shadow:3px 3px 0 #9ec5f4}
.btn.danger{color:var(--danger)}
.btn.danger:hover:not(:disabled){background:var(--danger-weak);border-color:var(--danger);box-shadow:3px 3px 0 var(--danger)}
.btn.sm{padding:4px 9px;font-size:12px}

/* superfícies */
.chart-card,.kpi,.table-card,.p-card,.filters,.modal,.rel-item,.profile-hero,.preview,.login-card{border:1px solid var(--line);border-radius:var(--r);box-shadow:none;background:var(--surface)}
.kpi{padding:14px 16px 16px;position:relative}
.kpi .lb{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.kpi .vl{font-size:clamp(22px,2.2vw,30px);font-weight:800;letter-spacing:-.03em;margin-top:8px}
.kpi .sm{font-size:11px}
.kpis{gap:0;border:1px solid var(--line);background:var(--surface);overflow:hidden}
.kpis .kpi{border:0;border-right:1px solid var(--border);border-bottom:1px solid var(--border);margin:0 -1px -1px 0}
.filters{background:var(--bg)}
.field{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.field select,.field input,.chart-controls select,.search input,.col-row select{font-family:var(--sans);text-transform:none;letter-spacing:0;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface-2);color:var(--text)}
.chart-title{font-weight:800;font-size:15px;letter-spacing:-.01em}
.chart-sub{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.chart-note{border-radius:var(--r);background:transparent;border-top:1px solid var(--border);padding:10px 0 0;margin-top:12px}
.chart-note b{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--text-3);display:block;margin-bottom:2px}
.charts{gap:20px}
.add-card{border:1px dashed var(--border-strong);border-radius:var(--r);font-family:var(--display);font-stretch:108%;font-weight:700;color:var(--text-2);background:transparent;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s,color .2s}
.add-card:hover{border-style:solid;border-color:var(--accent);color:var(--text);transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--accent)}
.chip{border-radius:var(--r);font-size:10.5px;letter-spacing:.03em;background:transparent;border:1px solid var(--border-strong);color:var(--text-2)}
.filter-chip{border-radius:var(--r);background:var(--accent-weak);border:1px solid var(--accent);font-family:var(--mono);font-size:10.5px}

/* página da base */
.page-head{padding:clamp(20px,3vw,36px) clamp(16px,2.6vw,36px) 0}
.title-input{font-size:clamp(24px,2.8vw,38px);font-weight:800;letter-spacing:-.035em;line-height:1.05;border-radius:var(--r)}
.title-input:focus{border-color:var(--accent);background:var(--surface)}
.meta-line{font-size:11px;letter-spacing:.02em;margin-top:6px}
.tabs{padding:clamp(14px,2vw,22px) clamp(16px,2.6vw,36px) 0}
.tab{font-weight:600;border-bottom-width:2px;transition:color .2s var(--ease)}
.tab.active{border-bottom-color:var(--accent)}
.view{padding:clamp(18px,2.4vw,32px) clamp(16px,2.6vw,36px) 56px}
table.data{font-size:13px}
table.data th{background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:600}
table.data th .ty{font-size:9.5px}
table.data td{font-variant-numeric:tabular-nums}
table.data tbody tr:hover td{background:var(--accent-weak)}
.pager{border-top:1px solid var(--line);font-size:11px}
.dirtybar,.banner,.doc-warn,.an-warn{border-radius:var(--r)}
.dirtybar{border:1px solid var(--accent);background:var(--accent-weak)}
.banner.warn,.doc-warn,.an-warn,.chip.warn{border-color:var(--warn);background:rgba(237,161,0,.1);color:var(--text)}

/* modal, toast, sugestões */
.modal-bg{background:rgba(0,0,0,.62)}
.modal{box-shadow:6px 6px 0 var(--accent);animation:pop .32s var(--ease) both}
.modal h3{font-family:var(--display);font-stretch:108%;font-weight:800;font-size:clamp(18px,1.8vw,22px);letter-spacing:-.02em}
.toast{background:var(--text);color:var(--bg);border-radius:var(--r);box-shadow:4px 4px 0 var(--accent);animation:slidein .36s var(--ease) both}
.toast.err{background:var(--danger);color:#fff;box-shadow:4px 4px 0 #000}
.sug,.type-opt,.choice{border-radius:var(--r);border:1px solid var(--border-strong);transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s}
.sug:hover,.sug.sel,.type-opt:hover:not(:disabled),.type-opt.sel,.choice:hover{border-color:var(--accent);background:var(--accent-weak);transform:translate(-2px,-2px);box-shadow:var(--hard)}
.sug .si,.sug.sel .si{border-radius:var(--r)}
.sug.sel .si{background:var(--accent-strong);color:#fff}
.type-opt.sel svg{color:var(--accent)}
.sec-lb{font-size:10.5px;letter-spacing:.1em;font-weight:500}
.spinner{border-top-color:var(--accent)}

/* perfil */
.profile-hero{padding:clamp(18px,2.4vw,28px)}
.profile-hero h1{font-size:clamp(24px,3vw,40px);font-weight:800;letter-spacing:-.035em}
.p-card h2{font-family:var(--display);font-stretch:108%;font-weight:800}
.pdf-sign,.an-box,.rel-side{border-radius:var(--r)}
.stat-row b{font-family:var(--mono);font-weight:600}
.form-grid .field input{border-radius:var(--r)}
.form-grid .field input:disabled{background:var(--bg)}

/* modelo de dados */
.model-head h1{font-size:clamp(26px,3.2vw,44px);font-weight:800;letter-spacing:-.035em}
.model-canvas{border:1px solid var(--line);border-radius:var(--r);background-color:var(--bg);background-image:radial-gradient(var(--border-strong) 1px,transparent 1px)}
.mcard{border:1px solid var(--line);border-radius:var(--r);box-shadow:3px 3px 0 #000;transition:box-shadow .2s var(--ease)}
.mcard.dragging{box-shadow:8px 8px 0 var(--accent)}
.mhead{background:var(--surface-2);color:var(--text-2);border-radius:0;border-bottom:1px solid var(--line)}
.mhead .mname{color:var(--text);font-family:var(--display);font-stretch:104%;font-weight:700}
.mhead .mcount{font-family:var(--mono);color:var(--text-3)}
.mcol.sel{background:var(--accent-weak);box-shadow:inset 3px 0 0 var(--accent)}
.mkey{color:var(--accent)}
.rel-line{stroke:var(--accent)}
.rel-lbl{font-family:var(--mono);fill:var(--text)}

/* movimento: entrada só quando a tela muda (não a cada atualização) */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translate(4px,4px) scale(.985)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.enter>*,.enter .stagger>*{animation:rise .5s var(--ease) both}
.enter>.stagger,.enter.stagger{animation:none}
.enter .stagger>*:nth-child(2){animation-delay:.04s}.enter .stagger>*:nth-child(3){animation-delay:.08s}
.enter .stagger>*:nth-child(4){animation-delay:.12s}.enter .stagger>*:nth-child(5){animation-delay:.16s}
.enter .stagger>*:nth-child(n+6){animation-delay:.2s}
.enter.login-wrap .login-side{animation:rise .6s var(--ease) .1s both}

/* ---------- Página inicial: grade editorial assimétrica ---------- */
.home{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(16px,2.4vw,32px);max-width:1280px;margin:0}
.h-meta{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;font:500 10.5px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);padding-bottom:12px;border-bottom:1px solid var(--line)}
.h-hero{grid-column:1/span 8;padding:clamp(32px,6vw,84px) 0 clamp(24px,3.4vw,44px)}
.h-hero h1{font-weight:800;font-stretch:112%;font-size:clamp(40px,6.2vw,96px);line-height:.92;letter-spacing:-.045em;margin:0}
.h-hero p{font-size:clamp(16px,1.35vw,19px);color:var(--text-2);margin:clamp(14px,1.6vw,22px) 0 0;max-width:36ch}
.h-ledger{grid-column:10/-1;align-self:end;padding-bottom:clamp(24px,3.4vw,44px)}
.h-ledger .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--line);padding:11px 0}
.h-ledger .row:last-child{border-bottom:1px solid var(--line)}
.h-ledger .k{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.h-ledger .v{font-family:var(--display);font-stretch:108%;font-weight:800;font-size:clamp(20px,2vw,30px);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.home .home-drop{grid-column:1/span 7;max-width:none;margin:0;text-align:left;border:1px dashed var(--border-strong);border-radius:var(--r);padding:clamp(22px,3vw,44px);background:var(--surface);
  display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:clamp(16px,2vw,28px);align-items:start;align-content:start;

.home .home-drop:hover{border-style:solid;border-color:var(--accent);transform:translate(-4px,-4px);box-shadow:6px 6px 0 var(--accent)}
.home .home-drop.over{border-style:solid;border-color:var(--accent);background-color:var(--accent-weak);transform:translate(-4px,-4px);box-shadow:6px 6px 0 var(--accent)}
.home .home-drop .di{grid-row:1/span 4;width:56px;height:56px;border-radius:var(--r);background:var(--accent-weak);color:var(--accent);margin:0;transition:background .2s,color .2s}

.home .home-drop h3{font-family:var(--display);font-stretch:110%;font-weight:800;font-size:clamp(22px,2.4vw,34px);letter-spacing:-.035em;line-height:1;margin:2px 0 10px}
.home .home-drop p{font-size:14px;max-width:46ch;margin:0 0 18px}
.home .home-drop .btn{justify-self:start}
.home .ftypes{justify-content:flex-start;margin-top:18px}
.h-index{grid-column:9/-1;align-self:start}
.h-index .lbl{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
.ix{display:grid;grid-template-columns:30px minmax(0,1fr) 18px;gap:10px;align-items:start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 2px;color:var(--text);
  transition:padding .26s var(--ease),background .2s var(--ease)}
.ix:last-child{border-bottom:1px solid var(--line)}
.ix .n{font:500 11px var(--mono);color:var(--text-3);padding-top:3px}
.ix b{display:block;font-family:var(--display);font-stretch:106%;font-weight:700;font-size:16px;letter-spacing:-.01em}
.ix small{display:block;color:var(--text-2);font-size:12.5px;line-height:1.4;margin-top:2px}
.ix .ar{font-family:var(--mono);color:var(--text-3);padding-top:2px;transition:transform .26s var(--ease),color .2s}
.ix:hover:not(:disabled){padding-left:10px;background:var(--surface)}
.ix:hover:not(:disabled) .ar{transform:translateX(4px);color:var(--accent)}
.ix:hover:not(:disabled) .n{color:var(--accent)}
.ix:disabled{opacity:.4;cursor:default}
.h-bases{grid-column:1/-1;margin-top:clamp(44px,7vw,96px)}
.h-bases .hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
.h-bases h2{font-weight:800;font-stretch:110%;font-size:clamp(24px,2.8vw,40px);letter-spacing:-.04em;margin:0;line-height:1}
.h-bases .hd span{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.lg{display:grid}
.lg-row{display:grid;grid-template-columns:minmax(0,3.2fr) repeat(3,minmax(0,.7fr)) minmax(0,1.3fr) auto;gap:16px;align-items:center;padding:14px 6px;border-bottom:1px solid var(--border);cursor:pointer;
  transition:background .2s var(--ease),padding .26s var(--ease),box-shadow .2s var(--ease)}
.lg-row:hover{background:var(--surface);padding-left:12px;box-shadow:inset 2px 0 0 var(--accent)}
.lg-row.lg-h{cursor:default;padding-top:12px;padding-bottom:8px;border-bottom:1px solid var(--line);font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.lg-row.lg-h:hover{background:none;padding-left:6px;box-shadow:none}
.lg-name{min-width:0}
.lg-name b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-name span{display:block;font:400 11px var(--mono);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.lg-num{font:500 13px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.lg-date{font:400 11.5px var(--mono);color:var(--text-2)}

/* ---------- Login: dividido, assimétrico ---------- */
.login-wrap{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);flex:1;min-height:calc(100vh - 56px)}
.login-main{padding:clamp(32px,7vw,112px) clamp(20px,5vw,80px);display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line)}
.kicker{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:22px;height:1px;background:var(--accent)}
.login-main h1{font-weight:800;font-stretch:115%;font-size:clamp(44px,7vw,112px);line-height:.9;letter-spacing:-.05em;margin:clamp(18px,2.4vw,30px) 0 0}
.login-main p.lead{font-size:clamp(16px,1.4vw,20px);color:var(--text-2);max-width:40ch;margin:clamp(18px,2.2vw,28px) 0 clamp(24px,3vw,36px)}
.google-btn{width:auto;align-self:flex-start;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--text);padding:13px 20px;font-size:15px;box-shadow:3px 3px 0 var(--accent);
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s}
.google-btn:hover:not(:disabled){background:var(--surface);border-color:var(--accent);transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--accent)}
.google-btn:active:not(:disabled){transform:none;box-shadow:0 0 0 var(--accent);transition-duration:.06s}
.login-note{max-width:46ch;font-size:12px}
.login-side{background:var(--surface);padding:clamp(28px,4vw,64px) clamp(20px,3.4vw,56px);display:flex;flex-direction:column;justify-content:flex-end;gap:18px}
.steps{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.steps li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
.steps .n{font:600 12px var(--mono);color:var(--accent)}
.steps b{display:block;font-family:var(--display);font-stretch:108%;font-weight:800;font-size:clamp(17px,1.5vw,21px);letter-spacing:-.02em}
.steps span{display:block;color:var(--text-2);font-size:13px;margin-top:2px}

/* ---------- Página inicial centralizada (pedido do usuário) ---------- */
.home{display:flex;flex-direction:column;align-items:center;max-width:1100px;margin:0 auto}
.h-meta{align-self:stretch}
.h-hero{text-align:center;padding:clamp(32px,5vw,72px) 0 clamp(20px,2.6vw,32px)}
.h-hero p{margin-left:auto;margin-right:auto}

.h-ledger .row,.h-ledger .row:last-child{flex-direction:column;align-items:center;gap:4px;border:0;border-left:1px solid var(--line);padding:14px 8px}

.home .home-drop{width:100%;max-width:760px;margin-top:clamp(28px,3.4vw,44px);grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
.home .home-drop .di{grid-row:auto;margin-bottom:16px}
.home .home-drop p{margin-left:auto;margin-right:auto}
.home .home-drop .btn{justify-self:center}
.home .ftypes{justify-content:center}
.h-index{width:100%;margin-top:clamp(36px,4.4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));column-gap:16px}
.h-index .lbl{grid-column:1/-1;text-align:center;margin-bottom:12px}
.h-index .ix,.h-index .ix:last-child{grid-template-columns:auto minmax(0,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 4px}
.h-index .ix .ar{display:none}
.h-index .ix:hover:not(:disabled){padding-left:4px;background:var(--surface);box-shadow:inset 0 2px 0 var(--accent)}
.h-bases{width:100%}
.h-bases .hd{flex-direction:column;align-items:center;text-align:center;gap:6px}

.app.no-aside,.app.no-aside.collapsed{grid-template-columns:minmax(0,1fr)}
@media (max-width:860px){

  .status span:last-child{display:none}
  .home>*{grid-column:1/-1!important}
  .h-index{grid-template-columns:minmax(0,1fr)}
  .lg-row{grid-template-columns:minmax(0,1fr) auto}
  .lg-hide{display:none}
  .login-wrap{grid-template-columns:1fr;min-height:0;align-content:start}
  .login-main{border-right:0;border-bottom:1px solid var(--line)}

  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- Ajuste tipográfico: mais sóbrio e profissional ---------- */
body{font-feature-settings:"cv11","ss01";font-variant-numeric:tabular-nums}
body *{font-stretch:normal!important}
h1,h2,h3,.chart-title,.kpi .vl,.title-input,.logo,.h-ledger .v,.ix b,.steps b,.mhead .mname,.add-card,.p-card h2,.modal h3,.home .home-drop h3{font-weight:700}
.h-hero h1{font-weight:700;letter-spacing:-.035em;line-height:1}
.login-main h1{font-weight:700;letter-spacing:-.04em;line-height:.98}
.h-bases h2,.model-head h1,.profile-hero h1,.title-input,.home .home-drop h3{letter-spacing:-.025em}
.kpi .vl,.h-ledger .v{letter-spacing:-.02em}
.chart-title,.ix b,.steps b{letter-spacing:-.01em}
.logo{font-weight:700;letter-spacing:-.01em}
/* rótulos em caixa alta: espaçamento menor, que fica elegante na Inter */
.aside-head h2,.sec-lb,.kpi .lb,.chart-sub,.field,.h-meta,.h-ledger .k,.h-index .lbl,.h-bases .hd span,.lg-row.lg-h,.kicker,.chart-note b,.status{letter-spacing:.06em;font-weight:500}
.chip,.filter-chip,.lg-name span,.lg-date,.meta-line,.mhead .mcount{letter-spacing:0}

/* =====================================================================
   INSPIRAÇÃO TRADINGVIEW
   Preto profundo, superfícies azul-grafite suaves, azul #2962ff como ação,
   cantos arredondados, sem contornos pesados nem sombras duras.
   Títulos em fonte geométrica, rótulos em caixa normal.
   ===================================================================== */
:root{
  --bg:#0f0f0f; --surface:#161a25; --surface-2:#1e222d; --border:#2a2e39; --border-strong:#363a45; --line:#2a2e39;
  --text:#d1d4dc; --text-strong:#ffffff; --text-2:#b2b5be; --text-3:#787b86;
  --accent:#2962ff; --accent-strong:#2962ff; --accent-hover:#1e53e5; --accent-weak:#142045; --accent-text:#ffffff;
  --good:#089981; --danger:#f23645; --danger-weak:#3a1b20;
  --series-1:#2962ff; --grid:#2a2e39;
  --hard:none; --r:8px; --r-lg:14px;
  --display:'Plus Jakarta Sans','Inter',ui-sans-serif,system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text)}
h1,h2,h3,.chart-title,.kpi .vl,.title-input,.h-ledger .v,.ix b,.steps b,.mhead .mname,.p-card h2,.modal h3,.home .home-drop h3,.lg-name b,.base-item .nm,.logo{color:var(--text-strong)}
h1,h2,h3,.title-input,.h-ledger .v,.kpi .vl,.home .home-drop h3{font-family:var(--display);font-weight:700;letter-spacing:-.02em}

/* rótulos: caixa normal, discretos (sem versalete técnico) */
.aside-head h2,.sec-lb,.kpi .lb,.chart-sub,.field,.h-meta,.h-ledger .k,.h-index .lbl,.h-bases .hd span,.lg-row.lg-h,.kicker,.chart-note b,.status,.lb{text-transform:none!important;letter-spacing:0!important;font-size:12px;font-weight:500;color:var(--text-3)}
.kicker::before{display:none}

/* estrutura */
header.top{background:rgba(15,15,15,.94);border-bottom:1px solid var(--border)}
aside{background:var(--bg);border-right:1px solid var(--border)}
.aside-foot,.tabs{border-color:var(--border)}
.logo-mark{border-radius:7px;background:var(--accent)}
.userchip{border:1px solid var(--border);border-radius:999px;background:transparent}
.userchip:hover{transform:none;box-shadow:none;background:var(--surface-2)}
.avatar{background:var(--accent-weak);color:#9db6ff}

/* menu lateral */
.base-item{border-radius:var(--r)}
.base-item:hover{background:var(--surface-2)}
.base-item.active{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--accent)}
.base-item .ic{border:1px solid var(--border);border-radius:7px}
.base-item.active .ic{background:var(--accent);border-color:var(--accent)}

/* botões: preenchidos, arredondados, resposta por cor (sem pular nem sombra) */
.btn{border:0;border-radius:var(--r);background:var(--surface-2);color:var(--text-strong);padding:8px 14px;font-weight:600;
  transition:background .16s var(--ease),color .16s var(--ease),transform .12s var(--ease-press)}
.btn:hover:not(:disabled){background:#2a2e39;border-color:transparent;transform:none;box-shadow:none}
.btn:active:not(:disabled){transform:scale(.98);box-shadow:none}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent-hover);box-shadow:none}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px rgba(242,54,69,.45)}
.btn.danger:hover:not(:disabled){background:var(--danger-weak);box-shadow:inset 0 0 0 1px var(--danger)}
.btn.sm{padding:5px 10px;border-radius:7px}
.icon-btn{border-radius:7px}

/* superfícies: cartões escuros com cantos suaves */
.chart-card,.kpi,.table-card,.p-card,.filters,.rel-item,.profile-hero,.preview{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface)}
.kpis{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface)}
.kpis .kpi{border-radius:0;border-color:var(--border)}
.filters{background:var(--surface)}
.chart-note{border-top-color:var(--border)}
.add-card{border:1px dashed var(--border-strong);border-radius:var(--r-lg);color:var(--text-2)}
.add-card:hover{border-style:dashed;border-color:var(--accent);color:var(--text-strong);background:var(--surface);transform:none;box-shadow:none}
.chip{border-radius:999px;border:1px solid var(--border-strong);color:var(--text-2);font-size:11.5px}
.filter-chip{border-radius:999px;border:1px solid transparent;background:var(--accent-weak);color:#9db6ff;font-family:var(--sans)}
.field select,.field input,.chart-controls select,.search input,.col-row select,.form-grid .field input{border:1px solid var(--border);border-radius:7px;background:var(--surface-2);color:var(--text-strong)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab.active{border-bottom-color:var(--accent);color:var(--text-strong)}
table.data th{background:var(--surface-2);border-bottom:1px solid var(--border);color:var(--text-2)}
table.data td{border-bottom-color:var(--border)}
table.data tbody tr:hover td{background:var(--surface-2)}
.pager{border-top:1px solid var(--border)}
.dirtybar{border:1px solid rgba(41,98,255,.5);background:var(--accent-weak);border-radius:var(--r)}

/* janelas e avisos */
.modal-bg{background:rgba(0,0,0,.7)}
.modal{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);box-shadow:0 24px 64px rgba(0,0,0,.6)}
.toast{background:#2a2e39;color:#fff;border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.err{background:var(--danger);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.sug,.type-opt,.choice{border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2)}
.sug:hover,.sug.sel,.type-opt:hover:not(:disabled),.type-opt.sel,.choice:hover{border-color:var(--accent);background:var(--accent-weak);transform:none;box-shadow:none}
.pdf-sign,.an-box,.rel-side,.doc-warn,.an-warn,.banner{border-radius:var(--r)}

/* modelo de dados */
.model-canvas{border:1px solid var(--border);border-radius:var(--r-lg);background-color:var(--bg);background-image:radial-gradient(#2a2e39 1px,transparent 1px)}
.mcard{border:1px solid var(--border-strong);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);overflow:hidden}
.mcard.dragging{box-shadow:0 16px 40px rgba(0,0,0,.6),0 0 0 1px var(--accent)}
.mhead{background:var(--surface-2);border-bottom:1px solid var(--border)}

/* página inicial (centralizada, no espírito do TradingView) */
.h-meta{border-bottom-color:var(--border)}
.h-hero{padding:clamp(40px,6vw,88px) 0 clamp(24px,3vw,36px)}
.h-hero h1{font-size:clamp(34px,4.6vw,60px);line-height:1.08;letter-spacing:-.025em}
.h-hero p{color:var(--text-2);font-size:clamp(16px,1.3vw,18px)}
.h-ledger{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.h-ledger .row,.h-ledger .row:last-child{border-left-color:var(--border)}
.h-ledger .v{font-size:clamp(22px,2vw,28px)}
.home .home-drop{border:1px dashed var(--border-strong);border-radius:var(--r-lg);background:var(--surface)}
.home .home-drop:hover,.home .home-drop.over{border-style:dashed;border-color:var(--accent);background:#131a2b;transform:none;box-shadow:none}
.home .home-drop .di{border-radius:12px;background:var(--accent-weak);color:#9db6ff}
.home .home-drop:hover .di,.home .home-drop.over .di{background:var(--accent);color:#fff}
.h-index .ix,.h-index .ix:last-child{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);padding:16px;margin-bottom:12px}
.h-index{column-gap:12px}
.h-index .ix:hover:not(:disabled){padding-left:16px;background:var(--surface-2);border-color:var(--border-strong);box-shadow:none}
.h-index .ix:hover:not(:disabled) .n{color:var(--accent)}
.ix .n{color:var(--text-3)}
.h-bases .hd{border-bottom-color:var(--border)}
.lg-row{border-bottom-color:var(--border);border-radius:var(--r)}
.lg-row:hover{background:var(--surface);box-shadow:none;padding-left:12px}
.lg-row.lg-h{border-bottom-color:var(--border)}

/* login */
.login-main{border-right-color:var(--border)}
.login-main h1{font-size:clamp(40px,5.6vw,76px);line-height:1.02;letter-spacing:-.03em}
.login-side{background:var(--surface)}
.steps,.steps li{border-color:var(--border)}
.google-btn{background:#fff;color:#0f0f0f;border:0;border-radius:var(--r);box-shadow:none;font-weight:600}
.google-btn:hover:not(:disabled){background:#e8e8ea;transform:none;box-shadow:none}
.google-btn:active:not(:disabled){transform:scale(.98)}

   O azul fica só em botões, abas, linhas de destaque e textos de ação. */
:root{
  --surface:#161616; --surface-2:#1f1f1f; --border:#2a2a2a; --border-strong:#383838; --line:#2a2a2a;
  --accent-weak:#232323; --grid:#262626;

}

.home .home-drop:hover .di,.home .home-drop.over .di{background:var(--accent);color:#fff}
.dirtybar{background:var(--surface-2);border-color:var(--border-strong)}
.sug:hover,.sug.sel,.type-opt:hover:not(:disabled),.type-opt.sel,.choice:hover{background:var(--surface-2)}

/* ---------- Atalhos da página inicial: cartões uniformes ---------- */
.h-index{display:block;width:100%;margin-top:clamp(36px,4.4vw,56px)}
.h-index .lbl{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:14px;text-align:center}
.h-index .lbl>span:first-child{font-size:12px;color:var(--text-3)}
.h-index .cur{max-width:100%;font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Modelo de dados no estilo Power BI ---------- */

.rl .rel-line{fill:none;stroke:#6b6f78;stroke-width:1.6;stroke-dasharray:none;transition:stroke .15s,stroke-width .15s}
.rl.off .rel-line{stroke-dasharray:6 5;stroke:#55585f}
.rl:hover .rel-line,.rl.hover .rel-line{stroke:#b4b4b4;stroke-width:2.2}
.rl.sel .rel-line{stroke:var(--accent);stroke-width:2.6}

.rl .rel-lbl{fill:var(--text-strong);font-family:var(--sans);font-size:14px;font-weight:700;paint-order:stroke;stroke:var(--bg);stroke-width:4px}

.rel-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.drag-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;pointer-events:none}
.rel-item{cursor:pointer}
