.tv-dots{display:flex;gap:6px;padding-top:8px}
.tv-dots i{width:8px;height:8px;border-radius:50%;background:#333} .tv-dots i.on{background:var(--accent)}
.tv-chart{flex:1;min-height:0;position:relative;margin-top:10px}
.tv-pivot{flex:1;min-height:0;overflow:hidden;margin-top:10px}
.tv-empty{display:grid;place-items:center;height:100%;color:#777;font-size:clamp(14px,1.2vw,22px);text-align:center}
table.pivot{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:clamp(13px,1.15vw,22px)}
.pivot th{font-size:.72em;font-weight:600;color:#8a8a8a;text-align:left;padding:.4em .6em;border-bottom:1px solid #2a2a2a;white-space:nowrap}
.pivot td{padding:.42em .6em;border-bottom:1px solid #1f1f1f;color:#ddd;white-space:nowrap}
.pivot .num{text-align:right}
.pivot td.pk{max-width:22vw}
.pivot .pkw{display:flex;align-items:center;gap:.6em;min-width:0;overflow:hidden}
.pivot .pkw span:last-child{overflow:hidden;text-overflow:ellipsis}
.pivot .rk{flex:none;width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;background:#222;color:#aaa;font-size:.7em;font-weight:700}
.pivot tr.top .rk{background:var(--accent);color:#fff}
.pivot tr.top td{color:#fff}
.pivot td.tot{position:relative}
.pivot td.tot b{position:relative;font-weight:700;color:#fff}
.pivot .pbar{position:absolute;right:0;top:22%;bottom:22%;background:color-mix(in srgb,var(--accent) 28%,transparent);border-radius:4px}
.pivot td.pc{color:#9a9a9a}
.pivot tfoot td{font-weight:700;color:#fff;border-top:1px solid #333;border-bottom:0}
.tv-goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:clamp(10px,1.2vw,20px)}
.tv-goal{background:#151515;border:1px solid #242424;border-radius:14px;padding:clamp(10px,1vw,18px);display:flex;flex-direction:column;gap:8px}
.tg-top{display:flex;justify-content:space-between;gap:8px;font-size:clamp(13px,1.1vw,20px)}
.tg-top b{color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-top span{font-weight:700;color:#ddd}
.tg-st{font-size:clamp(11px,.9vw,16px);color:#9a9a9a;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tv-goal.ok .g-bar i{background:#2fbf8a} .tv-goal.warn .g-bar i{background:#eda100} .tv-goal.bad .g-bar i{background:#f2555a}
.tv-goal.warn .tg-st{color:#eda100} .tv-goal.bad .tg-st{color:#f2555a}
.tv-goal .g-bar{background:#262626}
@media (max-width:900px){.tv{height:auto;min-height:100vh}.tv-main{grid-template-columns:1fr}.tv-chart{min-height:320px}body.tv-on main{overflow:auto}}
/* diálogo do modo TV */
.tv-form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px}
.tv-form .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tv-form .field select{width:100%}
.tv-form .field{margin-top:8px}
.tv-prevtbl{border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:#0b0b0b;max-height:300px;overflow:auto}
.tv-prevtbl table.pivot{font-size:12.5px}
.tv-prevtbl .pivot td.pk{max-width:200px}
.tv-link .share-url input{width:100%;min-width:0;font-size:12.5px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface-2);color:var(--text-strong)}
@media (max-width:820px){.tv-form-grid{grid-template-columns:1fr}}

/* ===================== Mais fácil para quem está começando ===================== */
body.simple .adv{display:none!important}
body:not(.simple) .simple-only{display:none!important}
body.simple .chart-card:not(.editing) .chart-controls{display:none}
.chart-card.editing{border-color:var(--accent)}
/* menu "••• Mais" */
.pop-bg{position:fixed;inset:0;z-index:60}
.pop-menu{position:fixed;min-width:250px;max-width:320px;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:6px;animation:fadein .15s ease both}
.pop-t{font-size:11.5px;color:var(--text-3);padding:6px 10px 4px;font-weight:600;letter-spacing:.02em}
.pop-it{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px;color:var(--text)}
.pop-it:hover:not(:disabled),.pop-it:focus-visible{background:var(--surface-2);outline:0}
.pop-it:disabled{opacity:.45;cursor:default}
.pop-it svg,.pop-ic{flex:0 0 16px;width:16px;height:16px;margin-top:2px;color:var(--text-2)}
.pop-tx{display:flex;flex-direction:column;min-width:0}
.pop-tx b{font-weight:600;font-size:13.5px}
.pop-tx small{color:var(--text-3);font-size:12px;line-height:1.35}
.pop-it.danger b,.pop-it.danger svg{color:var(--bad,#f2555a)}
.pop-sep{height:1px;background:var(--border);margin:5px 6px}
/* ajuda da tela */
.help-line{display:flex;justify-content:flex-end;margin:-6px 0 10px}
.help-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:transparent;color:var(--text-2);border-radius:999px;padding:4px 11px 4px 5px;font-size:12.5px;font-weight:600}
.help-btn:hover{color:var(--text-strong);border-color:var(--border-strong)}
.help-btn .q{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.help-list{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.help-list li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:13.5px;color:var(--text-2);line-height:1.5}
.help-list li b{color:var(--text-strong)}
.help-list .n{width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--text)}
/* resumo em poucas palavras */
.easy-sum{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 10%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--border));border-radius:12px;padding:14px 16px;margin-bottom:16px}
.easy-sum h3{margin:0 0 8px;font-size:14px;color:var(--text-strong);display:flex;align-items:center;gap:8px}
.easy-sum ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.easy-sum li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:14px;line-height:1.5;color:var(--text)}
.easy-sum .ei{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;margin-top:1px;background:var(--surface-2);color:var(--text-2)}
.easy-sum .ei.up{background:color-mix(in srgb,#199e70 25%,transparent);color:#2fbf8a}
.easy-sum .ei.down{background:color-mix(in srgb,#e66767 25%,transparent);color:#f2777a}
.easy-sum .ei.warn{background:color-mix(in srgb,#eda100 25%,transparent);color:#eda100}
/* perguntas prontas */
.ask{margin-bottom:16px}
.ask-h{font-size:13px;color:var(--text-2);font-weight:600;margin-bottom:8px}
.ask-chips{display:flex;flex-wrap:wrap;gap:8px}
.ask-chip{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 13px;font-size:13px;text-align:left;line-height:1.3}
.ask-chip:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.ask-chip svg.ico{color:var(--accent);margin-right:7px;vertical-align:-3px}
.ask-ans{font-size:13.5px;color:var(--text-2);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:12px;line-height:1.55}
/* primeiros passos */
.ck{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:16px 18px;margin:0 0 22px;text-align:left}
.ck-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ck-h h2{margin:0;font-size:16px;color:var(--text-strong)}
.ck-h .spacer{flex:1}
.ck-n{font-size:12.5px;color:var(--text-3)}
.ck-bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-bottom:12px}
.ck-bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s var(--ease)}
.ck-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ck-step{display:flex;flex-direction:column;gap:6px;border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--bg)}
.ck-step .t{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--text-strong);font-size:13.5px}
.ck-step .c{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--text-2)}
.ck-step.done .c{background:#199e70;border-color:#199e70;color:#fff}
.ck-step.done .t{color:var(--text-2);text-decoration:line-through;text-decoration-color:var(--text-3)}
.ck-step small{color:var(--text-3);font-size:12px;line-height:1.4;flex:1}
.ck-step .btn{align-self:flex-start}
.ck-step.next{border-color:var(--accent)}
@media (max-width:980px){.ck-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.ck-list{grid-template-columns:1fr}}
/* telas vazias que ensinam */
.teach{border:1px dashed var(--border-strong);border-radius:12px;padding:22px 20px;text-align:center;background:var(--surface);grid-column:1/-1}
.teach b{display:block;font-size:15px;color:var(--text-strong);margin-bottom:6px}
.teach p{margin:0 auto 14px;max-width:520px;color:var(--text-2);font-size:13.5px;line-height:1.55}
.teach .why{font-size:12.5px;color:var(--text-3);margin-top:-6px}
.teach-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
/* desfazer */
.toast.undo{display:flex;align-items:center;gap:14px}
.undo-btn{border:0;background:transparent;color:#7fb2ff;font-weight:700;padding:2px 4px;margin-left:auto}
.undo-btn:hover{text-decoration:underline}
.edit-toggle.on{color:var(--accent)}
.home .ck{width:100%;margin-top:clamp(22px,3vw,34px);margin-bottom:0}
.home-help{width:100%;margin-top:28px}
.home-help .help-line{justify-content:center;margin:0}

/* ===================== Celular =====================
   A tela fica "travada": a página não arrasta para os lados nem quica; só a área de conteúdo rola.
   Abas viram uma barra fixa embaixo (como num app), ações do topo rolam numa linha, janelas abrem
   de baixo para cima e o fundo não rola enquanto um menu ou janela está aberto. */
html,body{overflow:hidden;overscroll-behavior:none}
.app{height:100vh;height:100dvh}
main{overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
.drawer-bg{display:none}
body:has(.modal-bg) main{overflow:hidden}
@media (max-width:860px){
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  header.top{padding-top:env(safe-area-inset-top);height:calc(56px + env(safe-area-inset-top))}
  .app{grid-template-rows:calc(56px + env(safe-area-inset-top)) minmax(0,1fr)}
  main{overflow-x:hidden}
  /* gaveta de bases com fundo escuro; tocar fora fecha */
  aside{top:calc(56px + env(safe-area-inset-top));width:min(86vw,300px);overflow-y:auto;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom)}
  .drawer-bg{position:fixed;inset:0;top:calc(56px + env(safe-area-inset-top));background:rgba(0,0,0,.55);z-index:29;animation:fadein .2s ease both}
  body:has(aside.open) .drawer-bg{display:block}
  body:has(aside.open) main{overflow:hidden}
  /* cabeçalho da base: título em cima, ações numa linha que rola de lado */
  .page-head{gap:12px;padding-top:16px}
  .title-wrap{width:100%;min-width:0}
  .title-input{font-size:24px!important;width:100%}
  .meta-line{font-size:12px}
  .head-actions{flex-wrap:nowrap;overflow-x:auto;width:calc(100% + 32px);margin:0 -16px;padding:2px 16px 6px;scroll-padding-inline:16px;scrollbar-width:none;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
  .head-actions::-webkit-scrollbar{display:none}
  .head-actions .btn{flex:0 0 auto;white-space:nowrap;scroll-snap-align:start;min-height:40px}
  /* abas: barra fixa no rodapé */
  main:has(>.tabs){padding-bottom:calc(62px + env(safe-area-inset-bottom))}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:28;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;padding:0 0 env(safe-area-inset-bottom)!important;margin:0;background:var(--surface);border-top:1px solid var(--border);border-bottom:0!important;box-shadow:0 -8px 24px rgba(0,0,0,.35)}
  .tab{flex-direction:column;justify-content:center;gap:4px;min-height:58px;padding:7px 2px 6px;margin:0;font-size:11px;font-weight:600;letter-spacing:0;border-bottom:0!important;border-top:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .tab svg{width:20px;height:20px;flex:0 0 auto}
  .tab.active{border-top-color:var(--accent);color:var(--text-strong);background:color-mix(in srgb,var(--accent) 8%,transparent)}
  body.tv-on .tabs{display:none}
  .view{padding-bottom:28px}
  /* filtros compactos */
  .filters{padding:12px;gap:8px}
  .qper{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px 2px;scroll-padding-inline:12px;overscroll-behavior-x:contain}
  .qper::-webkit-scrollbar{display:none}
  .qper .qp,.qper-lb{flex:0 0 auto}
  .filters>.field{flex:1 1 calc(50% - 4px);min-width:0}
  .filters>.field select,.filters>.field input{width:100%;min-width:0;min-height:38px}
  .filters>.btn{flex:1 1 100%}
  .f-tools{width:100%;display:flex;gap:8px;margin-left:0}
  .f-tools .btn{flex:1 1 0;min-height:38px;white-space:normal;line-height:1.25}
  /* indicadores */
  .kpi{min-width:0;padding:12px!important}
  .kpi .vl{font-size:21px!important;overflow-wrap:anywhere}
  .kpi .sm{font-size:11px}
  /* gráficos */
  .chart-card{padding:12px 12px 10px;border-radius:12px}
  .chart-box{height:240px}
  .chart-card.wide .chart-box{height:260px}
  .chart-head{gap:2px}
  .chart-title{font-size:15px}
  .chart-controls{gap:6px}
  .chart-controls select{flex:1 1 calc(50% - 3px);max-width:none;min-width:0;min-height:36px;font-size:13px}
  .chart-controls .btn{flex:1 1 100%;min-height:36px}
  .icon-btn{min-width:36px;min-height:36px;display:inline-grid;place-items:center}
  .drag-h{display:none}
  .chart-note{font-size:12.5px}
  .chart-pivot,.chart-table,.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;max-width:100%}
  /* janelas: abrem de baixo, ocupam a largura e rolam por dentro */
  .modal-bg{place-items:end center;padding:0;overscroll-behavior:contain}
  .modal,.modal.wide,.modal.xwide{max-width:100%!important;width:100%;max-height:92vh;max-height:92dvh;border-radius:16px 16px 0 0!important;padding:18px 16px calc(14px + env(safe-area-inset-bottom));overscroll-behavior:contain;box-shadow:0 -12px 40px rgba(0,0,0,.6)!important;animation:sheetup .28s var(--ease) both}
  .modal::before{content:'';display:block;width:40px;height:4px;border-radius:4px;background:var(--border-strong);margin:-6px auto 12px}
  .modal h3{font-size:18px}
  .modal .actions{position:sticky;bottom:calc(-14px - env(safe-area-inset-bottom));margin:16px -16px calc(-14px - env(safe-area-inset-bottom));padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border);z-index:2}
  .modal .actions .btn{flex:1;min-height:42px}
  /* menu "••• Mais" abre de baixo, como as janelas */
  .pop-bg{background:rgba(0,0,0,.55)}
  .pop-menu{left:0!important;right:0;bottom:0;top:auto!important;max-width:none;width:100%;border-radius:16px 16px 0 0;padding:8px 8px calc(10px + env(safe-area-inset-bottom));animation:sheetup .25s var(--ease) both}
  .pop-it{padding:12px 10px}
  .help-line{margin:0 0 10px}
  .easy-sum li{font-size:13.5px}
  .ask-chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none;scroll-padding-inline:16px}
  .ask-chips::-webkit-scrollbar{display:none}
  .ask-chip{flex:0 0 auto;max-width:260px;white-space:normal}
  /* avisos acima da barra de abas */
  .toast-wrap{left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));align-items:stretch}
  .toast{max-width:none}
  .btn{min-height:36px}
}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* ===== Ícones de linha fina ===== */
.add-in{display:inline-flex;align-items:center;gap:8px}
svg.ico{flex:none;display:inline-block;vertical-align:-3px;overflow:visible}
.btn svg.ico{color:var(--text-2);margin-left:-2px}
.btn.primary svg.ico{color:inherit}
.btn:hover svg.ico{color:inherit}
.icon-btn{display:inline-grid;place-items:center;line-height:1}
.icon-btn svg.ico{width:15px;height:15px}
.icon-btn:hover{color:var(--text-strong)}
.tab svg.ico{color:var(--text-3)}
.tab.active svg.ico,.tab:hover svg.ico{color:inherit}
table.data th .ty{display:inline-flex;align-items:center;margin:0 7px 0 0;vertical-align:-2px;color:var(--text-3);font-size:inherit;letter-spacing:0}
table.data th.num .ty{margin:0 7px 0 0}
table.data th .ty svg{width:14px;height:14px}
.help-btn{padding:4px 11px 4px 8px}
.help-btn svg.ico{color:var(--accent)}
.tv-btn{display:inline-flex;align-items:center;gap:6px}
.pop-it svg.ico{width:16px;height:16px}
.search svg.ico{width:15px;height:15px;color:var(--text-3)}
@media (hover:hover){ table.data td.rowact .icon-btn{opacity:0;transition:opacity .15s} table.data tr:hover td.rowact .icon-btn,table.data td.rowact .icon-btn:focus-visible{opacity:1} }
table.data td.rowact .icon-btn:hover{color:var(--danger,#e5484d)}
/* ===== Nome da planilha inteiro ===== */
textarea.title-input{display:block;resize:none;overflow:hidden;max-width:none;width:100%;white-space:pre-wrap;word-break:break-word;line-height:1.12;font:inherit;color:var(--text-strong,#fff);font-family:var(--display);font-weight:700}
textarea.title-input{font-size:clamp(22px,2.4vw,34px)}
textarea.title-input.long{font-size:clamp(20px,1.9vw,28px)}
.title-wrap{min-width:0;flex:1 1 360px}
.base-item .nm{white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;line-height:1.25;word-break:break-word}
@media (max-width:860px){ textarea.title-input,textarea.title-input.long{font-size:22px!important} }

/* =====================================================================
   SISTEMA VISUAL "LIVRO-CAIXA" (nov/2026), revisado com unslop by @heydamir (CC BY 4.0)
   Direção: exato, paciente, didático. O livro-caixa de quem cuida das contas.
   - Superfícies grafite neutras; profundidade por degraus de superfície e linhas finas, sem brilhos.
   - Uma cor de destaque (o azul da marca, a "caneta de conferência"), usada pouco:
     ação principal, seleção e a série que importa no gráfico.
   - Títulos em peso 500; espaçamento negativo só em títulos grandes.
   - Assinatura: o traço de ritmo (onde você deveria estar hoje) nas barras de meta.
   Medidas que o celular ajusta ficam em @media (min-width:861px).
   ===================================================================== */
:root{
  --bg:#141415; --surface:#19191b; --surface-2:#202022; --surface-3:#28282b; --sidebar:#0f0f10;
  --border:rgba(237,237,237,.08); --border-strong:rgba(237,237,237,.13); --line:rgba(237,237,237,.08); --grid:#232325;
  --text:#dcdcde; --text-strong:#ededed; --text-2:#a1a1a6; --text-3:#85858b;
  --accent:#4a7dff; --accent-strong:#3563e0; --accent-hover:#2f5bd6; --accent-weak:#1b2236; --accent-ring:rgba(74,125,255,.35);
  --bar-neutral:#4a4a50;
  --good:#4cc38a; --warn:#e2a336; --danger:#e5484d; --danger-weak:#2a1718;
  --r:8px; --r-lg:12px;
  --e1:none;
  --e2:0 12px 32px -12px rgba(0,0,0,.6);
  --e3:0 24px 64px -16px rgba(0,0,0,.7);
  --ease:cubic-bezier(.22,1,.36,1);
}
body{background:var(--bg);font-feature-settings:'cv11','ss01'}
::selection{background:rgba(74,125,255,.35);color:#fff}
*{scrollbar-width:thin;scrollbar-color:#3a3a3e transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#333337;border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:#45454a}
::-webkit-scrollbar-track{background:transparent}
main{background:var(--bg)}

/* topo e logo: marca plana, cor sólida, sem brilho */
header.top{background:var(--sidebar);border-bottom:1px solid var(--border)}
.logo-mark,.login-mark{background:var(--accent);box-shadow:none}
.logo{letter-spacing:0;font-weight:500}
.userchip{border-color:var(--border);background:transparent}
.avatar{background:var(--surface-3);color:var(--text-strong)}

/* menu lateral */
aside{background:var(--sidebar);border-right:1px solid var(--border)}
.aside-head h2{font-size:12px!important;font-weight:500!important;color:var(--text-3)}
.base-item{border-radius:8px;transition:background-color .15s var(--ease)}
.base-item:hover{background:var(--surface)}
.base-item.active{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--accent)}
.base-item .nm{font-weight:500}
.base-item .ic{background:var(--surface);border:1px solid var(--border);color:var(--text-2)}
.base-item.active .ic{background:var(--surface-3);border-color:var(--border-strong);color:var(--text-strong)}
.base-item .sub{color:var(--text-3)}
.aside-foot{border-top:1px solid var(--border)}

/* botões: cor sólida; o principal tem só um realce fino no topo */
.btn{background:var(--surface-2);color:var(--text-strong);border:1px solid var(--border-strong);box-shadow:none;font-weight:500;transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .12s var(--ease)}
.btn:hover:not(:disabled){background:var(--surface-3);border-color:rgba(237,237,237,.18)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.primary{background:var(--accent-strong);border-color:transparent;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.btn.primary:hover:not(:disabled){background:var(--accent-hover);border-color:transparent}
.btn.danger{background:transparent;border-color:rgba(229,72,77,.45);color:var(--danger)}
.btn.danger:hover:not(:disabled){background:var(--danger-weak);border-color:var(--danger)}
.btn:disabled{opacity:.5}
.btn.whats{background:#15803d;border-color:transparent;color:#fff}
.btn.whats:hover:not(:disabled){background:#166534}
.icon-btn{color:var(--text-3);transition:background-color .15s var(--ease),color .15s var(--ease)}
.icon-btn:hover{background:var(--surface-2);color:var(--text-strong)}
.help-btn{border-color:var(--border-strong);background:transparent;color:var(--text-2);font-weight:500}
.help-btn:hover{background:var(--surface-2);color:var(--text-strong)}
.help-btn svg.ico{color:var(--text-3)}
.google-btn{box-shadow:none;font-weight:500}

/* campos */
.field select,.field input,.chart-controls select,.search input,.col-row select,.form-grid .field input,.goal-form .field>input,.sheet-form .field>input,.share-url input,.modal textarea{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px;color:var(--text-strong);transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
input:focus,select:focus,textarea:focus{outline:0!important;border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent-ring)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search input{background:var(--surface)}

/* abas (no computador; no celular viram a barra do rodapé) */
@media (min-width:861px){
  .tab{color:var(--text-2);font-weight:500;border-radius:8px 8px 0 0;transition:color .15s var(--ease),background-color .15s var(--ease)}
  .tab:hover{color:var(--text-strong);background:var(--surface)}
  .tab.active{color:var(--text-strong);border-bottom-color:var(--accent)}
}
.tabs{border-bottom-color:var(--border)}

/* cartões: superfície um degrau acima do fundo e linha fina, sem sombra */
.chart-card,.kpis,.table-card,.p-card,.filters,.rel-item,.profile-hero,.preview,.goal,.anom-card,.lp-f,.qcard,.bcard,.h-ledger,.teach,.goals-empty,.login-card,.easy-sum,.ck-step,.h-index .ix,.h-index .ix:last-child{background:var(--surface);border-color:var(--border);box-shadow:none}
.chart-card{border-radius:var(--r-lg);transition:border-color .15s var(--ease)}
.chart-card:hover{border-color:var(--border-strong)}
.chart-card.editing{border-color:var(--accent)}
.chart-title{color:var(--text-strong);letter-spacing:0;font-weight:500}
.chart-sub{color:var(--text-3)}
.chart-note{border-top:1px solid var(--border);background:transparent;color:var(--text-2)}
.chart-note b{color:var(--text-3);font-weight:500}
.kpis{border-radius:var(--r-lg);overflow:hidden}
.kpis .kpi{background:transparent;border-color:var(--border)}
.kpi .vl{color:var(--text-strong);font-weight:500;font-variant-numeric:tabular-nums}
.kpi .lb{color:var(--text-3)}
.goal{border-radius:var(--r-lg)}
.g-bar{background:var(--surface-3)}
.anom-card{border-radius:var(--r-lg)}
.add-card{border-color:var(--border-strong);background:transparent;font-weight:500}
.add-card:hover{border-color:var(--text-3);background:var(--surface);color:var(--text-strong)}
@media (min-width:861px){
  .chart-card{padding:20px 20px 16px}
  .kpi{padding:16px 20px}
  .goal{padding:16px 20px}
  .anom-card{padding:12px 16px}
  .filters{padding:12px 16px}
  .easy-sum{padding:16px 20px}
}

/* resumo, perguntas e período */
.easy-sum{border:1px solid var(--border)}
.ask-chip{background:transparent;border-color:var(--border-strong);color:var(--text);transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.ask-chip:hover{border-color:rgba(237,237,237,.22);background:var(--surface)}
.qp{background:transparent;border-color:var(--border-strong);color:var(--text-2)}
.qp:hover{background:var(--surface-2);color:var(--text-strong)}
.qp.on{background:var(--surface-3);border-color:rgba(237,237,237,.22);color:var(--text-strong);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.chip{border-color:var(--border-strong);color:var(--text-2)}
.filter-chip{background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text-strong)}

/* tabela densa: cabeçalho, linha sob o mouse e foco se distinguem */
.table-card{border-radius:var(--r-lg);overflow:hidden}
table.data th{background:var(--surface-2);color:var(--text-2);font-weight:500;font-size:12.5px;border-bottom:1px solid var(--border-strong)}
table.data th:hover{color:var(--text-strong)}
table.data td{border-bottom-color:var(--border);color:var(--text)}
table.data tbody tr:hover td{background:var(--surface-2)}
.pager{border-top:1px solid var(--border);background:var(--surface)}

/* janelas, menus e avisos: só o que flutua tem sombra, neutra */
.modal-bg{background:rgba(8,8,9,.7)}
.modal{background:var(--surface);border:1px solid var(--border-strong);box-shadow:var(--e3)}
.modal h3{font-weight:500}
.pop-menu{background:var(--surface);border-color:var(--border-strong);box-shadow:var(--e3)}
.pop-it b{font-weight:500}
.pop-it:hover:not(:disabled),.pop-it:focus-visible{background:var(--surface-2)}
.toast{background:var(--surface-3);color:var(--text-strong);border:1px solid var(--border-strong);box-shadow:var(--e2)}
.toast.err{background:#2e1416;border-color:rgba(229,72,77,.5);color:#ffd9da}
.tour-card{background:var(--surface);border-color:var(--border-strong);box-shadow:var(--e3)}
.banner{background:var(--surface);border-color:var(--border)}
.banner.warn{background:var(--surface);border-color:rgba(226,163,54,.35);color:var(--text)}
.dirtybar{background:var(--surface-2);border:1px solid var(--border-strong)}
.sug,.type-opt,.choice{background:var(--surface-2);border-color:var(--border)}
.sug:hover,.type-opt:hover:not(:disabled),.choice:hover{border-color:rgba(237,237,237,.22);background:var(--surface-3)}
.sug.sel,.type-opt.sel{border-color:var(--accent);background:var(--surface-3)}

/* primeiros passos */
.ck-step.next{border-color:var(--border-strong);background:var(--surface-2)}
.ck-step.done .c{background:var(--good);border-color:var(--good);color:#0f0f10}
.ck-bar{background:var(--surface-3)}
.ck-bar i{background:var(--accent)}

/* página inicial */
.home .home-drop{background:var(--surface);border-color:var(--border-strong)}
.home .home-drop:hover,.home .home-drop.over{border-color:var(--text-3);background:var(--surface-2)}
.home .home-drop .di{background:var(--surface-3);color:var(--text-strong)}
.h-index .ix:hover:not(:disabled){background:var(--surface-2);border-color:var(--border-strong)}
.qcard:hover:not(:disabled){transform:none;border-color:var(--border-strong)}
.qcard .qi,.lp-ic{background:var(--surface-3);color:var(--text-2)}
.lg-row:hover{background:var(--surface)}

/* títulos: hierarquia por tamanho e cor, peso 500; nada de degradê no texto */
h1,h2,h3,.title-input,textarea.title-input,.h-hero h1,.login-main h1,.home .home-drop h3,.lp-sec h2,.empty-box h1,.model-head h1,.profile-hero h1,.h-ledger .v,.ix b,.steps b,.qcard b,.lp-f b,.mhead .mname,.p-card h2{font-weight:500;color:var(--text-strong);background:none;-webkit-text-fill-color:currentColor}
.easy-sum h3,.goals-h h3,.anom h3,.ck-h h2,.sec-title h2,.tour-card b,.teach b,.chart-title,.goal b,.anom-card b,.ck-step .t{font-family:var(--sans);letter-spacing:0;font-weight:500}
.goals-h h3,.anom h3{font-size:16px}
.login-main{background:none}
.login-side{background:var(--sidebar);border-left:1px solid var(--border)}

/* indicadores ocupam a faixa toda, sem casa vazia no fim */
@media (min-width:861px){ .kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))} }

/* ---------- Prévia do painel na entrada (dados fictícios) ----------
   O "momento" da página de entrada: o que o produto entrega, desenhado em código. */
.lp-prev{border:1px solid var(--border-strong);border-radius:16px;background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:16px;max-width:520px;width:100%}
.lp-prev .ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.lp-prev .ph b{font-weight:500;color:var(--text-strong);font-size:14px}
.lp-prev .ph span{font-size:12px;color:var(--text-3)}
.lp-prev .pk{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lp-prev .pk small{display:block;font-size:12px;color:var(--text-3)}
.lp-prev .pk .v{font-size:32px;line-height:1;font-weight:500;color:var(--text-strong);font-variant-numeric:tabular-nums;margin-top:8px;font-family:var(--sans)}
.lp-prev .pk .d{font-size:12px;color:var(--good);font-variant-numeric:tabular-nums;white-space:nowrap}
.lp-prev .pc{display:block;width:100%;height:auto}
.lp-prev .pc text{fill:var(--text-3);font:400 11px var(--sans);font-variant-numeric:tabular-nums}
.lp-prev .pn{font-size:12.5px;line-height:1.5;color:var(--text-2);border-top:1px solid var(--border);padding-top:12px}
.lp-prev .pn b{color:var(--text-3);font-weight:500;display:block;margin-bottom:2px}
.lp-prev .pg{display:flex;flex-direction:column;gap:8px}
.lp-prev .pg .gt{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.lp-prev .pg .gt b{font-weight:500;color:var(--text-strong)}
.lp-prev .gb{position:relative;height:8px;border-radius:4px;background:var(--surface-3)}
.lp-prev .gb i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--good)}
.lp-prev .gb u{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--text-strong)}
.lp-prev .gs{font-size:12px;color:var(--text-3)}
.login-side .kicker{margin-top:8px}
.steps .n{color:var(--text-3);font-weight:500;font-variant-numeric:tabular-nums}
.h-hero p{max-width:44ch}
@media (min-width:861px){ .login-side{justify-content:center;gap:24px} }

@media (prefers-reduced-motion:reduce){ .enter>*,.enter .stagger>*{animation:none!important} }
</style>
</head>

r planilhas, CNPJ/CEP</div></div></button><button class="base-item" id="profileNav" title="Meu perfil"><div class="ic" id="profileNavIc"></div><div class="txt"><div class="nm">Meu perfil</div><div class="sub" id="profileNavSub">Nome, função e empresa</div></div></button></div>
  </aside>

  <main id="main"></main>
</div>

<script>
/* ============ Configuração do Firebase ============
   Cole aqui os dados do seu app web (Console do Firebase > Configurações do projeto > Seus apps). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDKRHW_MHnZupX9mmNK5DGmhlJPA5b1ppM",
  authDomain: "projeto-planilhas-df717.firebaseapp.com",

  messagingSenderId: "393662053162",
  appId: "1:393662053162:web:cd02d29d0cd91970abfc53"
};

/* ============ Estado ============ */
const S = {
  db:null, uid:null, me:null, mode:'loading', // loading | login | setup | cloud | local
  auth:null, unsubBases:null,
  view:'home', // home | base | perfil | modelo
  profile:{}, profileDirty:false, unsubProfile:null, authUser:null,
  model:{relationships:[],positions:{}}, rowCache:{},
  bases:[], basesLoaded:false,
  currentId:null, rows:null, loadingRows:false,
  tab: ({'#graficos':'graficos','#relatorios':'relatorios','#apresentacao':'apresentacao'})[location.hash]||'dados', deckCfg:{},
  page:0, pageSize:50, sort:{col:-1,dir:1}, search:'',
  dirty:false, readOnly:false,
  vfilter:{col:'',val:'',from:'',to:''},
  uploadMode:'new', // new | replace | append
  local:{} // id -> {meta, rows} quando sem login
};
const charts = []; // instâncias Chart.js ativas
let downloads = null;

/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k==='class') e.className=v;
    else if (k==='text') e.textContent=v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v!==false && v!=null) e.setAttribute(k, v===true?'':v);
  }
  for (const k of kids.flat()) if (k!=null && k!==false) e.append(k.nodeType?k:document.createTextNode(String(k)));
  return e;
};
const nf = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2});
const nfc = new Intl.NumberFormat('pt-BR',{notation:'compact',maximumFractionDigits:1});
const fmtNum = n => (n==null||isNaN(n))?'—':(Math.abs(n)>=1e6?nfc.format(n):nf.format(n));
const fmtDate = s => { if(!s) return ''; const [y,m,d]=s.split('-'); return d?`${d}/${m}/${y}`:(m?`${m}/${y}`:y); };
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const fmtWhen = t => { if(!t) return ''; const d=new Date(t); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
const uid8 = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(msg, err=false, ms=3800){ const t=el('div',{class:'toast'+(err?' err':''),text:msg}); $('#toasts').append(t); setTimeout(()=>t.remove(),ms); return t; }
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

/* ============ Conversão de valores ============ */
function parseNum(v){
  if (v==null || v==='') return NaN;
  if (typeof v==='number') return v;
  if (typeof v==='boolean') return NaN;
  // aceita formatos de extrato: "+R$ 22,00", "−R$ 260,00", "R$ -5,00", "1.234,56 D", "260,00-"
  let s=String(v).trim().replace(/[−–—]/g,'-').replace(/ /g,' ');
  let neg=false;
  const tail=s.match(/^(.*\d)\s*([DC]|-)$/i); if(tail){ s=tail[1]; if(tail[2]==='-'||tail[2].toUpperCase()==='D') neg=true; }
  const sign=()=>{ s=s.replace(/^([+-])\s*/,(x,g)=>{ if(g==='-') neg=!neg; return ''; }); };
  sign(); s=s.replace(/^R\$\s?/i,''); sign();
  s=s.replace(/\s/g,'').replace(/%$/,'');
  if(/^\(.*\)$/.test(s)){neg=!neg;s=s.slice(1,-1);}
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s) || /^-?\d+,\d+$/.test(s)) s=s.replace(/\./g,'').replace(',','.');
  else if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s=s.replace(/,/g,'');
  else if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  const n=parseFloat(s); return neg?-n:n;
}
function pad(n){return String(n).padStart(2,'0');}
function parseDate(v){
  if (v==null || v==='') return null;
  if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;

  if ((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2}|\d{4})(\s.*)?$/))) { let y=+m[3]; if(y<100)y+=2000; const mo=+m[2], d=+m[1]; if(mo<1||mo>12||d<1||d>31) return null; return `${y}-${pad(mo)}-${pad(d)}`; }

const MES_N={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
// procura uma data dentro de um texto livre ("04 de novembro 2026", "05/11/2026")
function findDate(t){

  if (m) return `${m[3]}-${pad(MES_N[m[2].toLowerCase()])}-${pad(+m[1])}`;

function detectType(name, values){

  const sample=vals.length>3000?vals.filter((_,i)=>i%Math.ceil(vals.length/3000)===0):vals;
  let n=0,d=0;
  for (const v of sample){ if(v instanceof Date){d++;continue;} if(!isNaN(parseNum(v))) n++; else if(parseDate(v)) d++; }
  if (d/sample.length>=.85) return 'date';
  if (n/sample.length>=.85) return CODE_RX.test(name)?'text':'number';

function convert(v,type){

  if (type==='date'){ const d=parseDate(v); return d||(v instanceof Date?null:String(v)); }
  if (v instanceof Date) return parseDate(v);

}

  if (type==='date' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return fmtDate(v);
  return String(v);
}

async function readWorkbook(file){
  const ext=file.name.split('.').pop().toLowerCase();
  let wb;
  if (['csv','tsv','txt'].includes(ext)){
    const buf=await file.arrayBuffer();
    let text=new TextDecoder('utf-8').decode(buf);
    if (text.includes(String.fromCharCode(0xFFFD))) text=new TextDecoder('windows-1252').decode(buf);
    wb=XLSX.read(text,{type:'string',raw:true});
  } else {
    wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  }
  const out=[];
  for (const sn of wb.SheetNames){
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null,blankrows:false});
    const t=tableFromAoa(aoa); if(!t) continue;
    const base=file.name.replace(/\.[^.]+$/,'');
    t.name = wb.SheetNames.length>1 ? `${base} — ${sn}` : base;
    t.fileName=file.name; t.sheet=sn;
    out.push(t);
  }
  return out;
}
/* Planilha com várias abas (ex.: uma por mês): junta numa base só, com uma coluna dizendo de qual aba veio

   colunas; abas de resumo/total e abas com outro formato viram bases separadas, para não somar nada em dobro. */
const MES_FULL=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function sheetMonth(name){
  const s=fold(name).trim(); let m=-1, y=(s.match(/(20\d{2})/)||[])[1]||null;
  MES_FULL.forEach((n,i)=>{ if(m<0&&(s.includes(n)||new RegExp('(^|[^a-z])'+n.slice(0,3)+'([^a-z]|$)').test(s))) m=i; });
  if (m>=0&&!y){ const yy=s.match(/[^0-9](\d{2})$/); if(yy) y='20'+yy[1]; }
  if (m<0){ let n=s.match(/^(\d{1,2})\s*[\/\-. ]\s*(20\d{2}|\d{2})$/); if(n){ m=+n[1]-1; y=n[2].length===2?'20'+n[2]:n[2]; }
    else if((n=s.match(/^(20\d{2})\s*[\/\-. ]\s*(\d{1,2})$/))){ y=n[1]; m=+n[2]-1; } }

const SUMMARY_RX=/total|resumo|consolid|geral|dashboard|gr[aá]fico|painel|instru[cç]|capa|[ií]ndice|par[aâ]metro|legenda|tabela din/i;

  const main=list.filter(t=>!SUMMARY_RX.test(t.sheet)).reduce((a,b)=>!a||b.rows.length>a.rows.length?b:a,null)||list[0];
  const mk=new Set(main.columns.map(c=>key(c.name)));
  const join=[], apart=[];
  for (const t of list){
    const k=t.columns.map(c=>key(c.name)), hit=k.filter(x=>mk.has(x)).length/Math.max(k.length,mk.size);
    if (t===main||(!SUMMARY_RX.test(t.sheet)&&hit>=0.6)) join.push(t); else apart.push(t);
  }
  if (join.length<2) return {tables:list,merged:0};

  const cols=[], idx=new Map();

  const asDate=isMonth&&months.every(x=>x&&(x.y||fileYear));
  let src=isMonth?'Mês':'Aba'; while(cols.some(c=>key(c.name)===key(src))) src+=' (aba)';

    const map=t.columns.map(c=>idx.get(key(c.name)));
    const tag=asDate?`${months[ti].y||fileYear}-${pad(months[ti].m+1)}-01`:t.sheet;
    for (const r of t.rows){ const a=new Array(cols.length).fill(null); r.forEach((v,j)=>{ const ci=map[j]; a[ci]=t.columns[j].type===cols[ci].type?v:convert(v,cols[ci].type); }); a[cols.length-1]=tag; rows.push(a); }
  });

function tableFromAoa(aoa){
  aoa=aoa.filter(r=>r && r.some(c=>c!=null && String(c).trim()!==''));
  if (!aoa.length) return null;
  // linha de cabeçalho: a com mais células preenchidas entre as 10 primeiras
  let hi=0,best=-1;
  for (let i=0;i<Math.min(10,aoa.length);i++){ const c=aoa[i].filter(x=>x!=null&&String(x).trim()!=='').length; if(c>best+0){ if(c>best){best=c;hi=i;} } }
  const width=Math.max(...aoa.map(r=>r.length));
  const hdr=aoa[hi]; const seen={};
  let names=[];
  for (let j=0;j<width;j++){
    let n=hdr[j]; n=(n==null||String(n).trim()==='')?`Coluna ${j+1}`:(n instanceof Date?parseDate(n):String(n).trim());
    if (seen[n]){ seen[n]++; n=`${n} (${seen[n]})`; } else seen[n]=1;
    names.push(n);
  }
  let body=aoa.slice(hi+1).map(r=>{ const a=new Array(width); for(let j=0;j<width;j++) a[j]=r[j]==null?null:r[j]; return a; });
  // remove colunas totalmente vazias e sem nome real
  const keep=names.map((n,j)=>!(n.startsWith('Coluna ') && body.every(r=>r[j]==null||r[j]==='')));
  names=names.filter((_,j)=>keep[j]); body=body.map(r=>r.filter((_,j)=>keep[j]));
  if (!names.length) return null;
  const columns=names.map((name,j)=>({name,type:detectType(name,body.map(r=>r[j]))}));
  const rows=body.map(r=>r.map((v,j)=>convert(v,columns[j].type)));
  return {columns,rows};
}

/* ============ Leitura de PDF e imagens ============
   PDF com texto: PDF.js (posição de cada trecho na página).
   Imagem ou PDF escaneado: OCR com Tesseract.js (português).
   Em ambos os casos a tabela é remontada pela posição: o cabeçalho define as colunas
   e cada linha de dados é ancorada na coluna mais "regular" (hora, data ou valor). */
const DOC_EXT=['pdf','png','jpg','jpeg','webp','bmp','gif'];
const libCache={};
function loadScript(src){

    const s=document.createElement('script'); s.src=src; s.onload=ok;
    s.onerror=()=>{ delete libCache[src]; s.remove(); err(Object.assign(new Error('lib'),{code:'lib-load'})); };

async function getPdfjs(){

  return pdfjsLib;
}
let ocrWorkerP=null, ocrProgress=null;
async function getOcr(){
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  if (!ocrWorkerP) ocrWorkerP=Tesseract.createWorker('por',1,{logger:m=>{ if(m.status==='recognizing text'&&ocrProgress) ocrProgress(m.progress||0); }}).catch(e=>{ ocrWorkerP=null; throw e; });

async function ocrItems(src,onProgress){

      .map(x=>({str:x.text.trim(),x0:x.bbox.x0,x1:x.bbox.x1,y:x.bbox.y1,h:Math.max(1,x.bbox.y1-x.bbox.y0)}));

async function prepImage(file){

    const sc=bmp.width<1600?Math.min(3,1600/bmp.width):1; // amplia imagens pequenas para o OCR acertar mais
    const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*sc); cv.height=Math.round(bmp.height*sc);
    const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); ctx.drawImage(bmp,0,0,cv.width,cv.height);

async function pdfPages(file,status){

    status(`Lendo PDF: página ${p} de ${pdf.numPages}…`);
    const page=await pdf.getPage(p); const vp=page.getViewport({scale:1});
    const tc=await page.getTextContent();

// agrupa trechos em linhas (mesma altura) e junta palavras próximas em "frases"
function toLines(items){
  const sorted=[...items].sort((a,b)=>a.y-b.y||a.x0-b.x0);
  const lines=[];
  for (const it of sorted){ const ln=lines[lines.length-1]; if(ln&&Math.abs(it.y-ln.y)<=Math.max(2,0.4*Math.min(it.h,ln.h))) ln.items.push(it); else lines.push({y:it.y,h:it.h,items:[it]}); }
  for (const ln of lines){
    ln.items.sort((a,b)=>a.x0-b.x0);
    const ph=[];
    for (const it of ln.items){
      const last=ph[ph.length-1], s=it.str.trim(); if(!s) continue;
      const gap=last?it.x0-last.x1:Infinity;
      if (last&&gap<Math.max(it.h,last.h)*0.8){ last.str+=(gap>Math.min(it.h,last.h)*0.12?' ':'')+s; last.x1=Math.max(last.x1,it.x1); }

const HEAD_RX=/^(data|dt\b|dia\b|hora|hor[aá]rio|tipo|descri|hist[oó]rico|lan[cç]amento|origem|destino|favorecido|benefici|documento|doc\b|n[ºo°.]|n[uú]mero|valor|vlr|saldo|d[eé]bito|cr[eé]dito|entrada|sa[ií]da|forma|categoria|estabelecimento|parcela|quantidade|qtd|pre[cç]o|total|produto|item|cliente|vencimento|status|situa|ag[eê]ncia|conta|opera[cç]|natureza|referente|identifica|movimenta|nome|cpf|cnpj|pagador|recebedor)/i;

function atomKind(s){

  if (/^\d{1,2}[\/.-]\d{1,2}([\/.-]\d{2,4})?$/.test(s)||/^\d{4}-\d{2}-\d{2}$/.test(s)||(s.length<=24&&/^\d{1,2}\s*(de\s+)?[a-zç]{3,}\.?\s*(de\s+)?\d{4}$/i.test(s)&&parseDate(s))) return 'date';

  if (best>=0) return best;

  cols.forEach((c,i)=>{ const d=cx<c.x0?c.x0-cx:cx>c.x1?cx-c.x1:0; if(d<bd){bd=d;best=i;} });

  const kinds={}; ph.forEach(p=>{ if(p.c===ac){ const k=atomKind(p.str); if(k) kinds[k]=(kinds[k]||0)+1; } });

// sem cabeçalho reconhecível: tenta linhas "data  descrição  valor  [saldo]"; senão, uma linha por registro
function fallbackTable(lines,year){

  else { status('Preparando imagem…'); const img=await prepImage(file); status('Carregando leitor de imagem (OCR)…'); pages=[await ocrItems(img,pr=>status(`Reconhecendo texto da imagem (OCR)… ${Math.round(pr*100)}%`))]; method='ocr'; }
  const lines=pages.map(toLines);
  const text=lines.map(ls=>ls.map(l=>l.text).join('\n')).join('\n\n— nova página —\n\n');
  const year=(text.match(/\b(20\d{2})\b/)||[])[1];
  let aoas=extractTables(lines), structured=true;
  if (!aoas.length){ const fb=fallbackTable(lines.flat(),year); aoas=[fb.aoa]; structured=fb.structured; }
  const base=file.name.replace(/\.[^.]+$/,''), tables=[];
  aoas.forEach((aoa,i)=>{ if(aoa.length<2) return; const t=tableFromAoa(aoa); if(!t) return; enrichStatement(t); categorizeTable(t); t.name=aoas.length>1?`${base} — tabela ${i+1}`:base; t.fileName=file.name; tables.push(t); });

}

        el('thead',{},el('tr',{},t.columns.map(c=>el('th',{class:c.type==='number'?'num':''},tyIcon(c.type),c.name)))),
        el('tbody',{},show.map(r=>el('tr',{},r.map((v,j)=>el('td',{class:t.columns[j].type==='number'?'num':''},v==null||v===''?el('span',{class:'null',text:'—'}):display(v,t.columns[j].type))))))))));

    }

    bg.append(m); document.body.append(bg);

const enc=new TextEncoder();
const MAX_CHUNK=190*1024;
function chunkRows(rows){
  const chunks=[]; let cur=[], size=20;
  for (const r of rows){ const s=enc.encode(JSON.stringify(r)).length+1; if(cur.length && size+s>MAX_CHUNK){chunks.push(cur);cur=[];size=20;} cur.push(r); size+=s; }
  if (cur.length||!chunks.length) chunks.push(cur);
  return chunks;
}
const basesCol = () => S.db.doc(`data/users/${S.uid}/app`).collection('bases');
const chunkCol = id => basesCol().doc(id).collection('chunks');
const cid = i => String(i).padStart(4,'0');
let writeChain=Promise.resolve();
function queue(fn){ const p=writeChain.then(fn); writeChain=p.catch(()=>{}); return p; }
async function retry(fn){ try{ return await fn(); }catch(e){ if(e&&e.code==='unavailable'){ await new Promise(r=>setTimeout(r,400+Math.random()*600)); return fn(); } throw e; } }
function handleWriteError(e){
  console.error(e);
  if (e && e.code==='permission-denied') toast('Não foi possível salvar: sua conta não tem permissão aqui. Saia e entre de novo; se continuar, fale com quem administra o painel.',true,7000);
  else if (e && e.code==='unauthenticated'){ toast('Sua sessão expirou. Entre novamente com o Google.',true,7000); }
  else if (e && e.code==='resource-exhausted') toast('O espaço para guardar planilhas acabou. Exclua planilhas antigas que você não usa mais e tente de novo.',true,7000);
  else toast('Não foi possível salvar agora. Confira sua internet e tente de novo em instantes.',true,6000);
}

async function saveBase(meta, rows, reason){
  applyCalcs(meta,rows); // colunas calculadas sempre atualizadas com os dados
  await snapshotVersion(meta,reason); // guarda a versão anterior (histórico)
  meta.rowCount=rows.length; meta.updatedAt=Date.now();
  if (S.mode!=='cloud'){ S.local[meta.id]={meta:structuredClone(meta),rows:rows.map(r=>r.slice())}; upsertLocalMeta(meta); if(meta.id===S.currentId) setBaseline(meta,rows); return; }
  return queue(async()=>{
    const chunks=chunkRows(rows);
    const old=S.bases.find(b=>b.id===meta.id)?.chunkCount||0;
    // Firestore não aceita array dentro de array: cada bloco de linhas vai como texto JSON
    for (let i=0;i<chunks.length;i++) await retry(()=>chunkCol(meta.id).doc(cid(i)).set({json:JSON.stringify(chunks[i])}));
    meta.chunkCount=chunks.length;
    await retry(()=>basesCol().doc(meta.id).set(meta));
    for (let i=chunks.length;i<old;i++) await retry(()=>chunkCol(meta.id).doc(cid(i)).delete());
  }).then(()=>{ scheduleShare(meta); if(meta.id===S.currentId) setBaseline(meta,rows); });
}
async function saveMeta(meta){
  meta.updatedAt=Date.now();
  if (S.mode!=='cloud'){ if(S.local[meta.id]) S.local[meta.id].meta=structuredClone(meta); upsertLocalMeta(meta); return; }
  return queue(()=>retry(()=>basesCol().doc(meta.id).set(meta))).then(()=>scheduleShare(meta));
}
async function deleteBase(meta){
  if (S.mode!=='cloud'){ delete S.local[meta.id]; S.bases=S.bases.filter(b=>b.id!==meta.id); return; }
  return queue(async()=>{
    try{ for (const v of (await verCol(meta.id).get()).docs.map(d=>d.data())) await deleteVersion(meta.id,v); }catch(e){ console.warn(e); } // histórico junto
    await retry(()=>basesCol().doc(meta.id).delete());
    for (let i=0;i<(meta.chunkCount||0);i++) await retry(()=>chunkCol(meta.id).doc(cid(i)).delete());
  });
}
async function loadRows(meta){
  if (S.mode!=='cloud') return (S.local[meta.id]?.rows||[]).map(r=>r.slice());
  const snap=await retry(()=>chunkCol(meta.id).get());
  const docs=snap.docs.filter(d=>d.exists && parseInt(d.id,10)<(meta.chunkCount||1e9)).sort((a,b)=>a.id<b.id?-1:1);
  const rows=[]; for (const d of docs){ const x=d.data(); for (const r of (x.json?JSON.parse(x.json):(x.rows||[]))) rows.push(r.slice()); }
  return rows;
}

async function handleFiles(files){
  if (!files || !files.length) return;
  if (S.readOnly){ toast('Acesso somente leitura: não é possível enviar planilhas.',true); return; }
  const mode=S.uploadMode; S.uploadMode='new';
  const t=toast('Lendo arquivo…',false,900000);
  try{
    let tables=[], cancelled=0; const mergeNotes=[];
    for (const f of files){
      const ext=f.name.split('.').pop().toLowerCase();
      if (DOC_EXT.includes(ext)){
        t.textContent=`Abrindo “${f.name}”…`;
        const res=await readDocument(f,msg=>{ t.textContent=msg; });
        if (!res.tables.length){ toast(`Não encontramos texto legível em “${f.name}”.`,true,6000); continue; }
        t.textContent='Aguardando sua confirmação…';
        if (await previewDocImport(f,res)) tables.push(...res.tables); else cancelled++;
        t.textContent='Lendo arquivo…';
      } else if (['xlsx','xls','xlsm','csv','ods','tsv','txt'].includes(ext)){
        const mg=mergeSheets(await readWorkbook(f),f.name); tables.push(...mg.tables);
        if (mg.merged) mergeNotes.push(`As ${mg.merged} abas de “${f.name}” viraram uma base só (a coluna “${mg.srcCol}” mostra de qual aba veio cada linha).${mg.apart.length?` Ficaram separadas por terem outro formato ou serem de resumo: ${mg.apart.join(', ')}.`:''}`);
      }
      else toast(`Formato não suportado: “${f.name}”. Use planilha, PDF ou imagem (PNG/JPG).`,true,6000);
    }
    if (!tables.length){ t.remove(); if(!cancelled) toast('Nenhum dado encontrado no arquivo.',true); return; }
    t.textContent='Arrumando os dados…';
    tables=tables.map(autoClean).filter(tb=>tb.rows.length&&tb.columns.length);
    if (!tables.length){ t.remove(); toast('O arquivo não tem linhas com dados depois da limpeza.',true); return; }
    const fixes=tables.reduce((s,tb)=>s+tb.cleanLog.length,0);
    if (mode!=='new' && S.currentId){
      const meta=structuredClone(currentMeta()); const tb=tables[0];
      let rows;
      if (mode==='append'){
        // alinha colunas pelo nome
        const idx=meta.columns.map(c=>tb.columns.findIndex(x=>x.name.toLowerCase()===c.name.toLowerCase()));
        const extra=tb.columns.map((c,j)=>j).filter(j=>!idx.includes(j));
        for (const j of extra) meta.columns.push({name:tb.columns[j].name,type:tb.columns[j].type});
        const old=S.rows.map(r=>{ const a=r.slice(); while(a.length<meta.columns.length) a.push(null); return a; });
        const add=tb.rows.map(r=>[...idx.map((j,k)=>j<0?null:convert(r[j],meta.columns[k].type)),...extra.map(j=>r[j])]);
        rows=old.concat(add);
      } else {
        rows=tb.rows; meta.columns=keepCalcs(meta.columns,tb.columns); meta.fileName=tb.fileName; meta.cleanLog=cleanInfo(tb);
        const names=new Set(tb.columns.map(c=>c.name));
        meta.charts=(meta.charts||[]).filter(c=>(!c.x||names.has(c.x))&&(!c.y||names.has(c.y)));
        if (!meta.charts.length) meta.charts=autoCharts(tb.columns,tb.rows);
      }
      t.textContent='Salvando…';
      await saveBase(meta,rows,mode==='append'?'Antes de adicionar linhas':'Antes de substituir pela nova planilha');
      S.rows=rows; S.dirty=false; if(S.mode!=='cloud') render();
      t.remove(); toast(mode==='append'?`${nf.format(tb.rows.length)} linhas adicionadas.`:'Base atualizada com a nova planilha.');
      render();
      return;
    }
    let firstId=null;
    for (const tb of tables){
      const meta={id:uid8(),name:tb.name,fileName:tb.fileName,columns:tb.columns,createdAt:Date.now(),charts:autoCharts(tb.columns,tb.rows),cleanLog:cleanInfo(tb)};
      t.textContent=`Salvando “${tb.name}” (${nf.format(tb.rows.length)} linhas)…`;
      await saveBase(meta,tb.rows);
      firstId=firstId||meta.id;
      if (!S.bases.find(b=>b.id===meta.id)) S.bases.unshift(structuredClone({...meta,chunkCount:meta.chunkCount}));
    }
    t.remove();
    const cleanTxt=fixes?` Dados higienizados (${fixes} ${fixes===1?'tipo de ajuste':'tipos de ajuste'}): veja o resumo na aba Dados.`:'';
    if (mergeNotes.length) toast(mergeNotes.join(' ')+cleanTxt,false,10000);
    else toast((tables.length>1?`${tables.length} tabelas importadas como bases separadas.`:'Planilha importada e salva.')+cleanTxt,false,fixes?7000:3800);
    openBase(firstId);
  }catch(e){
    t.remove(); console.error(e);
    if (e&&e.code==='lib-load') toast('Não foi possível carregar o leitor de PDF/imagem. Verifique sua conexão e tente de novo.',true,7000);
    else if (e&&e.name==='PasswordException') toast('Este PDF está protegido por senha. Gere o extrato sem senha e tente de novo.',true,7000);
    else if (e&&e.code) handleWriteError(e);
    else toast('Não consegui ler este arquivo. Verifique se é uma planilha, PDF ou imagem válida.',true);
  }
}

/* ============ Gráficos automáticos ============ */
function distinctCount(rows,j,cap=60){ const s=new Set(); for(const r of rows){ if(r[j]!=null&&r[j]!=='') s.add(r[j]); if(s.size>cap) break; } return s.size; }
function isTimeCol(rows,j){ let n=0,m=0; for(const r of rows){ const v=r[j]; if(v==null||v==='') continue; n++; if(/^\d{1,2}:\d{2}(:\d{2})?$/.test(String(v).trim())) m++; if(n>=400) break; } return n>0&&m/n>=0.85; }
const MEAS_RX=/valor|total|receita|fatur|venda|pre[cç]o|custo|despesa|lucro|montante|quantia|amount|pago|recebido|quantidade|qtd/i;
// números que não fazem sentido somar (preço unitário, percentuais, taxas, idade, notas): usam média
const AVG_RX=/unit[aá]ri|pre[cç]o m[eé]dio|%|percent|taxa (de )?(juros|convers|c[aâ]mbio|crescimento|ocupa)|margem|(^|[\s_(])idade\b|^nota$|avalia[cç]|m[eé]dia|score|temperatura|cota[cç][aã]o|^pre[cç]o$|capital social/i;
const PARTY_RX=/origem|destino|favorecido|benefici|pagador|recebedor|cliente|fornecedor|nome|estabelecimento|descri|hist[oó]rico|vendedor|produto/i;
const chartKey=s=>`${s.type}|${s.x}|${s.y||''}|${s.agg}|${s.filter?s.filter.col+'='+s.filter.val:''}|${s.abs?1:0}`;
/* Escolhe gráficos que fazem sentido para o tipo de dado:
   - extrato/financeiro (coluna Movimento + valor): entradas x saídas, resultado no tempo, horários, quem mais pagou/recebeu
   - geral: evolução no tempo, participação (poucas categorias), ranking (muitas), média por grupo
   Gráficos que ficariam vazios ou com 1 barra só são descartados. */
function autoCharts(columns,rows,limit=9){
  const meta={columns}, out=[]; let mapCol=null;
  const add=s=>{
    if (out.length>=limit||out.some(o=>chartKey(o)===chartKey(s))) return;
    if (mapCol&&s.x===mapCol&&s.type!=='map'&&s.type!=='pivot') return; // estado já aparece no mapa
    const r=aggregate(meta,s,rows); if(!r||r.labels.length<(s.min||2)) return;
    if ((s.type==='stacked'||s.type==='pivot')&&s.series&&!(r.stack&&r.stack.series.length>=2)) return; // dividir por algo que não divide
    if (s.type==='pivot'&&r.pivot&&r.pivot.rows.length<3) return;
    delete s.min; out.push({id:uid8(),...s});
  };
  // medidas: dinheiro primeiro, depois quantidades; ignora saldo, ano/mês e números que são códigos (pedido, nº, id…)
  const isCodeNum=(c,i)=>/(^id\b|pedido|n[uú]mero|c[oó]digo|^n[ºo°.]|nota|matr[ií]cula)/i.test(c.name)||(()=>{ const j=columns.indexOf(c); const v=rows.map(r=>r[j]).filter(x=>typeof x==='number'); return v.length>10&&v.every(Number.isInteger)&&new Set(v).size===v.length; })();
  const prio=n=>/valor|total|receita|fatur|venda|pre[cç]o|custo|despesa|lucro|montante|quantia|amount|pago|recebido/i.test(n)?0:/quantidade|qtd/i.test(n)?1:2;
  const nums=columns.map((c,i)=>({c,i})).filter(({c,i})=>c.type==='number'&&!/saldo/i.test(c.name)&&!/^(ano|m[eê]s|dia|idade|year|month)$/i.test(c.name)&&!AVG_RX.test(c.name)&&!isCodeNum(c,i))
    .sort((a,b)=>prio(a.c.name)-prio(b.c.name)||a.i-b.i).map(o=>o.c);
  const y=nums[0]?.name||'', agg=y?'sum':'count';
  const yj=y?columns.findIndex(c=>c.name===y):-1;
  const yNeg=yj>=0&&rows.some(r=>typeof r[yj]==='number'&&r[yj]<0);
  const date=columns.find(c=>c.type==='date');
  const tj=columns.findIndex((c,j)=>c.type==='text'&&isTimeCol(rows,j)); const time=tj>=0?columns[tj]:null;
  const cats=columns.map((c,j)=>({c,j})).filter(({c,j})=>c.type==='text'&&j!==tj&&!CODE_RX.test(c.name)&&!/(pedido|n[uú]mero|protocolo|^id\b|chave|transa[cç][aã]o)/i.test(c.name))
    .map(({c,j})=>{ let filled=0; for(const r of rows) if(r[j]!=null&&r[j]!=='') filled++; return {c,j,n:distinctCount(rows,j,500),filled}; })
    .filter(o=>o.n>=2&&o.filled>=rows.length*0.3);
  const mov=cats.find(o=>/^movimento$/i.test(o.c.name));
  const rest=cats.filter(o=>o!==mov);
  const party=rest.filter(o=>PARTY_RX.test(o.c.name)).sort((a,b)=>b.n-a.n)[0]||rest.filter(o=>o.n>8).sort((a,b)=>b.n-a.n)[0];
  const small=rest.filter(o=>o!==party&&o.n<=8);
  const mid=rest.filter(o=>o!==party&&o.n>8);

  if (mov&&y){ // extrato bancário / fluxo de caixa
    const E={col:mov.c.name,val:'Entrada'}, Sd={col:mov.c.name,val:'Saída'};
    if (date) add({type:'stacked',x:date.name,y,agg:'sum',abs:true,series:mov.c.name,wide:true,title:'Entradas e saídas em cada período',why:'Compara, período a período, quanto entrou e quanto saiu: dá para ver em quais períodos o caixa apertou.',min:2});
    add({type:'bar',x:mov.c.name,y,agg:'sum',abs:true,title:'Entradas x saídas',why:'Compara quanto dinheiro entrou e quanto saiu no período.'});
    const catc=rest.find(o=>/^categoria$/i.test(o.c.name));
    if (catc) add({type:'hbar',x:catc.c.name,y,agg:'sum',abs:true,filter:Sd,title:'Gastos por categoria',why:'Mostra em que tipo de despesa o dinheiro foi gasto (com a fatia de cada uma no total).'});
    if (date) add({type:'line',x:date.name,y,agg:'sum',forecast:true,title:'Resultado ao longo do tempo',why:'Mostra o resultado líquido (entradas menos saídas) em cada período, com a tendência para os próximos.',min:3});
    if (catc&&date) add({type:'pivot',x:catc.c.name,y,agg:'sum',series:mov.c.name,wide:true,title:'Tabela: categorias × entradas e saídas',why:'Quanto cada categoria movimentou em entradas e em saídas (saídas com sinal negativo) e o resultado de cada uma.'});
    if (time) add({type:'bar',x:time.name,y,agg:'sum',filter:E,title:'Entradas por horário',why:'Mostra em que horários do dia mais entra dinheiro.',min:3});
    if (party){
      add({type:'hbar',x:party.c.name,y,agg:'sum',filter:E,title:'Quem mais gerou entradas',why:`Ranking de "${party.c.name}" pela soma dos valores recebidos.`});
      add({type:'hbar',x:party.c.name,y,agg:'sum',abs:true,filter:Sd,title:'Para onde foram as saídas',why:`Ranking de "${party.c.name}" pela soma dos valores pagos ou enviados.`});
    }
    for (const o of small) add({type:'pie',x:o.c.name,y:'',agg:'count',title:`Transações por ${o.c.name}`,why:`Mostra quantas transações há de cada "${o.c.name}".`});
    add({type:'pie',x:mov.c.name,y:'',agg:'count',title:'Quantidade de entradas e saídas',why:'Mostra quantas transações foram de entrada e quantas de saída.'});
    if (out.length>=3) return out;
  }
  /* Ordem pensada para contar a história da base: evolução (com tendência) -> evolução dividida pela categoria
     principal -> painel do tipo de negócio -> mapa -> ranking -> participação -> cruzamentos (empilhadas e
     tabela dinâmica) -> médias. Gráficos de tempo e tabelas ocupam a largura toda para caber mais detalhe. */
  const ufc=cats.find(o=>isUfCol(rows,o.j)); // coluna de estado: vira mapa do Brasil (sem repetir em barras/rosca)
  const stage=cats.find(o=>/etapa|est[aá]gio|fase|funil|pipeline/i.test(o.c.name)&&o.n>=3&&o.n<=8); // etapas: funil
  const ranks=[party,...mid].filter(Boolean).filter(o=>o.n<=rows.length*(y?0.95:0.8)) // valores que quase nunca se repetem não formam ranking
    .sort((a,b)=>(a.n>60)-(b.n>60)||a.n-b.n); // primeiro colunas com número moderado de itens (produto, vendedor…), depois as muito variadas (clientes)
  // melhor coluna para "dividir por": poucas categorias (de preferência 3 a 6), sem ser estado nem etapa
  const split=[...small].filter(o=>o!==stage).sort((a,b)=>(a===ufc)-(b===ufc)||((b.n>=3&&b.n<=6)-(a.n>=3&&a.n<=6))||a.n-b.n)[0];
  const mainCat=ranks.find(o=>o!==split&&o!==ufc)||small.find(o=>o!==split&&o!==ufc&&o!==stage);
  const ys=yNeg?'':y, aggS=ys?'sum':'count';
  if (date){
    add({type:'line',x:date.name,y,agg,forecast:true,wide:true,title:y?`Evolução de ${y}`:'Registros ao longo do tempo',why:y?`Mostra como a soma de "${y}" varia ao longo do tempo, com a linha de tendência e uma estimativa dos próximos períodos.`:`Mostra quantos registros existem em cada período de "${date.name}", com a tendência para os próximos.`,min:3});
    if (split) add({type:'stacked',x:date.name,y:ys,agg:aggS,series:split.c.name,wide:true,title:ys?`${ys} por ${split.c.name} ao longo do tempo`:`Registros por ${split.c.name} ao longo do tempo`,why:`Cada período dividido por "${split.c.name}": mostra quem puxou a alta ou a queda em cada momento.`,min:3});
  }
  if (ufc){ mapCol=ufc.c.name; add({type:'map',x:ufc.c.name,y:ys,agg:aggS,skipEmpty:true,title:ys?`${ys} por estado`:'Registros por estado',why:'Mostra no mapa do Brasil como os valores se distribuem entre os estados.'}); }
  if (!mov){ const n0=out.length; let best=[]; for(const tpl of TEMPLATES){ const s=templateSpecs(meta,tpl,rows); if(s.length>best.length) best=s; }
    if (best.length>=3) for(const s of best){ if(out.length-n0>=3) break; add({...s}); } }
  if (time) add({type:'bar',x:time.name,y,agg,title:y?`${y} por horário`:'Registros por horário',why:'Mostra em que horas do dia há mais movimento.',min:3});
  if (stage) add({type:'funnel',x:stage.c.name,y:'',agg:'count',title:`Funil por ${stage.c.name}`,why:`Quantos registros há em cada etapa de "${stage.c.name}" e quanto se perde de uma etapa para a outra.`});
  if (ranks[0]) add({type:'hbar',x:ranks[0].c.name,y,agg,title:`Ranking de ${ranks[0].c.name}`,why:y?`Os itens de "${ranks[0].c.name}" com maior soma de "${y}", com a fatia de cada um no total.`:`Os itens de "${ranks[0].c.name}" que mais aparecem.`});
  if (small[0]) add({type:'pie',x:small[0].c.name,y:ys,agg:aggS,title:`Participação por ${small[0].c.name}`,why:ys?`Mostra a fatia de cada "${small[0].c.name}" no total de "${ys}".`:`Mostra quantos registros há de cada "${small[0].c.name}".`});
  if (mainCat&&split&&mainCat!==split){
    add({type:'stacked',x:mainCat.c.name,y:ys,agg:aggS,series:split.c.name,title:`${mainCat.c.name} por ${split.c.name}`,why:`Cada barra de "${mainCat.c.name}" dividida por "${split.c.name}": mostra a composição de cada um.`});
    add({type:'pivot',x:mainCat.c.name,y:ys,agg:aggS,series:split.c.name,wide:true,title:`Tabela: ${mainCat.c.name} × ${split.c.name}`,why:`Os números exatos de cada "${mainCat.c.name}" em cada "${split.c.name}", com totais e participação.`});
  }
  if (y){ const o=[...small,...mid].find(o=>o.n<=20); if(o) add({type:'bar',x:o.c.name,y,agg:'avg',title:`Média de ${y} por ${o.c.name}`,why:`Compara o valor médio (ex.: ticket médio) de cada "${o.c.name}".`}); }
  for (const o of ranks.slice(1)) add({type:'hbar',x:o.c.name,y,agg,title:`Ranking de ${o.c.name}`,why:y?`Os itens de "${o.c.name}" com maior soma de "${y}", com a fatia de cada um no total.`:`Os itens de "${o.c.name}" que mais aparecem.`});
  for (const o of small.slice(1)) add({type:'pie',x:o.c.name,y:ys,agg:aggS,title:`Participação por ${o.c.name}`,why:ys?`Mostra a fatia de cada "${o.c.name}" no total de "${ys}".`:`Mostra quantos registros há de cada "${o.c.name}".`});
  if (nums[1]){ const o=small[0]||mid[0]||party; if(o) add({type:'hbar',x:o.c.name,y:nums[1].name,agg:'sum',title:`${nums[1].name} por ${o.c.name}`,why:`Soma de "${nums[1].name}" em cada "${o.c.name}".`}); }
  if (!out.length&&columns[0]) out.push({id:uid8(),type:'hbar',x:columns[0].name,y:'',agg:'count',title:`Registros por ${columns[0].name}`,why:`Mostra quantos registros há de cada "${columns[0].name}".`});
  return out;
}

/* ============ Render ============ */
// a animação de entrada só roda quando a tela muda (troca de página, base ou aba),
// não a cada atualização de gráfico ou filtro
let lastViewKey='';
function render(){
  renderMain();
  const key=`${S.mode}|${S.view}|${S.currentId}|${S.tab}|${S.loadingRows?1:0}`;
  const v=$('#main').firstElementChild&&$('#main').querySelector(':scope > .view, :scope > .login-wrap, :scope > .empty');
  if (v&&key!==lastViewKey) v.classList.add('enter');
  lastViewKey=key;
  if (typeof resetScroll==='function') resetScroll();
}
function renderMain(){
  renderSidebar();
  // não apaga o formulário do perfil enquanto a pessoa está digitando
  if (S.mode==='cloud'&&S.view==='perfil'&&(S.profileDirty||S.brandDirty)&&$('#main .profile-page')) return;
  const main=$('#main'); main.innerHTML='';
  destroyCharts();
  document.querySelector('.app').classList.toggle('no-aside',S.mode!=='cloud'&&S.mode!=='local');
  document.body.classList.toggle('tv-on',S.view==='tv');
  if (S.view!=='tv') clearTvTimers();
  if (S.mode==='share'){ main.append(S.view==='tv'&&!S.share.error&&!S.share.loading?tvView():shareView()); return; }
  if (S.mode==='login'){ main.append(loginScreen()); return; }
  if (S.mode==='setup'){ main.append(setupScreen()); return; }
  if (S.mode==='local') main.append(el('div',{class:'banner warn demo-banner'},el('span',{text:'Você não está conectado com sua conta, então os dados ficam só nesta aba e somem ao fechar. Entre com sua conta Google para salvar e acessar de qualquer lugar.'}),
    S.auth?el('button',{class:'btn sm primary',onclick:e=>signIn(e.currentTarget)},'Entrar com Google'):null));
  if (S.readOnly && S.mode==='cloud') main.append(el('div',{class:'banner'},'Seu acesso a esta página é somente leitura, então não é possível salvar bases. Peça ao dono da página para te convidar como Editor.'));
  if (S.mode==='loading' || (S.mode==='cloud' && !S.basesLoaded)){ main.append(el('div',{class:'empty'},el('div',{class:'empty-box'},el('span',{class:'spinner'}),el('p',{style:'margin-top:12px',text:'Carregando suas bases…'})))); return; }
  if (S.view==='perfil'){ main.append(profileView()); return; }
  if (S.view==='home'){ main.append(homeView()); return; }
  if (S.view==='modelo'){ main.append(modelView()); return; }
  if (S.view==='tv'){ main.append(tvView()); return; }
  if (S.view==='consultas'){ main.append(consultasView()); return; }
  if (S.view==='sql'){ main.append(sqlView()); return; }
  const meta=currentMeta();
  if (!meta){ main.append(emptyState()); return; }
  main.append(pageHead(meta));
  const tabs=el('div',{class:'tabs'},
    el('button',{class:'tab'+(S.tab==='dados'?' active':''),onclick:()=>{S.tab='dados';history.replaceState(null,'','#dados');render();}},icon('table'),'Dados'),
    el('button',{class:'tab'+(S.tab==='graficos'?' active':''),onclick:()=>{S.tab='graficos';history.replaceState(null,'','#graficos');render();}},icon('chart'),'Gráficos'),
    el('button',{class:'tab'+(S.tab==='relatorios'?' active':''),onclick:()=>{S.tab='relatorios';history.replaceState(null,'','#relatorios');render();}},icon('send'),'Relatórios'),
    el('button',{class:'tab'+(S.tab==='apresentacao'?' active':''),onclick:()=>{S.tab='apresentacao';history.replaceState(null,'','#apresentacao');render();}},icon('slides'),'Apresentação'));
  main.append(tabs);
  const view=el('div',{class:'view'}); main.append(view);
  if (S.loadingRows || !S.rows){ view.append(el('div',{class:'muted'},el('span',{class:'spinner'}),'  Carregando dados…')); return; }
  if (S.tab==='dados') renderData(view,meta); else if (S.tab==='relatorios') renderReports(view,meta); else if (S.tab==='apresentacao') renderDeck(view,meta); else renderViz(view,meta);
}

async function getRows(id){

  if (!sb.unique&&sa.unique){ from=b; to=a; fs=sb; ts=sa; } // o lado de valores únicos vira o "um"

function lookupRels(meta){
  const out=[];

// procura colunas em comum entre as bases (mesmo nome/código e valores que batem)
async function suggestRelations(){
  if (S.bases.length<2){ toast('Você precisa de pelo menos 2 bases.',true); return; }
  const t=toast('Analisando suas bases…',false,120000);
  const KEY_RX=/(^id\b|\bid$|c[oó]d|cpf|cnpj|sku|ref|matr[ií]cula|chave|n[uú]mero|^n[ºo°.])/i;
  const sets=new Map();
  try{
    for (const b of S.bases){
      const rows=await getRows(b.id);
      b.columns.forEach((c,j)=>{
        if (c.type==='date') return;
        if (c.type==='number'&&!KEY_RX.test(c.name)&&!CODE_RX.test(c.name)) return; // valores (R$, qtd) não são chaves
        if (c.type==='text'&&isTimeCol(rows,j)) return;
        const st=colStats(rows,j); if(st.set.size<2||st.set.size>20000) return;
        sets.set(`${b.id}|${c.name}`,{b,c,st});
      });
    }
  }catch(e){ t.remove(); toast('Não foi possível analisar as bases agora.',true); return; }
  const nn=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
  const have=new Set((S.model.relationships||[]).flatMap(r=>[`${r.from.base}|${r.from.col}#${r.to.base}|${r.to.col}`,`${r.to.base}|${r.to.col}#${r.from.base}|${r.from.col}`]));
  const items=[...sets.values()], out=[];
  for (let i=0;i<items.length;i++) for (let j=i+1;j<items.length;j++){
    const x=items[i], y=items[j]; if (x.b.id===y.b.id) continue;
    if (have.has(`${x.b.id}|${x.c.name}#${y.b.id}|${y.c.name}`)) continue;
    if (!x.st.unique&&!y.st.unique) continue;
    const a=nn(x.c.name), b=nn(y.c.name);
    const nameScore=a===b?1:(a.length>2&&b.length>2&&(a.includes(b)||b.includes(a)))?0.6:(KEY_RX.test(x.c.name)&&KEY_RX.test(y.c.name))?0.3:0;
    const [small,big]=x.st.set.size<=y.st.set.size?[x.st.set,y.st.set]:[y.st.set,x.st.set];
    let hit=0; for(const k of small) if(big.has(k)) hit++;
    const overlap=hit/small.size;
    if (overlap<0.6) continue;
    if (!nameScore&&(overlap<0.8||small.size<5)) continue;
    out.push({a:{base:x.b.id,col:x.c.name},b:{base:y.b.id,col:y.c.name},an:x.b.name,bn:y.b.name,overlap,score:overlap+nameScore});
  }
  t.remove();
  out.sort((p,q)=>q.score-p.score);
  const list=out.slice(0,8);
  const close=modal('Relações sugeridas',list.length?'Encontramos colunas com valores em comum entre suas bases. Clique em “Conectar” para revisar e criar a relação.':'Não encontramos colunas em comum entre suas bases. Você ainda pode criar uma relação manualmente.',
    list.length?el('div',{class:'rel-list'},list.map(s=>el('div',{class:'rel-item'},
      el('div',{class:'rel-path'},el('b',{text:s.an}),` · ${s.a.col}`,el('span',{class:'rel-arrow',text:'⇄'}),el('b',{text:s.bn}),` · ${s.b.col}`),
      el('span',{class:'chip',text:`${pct1(s.overlap*100)} em comum`}),
      el('button',{class:'btn sm primary',onclick:()=>{ close(); relationDialog(s.a,s.b); }},'Conectar')))):null,
    [{label:'Fechar'}]);
}

const PROFILE_FIELDS=[
  {k:'name',label:'Nome de exibição',ph:'Como você quer ser chamado',max:80,req:true},

  const p=S.profile||{}, nm=profileName();
  const saved={}; PROFILE_FIELDS.forEach(f=>saved[f.k]=f.k==='name'?nm:(p[f.k]||''));
  const inputs={};
  const err=el('div',{class:'form-err'});
  const saveBtn=el('button',{class:'btn primary',disabled:true,onclick:()=>save()},'Salvar alterações');
  const resetBtn=el('button',{class:'btn',disabled:true,onclick:()=>{ S.profileDirty=false; render(); }},'Descartar');
  const sign=el('div',{class:'pdf-sign'});

    const who=[v('name')||nm,v('role')].filter(Boolean).join(' · '), org=[v('department'),v('company')].filter(Boolean).join(' · ');
    sign.textContent=`Nos relatórios em PDF: "Preparado por ${who}${org?' · '+org:''}"`; };
  const check=()=>{ const changed=PROFILE_FIELDS.some(f=>inputs[f.k].value.trim()!==saved[f.k]); S.profileDirty=changed; saveBtn.disabled=!changed; resetBtn.disabled=!changed; err.textContent=''; signText(); };
  const grid=el('div',{class:'form-grid'},
    PROFILE_FIELDS.map(f=>{ const i=el('input',{type:f.type||'text',value:saved[f.k],placeholder:f.ph,maxlength:f.max,autocomplete:'off'});
      i.addEventListener('input',check); i.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!saveBtn.disabled) save(); }); inputs[f.k]=i;
      return el('label',{class:'field'},f.label+(f.req?' *':''),i); }),
    el('label',{class:'field'},'E-mail',el('input',{value:S.me?.email||'',disabled:true,title:'Vem da sua conta Google e não pode ser alterado aqui'})));
  signText();
  async function save(){
    const data={}; for (const f of PROFILE_FIELDS) data[f.k]=inputs[f.k].value.trim().slice(0,f.max);
    if (!data.name){ err.textContent='Informe um nome de exibição.'; inputs.name.focus(); return; }

    try{
      await S.db.doc(`data/users/${S.uid}/app`).set({profile:{...data,updatedAt:Date.now()}},{merge:true});

  if (S.sort.col>=0){ const j=S.sort.col, d=S.sort.dir, num=meta.columns[j].type==='number';

/* ----- Aba Relatórios -----
   Cada base guarda seus relatórios em meta.reports. O envio manual (PDF, WhatsApp e e-mail) funciona aqui no
   navegador; o envio automático no horário depende de uma função no servidor (Firebase, plano Blaze), que vai
   ler estes mesmos campos: schedule {freq, weekday, monthday, time, tz} e emails. */
const PERIODS=[['all','Todos os registros'],['7d','Últimos 7 dias'],['30d','Últimos 30 dias'],['month','Mês atual'],['prevmonth','Mês anterior'],['year','Ano atual']];
const WEEKDAYS=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const isoDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function periodRange(p,now=new Date()){
  const y=now.getFullYear(), m=now.getMonth(), back=n=>{ const a=new Date(now); a.setDate(a.getDate()-n); return a; };
  if (p==='7d') return {from:isoDay(back(6)),to:isoDay(now)};
  if (p==='30d') return {from:isoDay(back(29)),to:isoDay(now)};
  if (p==='month') return {from:isoDay(new Date(y,m,1)),to:isoDay(new Date(y,m+1,0))};
  if (p==='prevmonth') return {from:isoDay(new Date(y,m-1,1)),to:isoDay(new Date(y,m,0))};
  if (p==='year') return {from:`${y}-01-01`,to:`${y}-12-31`};
  return null;
}
function reportRows(meta,rep){
  let rows=S.rows; const f=rep.filter;
  if (f&&f.col){ const j=meta.columns.findIndex(c=>c.name===f.col); if(j>=0) rows=rows.filter(r=>String(r[j]??'(vazio)')===f.val); }
  const rg=periodRange(rep.period), dj=meta.columns.findIndex(c=>c.type==='date');
  if (rg&&dj>=0) rows=rows.filter(r=>{ const v=r[dj]; if(!v||!/^\d{4}-\d{2}-\d{2}/.test(v)) return false; const d=String(v).slice(0,10); return d>=rg.from&&d<=rg.to; });
  return rows;
}
function periodText(meta,rep){
  const rg=periodRange(rep.period), dc=meta.columns.find(c=>c.type==='date'), p=[];
  p.push(rg&&dc?`${PERIODS.find(x=>x[0]===rep.period)[1]} (${fmtDate(rg.from)} a ${fmtDate(rg.to)})`:'Todos os registros');
  if (rep.filter&&rep.filter.col) p.push(`só ${rep.filter.col}: ${rep.filter.val}`);
  return p.join(' · ');
}
function scheduleText(rep){
  const s=rep.schedule||{}, h=s.time||'08:00';
  if (!s.freq||s.freq==='none') return 'Sem agendamento';
  if (s.freq==='daily') return `Todo dia às ${h}`;
  if (s.freq==='weekly'){ const i=s.weekday??1; return `${i===0||i===6?'Todo':'Toda'} ${WEEKDAYS[i]} às ${h}`; }
  return `${(s.monthday||1)>28?'No último dia':'Todo dia '+(s.monthday||1)} do mês às ${h}`;
}
function nextRun(rep,now=new Date()){
  const s=rep.schedule||{}; if(!s.freq||s.freq==='none') return null;
  const [hh,mm]=(s.time||'08:00').split(':').map(Number);
  for (let i=0;i<=62;i++){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,hh,mm);
    if (d<=now) continue;
    if (s.freq==='daily') return d;
    if (s.freq==='weekly'&&d.getDay()===(s.weekday??1)) return d;
    if (s.freq==='monthly'){ const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); if(d.getDate()===Math.min(s.monthday||1,last)) return d; }
  }
  return null;
}
const fmtNext=d=>d.toLocaleString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const phoneDigits=s=>{ let d=String(s||'').replace(/\D/g,''); if(d.length===10||d.length===11) d='55'+d; return d; };
