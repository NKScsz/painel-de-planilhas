  const num=r=>typeof r[yj]==='number'?r[yj]:0, sum=rs=>yj<0?rs.length:rs.reduce((s,r)=>s+num(r),0);
  const what=yc?`o total de “${yc.name}”`:'o número de registros', fv=v=>yj<0?`${nf.format(v)} ${v===1?'registro':'registros'}`:fmtNum(v);
  const ic=d=>!d||d.dir===0?'eq':(d.good===false?'down':d.good===true?'up':d.dir>0?'up':'down');
  const movj=meta.columns.findIndex(c=>/^movimento$/i.test(c.name));
  if (movj>=0&&yj>=0){
    let e=0,s=0; for(const r of rows){ const v=Math.abs(num(r)), m=fold(r[movj]); if(m==='entrada') e+=v; else if(m==='saida') s+=v; }
    out.push({ic:e>=s?'up':'down',tx:`Entraram ${fmtNum(e)} e saíram ${fmtNum(s)}. O resultado foi ${e>=s?'positivo':'negativo'} em ${fmtNum(Math.abs(e-s))}.`});
    const cj=meta.columns.findIndex(c=>/^categoria$/i.test(c.name)), pj=cj>=0?cj:meta.columns.findIndex(c=>/descri|hist[oó]rico|estabelecimento|favorecido/i.test(c.name));
    if (pj>=0&&s>0){ const g=new Map(); for(const r of rows) if(fold(r[movj])==='saida'){ const k=String(r[pj]??'(vazio)'); g.set(k,(g.get(k)||0)+Math.abs(num(r))); }
      const top=[...g.entries()].sort((a,b)=>b[1]-a[1])[0]; if(top) out.push({ic:'eq',tx:`Onde mais saiu dinheiro: “${top[0]}”, com ${fmtNum(top[1])} (${pct1(top[1]/s*100)} das saídas).`}); }
  } else if (prev&&prev.rows){
    const a=sum(rows), b=sum(prev.rows), d=deltaOf(a,b,yc?yc.name:'registros');
    out.push({ic:ic(d),tx:`No período escolhido, ${what} foi ${fv(a)}${d&&d.dir!==0?`: ${pct1(Math.abs(d.pct))} ${d.pct>0?'a mais':'a menos'} que no período anterior (${fv(b)})`:d?', igual ao período anterior':''}.`});
  } else if (dj>=0){
    const byM=new Map(); for(const r of rows){ const d=dayOf(r[dj]); if(!d) continue; const m=d.slice(0,7); byM.set(m,(byM.get(m)||0)+(yj<0?1:num(r))); }
    const ms=[...byM.keys()].sort(), lm=ms[ms.length-1], pm=ms[ms.length-2];
    if (lm){ const cur=lm===isoDay(new Date()).slice(0,7); let t=`Em ${keyLabel(lm,'m')}${cur?' (até hoje)':''}, ${what} foi ${fv(byM.get(lm))}`, d=null;
      if (pm&&!cur){ d=deltaOf(byM.get(lm),byM.get(pm),yc?yc.name:''); if(d&&d.dir!==0) t+=`: ${pct1(Math.abs(d.pct))} ${d.pct>0?'a mais':'a menos'} que em ${keyLabel(pm,'m')}`; }
      else if (pm) t+=`. O mês anterior, ${keyLabel(pm,'m')}, fechou em ${fv(byM.get(pm))}`;
      out.push({ic:ic(d),tx:t+'.'}); }
  } else out.push({ic:'eq',tx:`No total, ${what} é ${fv(sum(rows))}.`});
  if (movj<0){ const c=summaryCat(meta,rows,-1);
    if (c){ const g=new Map(); let tot=0; for(const r of rows){ const v=yj<0?1:num(r); const k=String(r[c.j]??'(vazio)'); g.set(k,(g.get(k)||0)+v); tot+=v; }
      const es=[...g.entries()].filter(e=>e[0]!=='(vazio)').sort((a,b)=>b[1]-a[1]);
      if (es.length>=2&&tot>0&&es.every(e=>e[1]>=0)) out.push({ic:'eq',tx:`Quem mais pesou em “${c.c.name}”: “${es[0][0]}”, com ${fv(es[0][1])} (${pct1(es[0][1]/tot*100)} do total)${es.length>=3?`. Depois vêm “${es[1][0]}” e “${es[2][0]}”`:''}.`}); } }
  const gs=(meta.goals||[]).map(g=>({g,s:goalStatus(meta,g)})).filter(x=>x.s);
  if (gs.length){ const bad=gs.filter(x=>x.s.st==='warn'||x.s.st==='bad');
    out.push(bad.length?{ic:'warn',tx:`Atenção: ${bad.length===1?`a meta “${bad[0].g.name}” está`:`${bad.length} metas estão`} fora do ritmo${bad.length>1?` (${bad.slice(0,3).map(x=>`“${x.g.name}”`).join(', ')})`:''}.`}
      :{ic:'up',tx:gs.length===1?`A meta “${gs[0].g.name}” está dentro do esperado.`:`Todas as ${gs.length} metas estão dentro do esperado.`}); }
  const an=detectAnomalies(meta,S.rows||rows)[0]; if(an) out.push({ic:'warn',tx:`Fora do padrão: ${an.title.charAt(0).toLowerCase()+an.title.slice(1)}.`});
  if (!out.length) return null;
  return el('section',{class:'easy-sum','aria-label':'Resumo'},el('h3',{},'Resumo em poucas palavras'),
    el('ul',{},out.slice(0,4).map(o=>el('li',{},el('span',{class:'ei '+o.ic,'aria-hidden':'true',text:{up:'▲',down:'▼',warn:'!',eq:'•'}[o.ic]}),el('span',{text:o.tx})))));
}

/* ----- Perguntas prontas: um toque e o gráfico certo aparece ----- */
function askQuestions(meta,rows){
  const q=s=>{ const y=s.y?`“${s.y}”`:'', x=`“${s.x}”`, cnt=!s.y||s.agg==='count', f=s.filter&&fold(s.filter.val);
    if (f==='saida') return /categoria/i.test(s.x)?'Em que estou gastando mais?':`Para onde vai mais dinheiro (${x})?`;
    if (f==='entrada') return 'De onde entra mais dinheiro?';
    if (/^movimento$/i.test(s.x)) return s.type==='stacked'?null:cnt?'Quantas entradas e saídas eu tive?':'Entrou mais ou saiu mais dinheiro?';
    if (s.type==='stacked'&&/^movimento$/i.test(s.series||'')) return 'Em quais períodos o caixa apertou?';
    switch(s.type){
      case 'line': return colType(meta,s.x)==='date'?(cnt?'Quantos registros houve em cada período?':`Como ${y} evoluiu ao longo do tempo?`):null;
      case 'stacked': return colType(meta,s.x)==='date'?`Quem puxou ${cnt?'os registros':y} em cada período (por ${'“'+s.series+'”'})?`:`Como cada ${x} se divide por “${s.series}”?`;
      case 'hbar': return s.title&&/vendedor|vendedores/i.test(s.title)&&!cnt?'Quem vendeu mais?':/cliente/i.test(s.x)&&!cnt?'Quem são meus maiores clientes?':/produto/i.test(s.x)&&!cnt?'Quais produtos vendem mais?':cnt?`Quais itens de ${x} aparecem mais?`:`Quais itens de ${x} têm mais ${y}?`;
      case 'pie': return cnt?`Como os registros se dividem por ${x}?`:`Qual a fatia de cada ${x} em ${y}?`;
      case 'map': return 'Em quais estados está o maior volume?';
      case 'funnel': return 'Quanto se perde em cada etapa?';
      case 'bar': return s.agg==='avg'?(/vendedor|cliente/i.test(s.x)?`Qual o valor médio por venda de cada ${x}?`:`Qual a média de ${y} por ${x}?`):(s.x&&isTimeCol(rows,meta.columns.findIndex(c=>c.name===s.x))?'Em que horário há mais movimento?':`Quanto foi ${cnt?'registrado':y} por ${x}?`);
    } return null; };
  const seen=new Set(), out=[];
  for (const s of autoCharts(meta.columns.filter(c=>!c.virtual),rows,16)){ const t=q(s); if(!t||seen.has(t)) continue; seen.add(t); out.push({q:t,spec:s}); if(out.length>=6) break; }
  return out;
}

/* ----- Histórico de versões -----
   Antes de cada gravação de linhas, a versão anterior da base (a que estava aberta) é guardada em
   bases/{id}/versions/{vid} (+ chunks). Ficam as 5 mais recentes. Sem login, ficam só nesta aba. */
const MAX_VERSIONS=5;
const verCol=id=>basesCol().doc(id).collection('versions');
function setBaseline(meta,rows){ S.baseline={id:meta.id,rows:rows.map(r=>r.slice()),columns:structuredClone(meta.columns.filter(c=>!c.virtual)),sig:rows.length+':'+hashStr(JSON.stringify(rows))}; }
async function snapshotVersion(meta,reason){
  const b=S.baseline; if(!b||b.id!==meta.id||!b.rows.length) return;
  const at=Date.now(), v={id:uid8(),at,reason:reason||'Antes de uma alteração',rowCount:b.rows.length,columns:b.columns};
  if (S.mode!=='cloud'){ const L=(S.localVersions=S.localVersions||{})[meta.id]=(S.localVersions?.[meta.id]||[]); L.unshift({...v,rows:b.rows}); L.splice(MAX_VERSIONS); S.baseline=null; return; }
  S.baseline=null; // a próxima versão só depois de recarregar o que foi salvo
  try{
    await queue(async()=>{
      const chunks=chunkRows(b.rows), ref=verCol(meta.id).doc(v.id);
      for (let i=0;i<chunks.length;i++) await retry(()=>ref.collection('chunks').doc(cid(i)).set({json:JSON.stringify(chunks[i])}));
      await retry(()=>ref.set({...v,chunkCount:chunks.length}));
      const all=(await verCol(meta.id).get()).docs.map(d=>d.data()).sort((a,b)=>b.at-a.at);
      for (const old of all.slice(MAX_VERSIONS)) await deleteVersion(meta.id,old);
    });
  }catch(e){ console.warn('versão não salva',e); }
}
async function deleteVersion(baseId,v){
  const ref=verCol(baseId).doc(v.id);
  for (let i=0;i<(v.chunkCount||0);i++) await retry(()=>ref.collection('chunks').doc(cid(i)).delete());
  await retry(()=>ref.delete());
}
async function listVersions(meta){
  if (S.mode!=='cloud') return (S.localVersions?.[meta.id]||[]);
  return (await verCol(meta.id).get()).docs.map(d=>d.data()).sort((a,b)=>b.at-a.at);
}
async function versionRows(meta,v){
  if (v.rows) return v.rows.map(r=>r.slice());
  const snap=await verCol(meta.id).doc(v.id).collection('chunks').get();
  const rows=[]; for (const d of snap.docs.filter(d=>parseInt(d.id,10)<(v.chunkCount||0)).sort((a,b)=>a.id<b.id?-1:1)) for(const r of JSON.parse(d.data().json||'[]')) rows.push(r);
  return rows;
}

  let list=[]; try{ list=await listVersions(meta); }catch(e){ console.error(e); box.innerHTML=''; box.append(el('div',{class:'form-err',text:'Não foi possível carregar o histórico agora.'})); return; }

    el('div',{class:'hist-btns'},

        await downloads.save({filename:`${meta.name.replace(/[\\/:*?"<>|]/g,'_')} - versão ${new Date(v.at).toLocaleDateString('pt-BR').replace(/\//g,'-')}.xlsx`,data:new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})])}); }catch(e){ toast('Não foi possível baixar esta versão.',true); } }},'Baixar'),

/* ----- Excluir várias bases de uma vez ----- */
async function bulkDelete(ids){
  if (S.readOnly) return;
  const metas=S.bases.filter(b=>ids.includes(b.id)); if(!metas.length) return;
  const all=metas.length===S.bases.length, n=metas.length, shared=metas.filter(m=>m.share&&m.share.token).length;
  // confirmação digitando EXCLUIR: apagar várias bases não tem volta
  const inp=el('input',{placeholder:'EXCLUIR',autocomplete:'off','aria-label':'Digite EXCLUIR para confirmar'}), err=el('div',{class:'form-err'});
  const names=el('ul',{class:'del-list'},metas.slice(0,8).map(m=>el('li',{},el('b',{text:m.name}),` · ${nf.format(m.rowCount||0)} linhas`)),n>8?el('li',{class:'muted',text:`e mais ${n-8}`}):null);
  const ok=await new Promise(res=>{
    const dlg=formModal(all?`Excluir todas as ${n} bases?`:`Excluir ${n} ${n===1?'base':'bases'}?`,
      `As bases abaixo e todos os dados delas serão apagados da sua conta. Isso não pode ser desfeito.${shared?` ${shared===1?'O link de compartilhamento/TV dela também será desativado.':`Os links de compartilhamento/TV de ${shared} delas também serão desativados.`}`:''}`,
      el('div',{class:'del-box'},names,fld('Para confirmar, digite EXCLUIR',inp),err),'Excluir definitivamente',()=>{
        if (inp.value.trim().toUpperCase()!=='EXCLUIR'){ err.textContent='Digite EXCLUIR para confirmar.'; inp.focus(); return false; }
        res(true); },'del-modal');
    dlg.ok.classList.remove('primary'); dlg.ok.classList.add('danger');
    const close=dlg.close; dlg.m.parentElement.addEventListener('click',e=>{ if(e.target===dlg.m.parentElement) res(false); });
    dlg.m.querySelector('.actions .btn').addEventListener('click',()=>res(false));
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') dlg.ok.click(); });
    const esc=e=>{ if(e.key==='Escape'){ document.removeEventListener('keydown',esc); res(false); } }; document.addEventListener('keydown',esc);
    setTimeout(()=>inp.focus(),50); void close;
  });
  if (!ok) return;
  const t=toast(`Excluindo 0 de ${n}…`,false,600000); let done=0, fail=0;
  const gone=new Set();
  for (const m of metas){
    try{ if(m.share&&m.share.token&&S.mode==='cloud') await unpublishShare(m.share.token).catch(e=>console.warn(e));
      await deleteBase(m); gone.add(m.id); done++; }
    catch(e){ console.error(e); fail++; }
    t.textContent=`Excluindo ${done+fail} de ${n}…`;
  }
  t.remove();
  S.bases=S.bases.filter(b=>!gone.has(b.id)); if(S.sel) for(const id of gone) S.sel.delete(id);
  if (gone.has(S.currentId)){ S.currentId=null; S.rows=null; S.dirty=false; }
  for (const id of gone) delete S.rowCache[id];
  // relações do modelo de dados que apontavam para as bases apagadas
  const rels=(S.model.relationships||[]).filter(r=>!gone.has(r.from?.base)&&!gone.has(r.to?.base));
  if (rels.length!==(S.model.relationships||[]).length){ S.model={...S.model,relationships:rels}; saveModel({relationships:rels}); }
  toast(fail?`${done} ${done===1?'base excluída':'bases excluídas'}; ${fail} não ${fail===1?'pôde':'puderam'} ser excluída(s). Tente de novo.`:`${done} ${done===1?'base excluída':'bases excluídas'}.`,!!fail);
  S.view='home'; render();
}

/* ----- Modo TV: painel em tela cheia que se atualiza sozinho -----
   Dentro do site (logado): acompanha a base pelo Firestore em tempo real.
   Pelo link (?v=TOKEN&tv=1): acompanha a cópia compartilhada em tempo real; se a base vem do
   Google Sheets, a própria TV relê a planilha a cada 2 minutos. Configuração em meta.tv. */
const TV_PER=[['today','Hoje'],['7d','Últimos 7 dias'],['30d','Últimos 30 dias'],['month','Este mês'],['year','Este ano'],['all','Todos os registros']];
const TV_EVERY=[[10,'10 segundos'],[20,'20 segundos'],[30,'30 segundos'],[60,'1 minuto']];
const tvCats=meta=>meta.columns.map((c,j)=>({c,j})).filter(({c,j})=>c.type==='text'&&!CODE_RX.test(c.name)&&!isTimeCol(S.rows||[],j)&&distinctCount(S.rows||[],j,300)>=2&&distinctCount(S.rows||[],j,300)<=300).map(o=>o.c);
const tvNums=meta=>meta.columns.filter(c=>c.type==='number'&&!CODE_RX.test(c.name)&&!/(pedido|n[uú]mero|c[oó]d|nota|matr[ií]cula|^ano$)/i.test(c.name));
function tvCfg(meta){
  const dcol=meta.columns.find(c=>c.type==='date'), cats=tvCats(meta), nums=tvNums(meta);
  const party=cats.find(c=>PARTY_RX.test(c.name))||cats[0], y=nums.find(c=>MEAS_RX.test(c.name))||nums[0];
  const cfg={period:dcol?'month':'all',row:party?.name||'',col:'',measure:y?.name||'',agg:'sum',charts:(meta.charts||[]).map(c=>c.id),every:20,...(meta.tv||{})};
  if (!dcol) cfg.period='all';
  return cfg;
}
function tvRange(p){ if(p==='today'){ const t=isoDay(new Date()); return {from:t,to:t}; } return periodRange(p); }
function tvRows(meta,rows,cfg){
  const dj=meta.columns.findIndex(c=>c.type==='date'), rg=dj>=0?tvRange(cfg.period):null;
  if (!rg) return {rows,prev:null,rg:null};
  const pr=compareRange(rg.from,rg.to);
  return {rows:inRange(rows,dj,rg),prev:pr?{rows:inRange(rows,dj,pr),range:pr}:null,rg};
}
// tabela dinâmica: linhas x colunas (opcional) com soma, média ou contagem; "Outros" junta o que passar do limite
function pivotData(meta,rows,cfg){
  const ix=n=>meta.columns.findIndex(c=>c.name===n);
  const rj=ix(cfg.row); if(rj<0) return null;
  const cj=cfg.col&&cfg.col!==cfg.row?ix(cfg.col):-1, yj=cfg.measure?ix(cfg.measure):-1, agg=yj<0?'count':(cfg.agg==='avg'?'avg':'sum');
  const lab=(v,j)=>v==null||v===''?'(vazio)':(meta.columns[j].type==='date'?fmtDate(v):String(v));
  const acc=()=>({s:0,n:0,c:0}), add=(a,v)=>{ a.c++; if(typeof v==='number'){ a.s+=v; a.n++; } }, mergeA=(a,b)=>{ a.s+=b.s; a.n+=b.n; a.c+=b.c; };
  const val=a=>!a?(agg==='avg'?null:0):agg==='count'?a.c:agg==='avg'?(a.n?a.s/a.n:null):a.s;
  let cols=[], colOf=()=>null;
  if (cj>=0){ const t=new Map(); for(const r of rows){ const k=lab(r[cj],cj); let a=t.get(k); if(!a){ a=acc(); t.set(k,a); } add(a,yj>=0?r[yj]:null); }
    const keys=[...t.entries()].sort((a,b)=>(val(b[1])??0)-(val(a[1])??0)).map(e=>e[0]);
    const shown=keys.length>6?keys.slice(0,5):keys; cols=keys.length>6?[...shown,'Outros']:shown; colOf=k=>shown.includes(k)?k:'Outros'; }
  const R=new Map(), tot={all:acc(),by:new Map()};
  for (const r of rows){
    const rk=lab(r[rj],rj); let o=R.get(rk); if(!o){ o={all:acc(),by:new Map()}; R.set(rk,o); }
    const v=yj>=0?r[yj]:null; add(o.all,v); add(tot.all,v);
    if (cj>=0){ const ck=colOf(lab(r[cj],cj)); for(const t of [o,tot]){ let a=t.by.get(ck); if(!a){ a=acc(); t.by.set(ck,a); } add(a,v); } }
  }
  let list=[...R.entries()].sort((a,b)=>(val(b[1].all)??0)-(val(a[1].all)??0));
  if (list.length>10){ const rest=list.slice(9), o={all:acc(),by:new Map()};
    for (const [,x] of rest){ mergeA(o.all,x.all); for(const [k,a] of x.by){ let b=o.by.get(k); if(!b){ b=acc(); o.by.set(k,b); } mergeA(b,a); } }
    list=[...list.slice(0,9),[`Outros (${rest.length})`,o]]; }
  const row=o=>({cells:cols.map(c=>val(o.by.get(c))),total:val(o.all)});
  return {agg,cols,rows:list.map(([k,o])=>({key:k,...row(o)})),total:row(tot),count:R.size,rowName:meta.columns[rj].name,colName:cj>=0?meta.columns[cj].name:'',measure:yj>=0?meta.columns[yj].name:''};
}
function pivotTable(p){

S.tvTimers=[]; S.tvLong=[];
function clearTvTimers(){ while(S.tvTimers.length) clearInterval(S.tvTimers.pop()); }
let wakeLock=null;
async function keepAwake(){ try{ if('wakeLock' in navigator&&document.visibilityState==='visible') wakeLock=await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(S.view==='tv'&&document.visibilityState==='visible') keepAwake(); });
function enterTv(meta){
  S.view='tv'; S.tvStamp=meta.updatedAt; S.tvAt=Date.now(); S.tvIdx=0;
  try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){}
  keepAwake();
  while(S.tvLong.length) clearInterval(S.tvLong.pop());
  if (meta.source&&meta.source.type==='gsheet') S.tvLong.push(setInterval(()=>{ const m=currentMeta(); if(S.view==='tv'&&m) syncSheet(m,true); },120000));
  render();
}
function exitTv(){
  clearTvTimers(); while(S.tvLong.length) clearInterval(S.tvLong.pop());
  if (wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; }
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  S.view='base'; render();
}
function tvView(){

  if (!meta||!S.rows){ v.append(el('div',{class:'tv-empty'},el('span',{class:'spinner'}),'  Carregando…')); return v; }
  // dentro do site: quando a base muda (edição, upload, sincronização), recarrega as linhas
  if (!share&&meta.updatedAt!==S.tvStamp&&!S.tvLoading){ const stamp=meta.updatedAt; S.tvLoading=true;
    loadRows(meta).then(rows=>{ S.tvLoading=false; if(S.view!=='tv'||S.currentId!==meta.id) return; S.rows=rows; S.tvStamp=stamp; S.tvAt=Date.now(); render(); }).catch(e=>{ S.tvLoading=false; console.error(e); }); }
  const cfg=tvCfg(meta), br=brand(), {rows,prev,rg}=tvRows(meta,S.rows,cfg);
  const per=(TV_PER.find(p=>p[0]===cfg.period)||TV_PER[5])[1];

  const clock=el('div',{class:'tv-clock'}), upd=el('span',{class:'tv-upd'});
  const tick=()=>{ clock.textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); const m=Math.floor((Date.now()-(S.tvAt||Date.now()))/60000); upd.textContent=m<1?'atualizado agora':m<60?`atualizado há ${m} min`:`atualizado às ${new Date(S.tvAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`; };
  tick(); S.tvTimers.push(setInterval(tick,15000));

  v.append(el('div',{class:'tv-head'},

    el('div',{class:'tv-title'},el('h1',{text:meta.name}),el('div',{class:'tv-sub',text:[br.name,per+(rg&&cfg.period!=='today'?` (${rangeTxt(rg)})`:rg?` (${fmtDate(rg.from)})`:'')].filter(Boolean).join(' · ')})),
    el('div',{class:'tv-live'},el('span',{class:'tv-dot'}),el('b',{text:'Ao vivo'}),upd),

    el('div',{class:'lb',text:x.lb.replace(' · soma','')}),el('div',{class:'vl',text:x.vl}),
    x.d?el('div',{class:'dl '+(x.d.good==null?'eq':x.d.good?'up':'down')},`${x.d.dir>0?'▲':x.d.dir<0?'▼':'■'} ${x.d.txt.replace(/^[+-]/,'')} vs período anterior`):el('div',{class:'dl eq',text:rg?'sem dados do período anterior':'todos os registros'})))));
  // tabela dinâmica + gráficos em rotação
  const p=pivotData(meta,rows,cfg);

  v.append(el('div',{class:'tv-main'},
    el('div',{class:'tv-card'},el('div',{class:'tv-card-t',text:pTitle}),el('div',{class:'tv-card-s',text:p?`${nf.format(rows.length)} registros · ${p.count} ${p.count===1?'item':'itens'} em ${p.rowName}`:''}),el('div',{class:'tv-pivot'},pivotTable(p))),
    el('div',{class:'tv-card'},el('div',{class:'tv-card-h'},el('div',{},cTitle,cSub),dots),chartBox)));
  requestAnimationFrame(drawChart);

  const gs=(meta.goals||[]).map(g=>({g,s:goalStatus(meta,g)})).filter(x=>x.s);
  if (gs.length) v.append(el('div',{class:'tv-goals'},gs.slice(0,4).map(({g,s})=>el('div',{class:'tv-goal '+s.st},
    el('div',{class:'tg-top'},el('b',{text:g.name}),el('span',{text:pct1(s.pct)})),
    el('div',{class:'g-bar'},el('i',{style:`width:${Math.min(100,Math.max(0,s.pct))}%`}),s.live?el('em',{style:`left:${(s.frac*100).toFixed(1)}%`}):null),
    el('div',{class:'tg-st',text:`${fmtNum(s.v)} de ${fmtNum(s.t)} · ${s.txt}`})))));
  return v;
}

/* ============ Modais ============ */
function modal(title,text,content,buttons){
  const bg=el('div',{class:'modal-bg'}); const close=()=>bg.remove();
  bg.addEventListener('click',e=>{ if(e.target===bg) close(); });
  const m=el('div',{class:'modal',role:'dialog','aria-modal':'true'},el('h3',{text:title}),text?el('p',{text}):null,content,
    el('div',{class:'actions'},buttons.map(b=>el('button',{class:'btn'+(b.primary?' primary':'')+(b.danger?' danger':''),onclick:async()=>{ close(); if(b.onclick) await b.onclick(); }},b.label))));
  bg.append(m); document.body.append(bg);
  document.addEventListener('keydown',function k(e){ if(e.key==='Escape'){close();document.removeEventListener('keydown',k);} });
  return close;
}
function confirmBox(title,text,okLabel){ return new Promise(res=>{ modal(title,text,null,[{label:'Cancelar',onclick:()=>res(false)},{label:okLabel,danger:true,onclick:()=>res(true)}]); const bg=document.querySelector('.modal-bg:last-child'); bg.addEventListener('click',e=>{if(e.target===bg)res(false);}); }); }
