/* ----- Aba Apresentação -----
   Gera um .pptx no navegador (PptxGenJS) com gráficos nativos do PowerPoint (editáveis):
   capa · visão geral (indicadores) · um slide por gráfico com "o que os dados mostram" · encerramento.
   A configuração fica em meta.deck; período/filtro/gráficos usam os mesmos campos dos relatórios. */
let pptxLib=null;
function getPptx(){ return pptxLib||(pptxLib=loadScript('https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js').then(()=>{ if(!window.PptxGenJS) throw new Error('pptx'); return window.PptxGenJS; }).catch(e=>{ pptxLib=null; throw e; })); }
function deckCfg(meta){
  if (!S.deckCfg[meta.id]) S.deckCfg[meta.id]={title:meta.name,subtitle:'',client:'',period:'all',filter:null,charts:(meta.charts||[]).map(c=>c.id),kpis:true,theme:'dark',notes:true,...(meta.deck||{})};
  return S.deckCfg[meta.id];
}
function deckPlan(meta,cfg){
  const rows=reportRows(meta,cfg), vd=vizData(meta,rows), plan=[];
  plan.push({kind:'cover',title:cfg.title||meta.name,sub:cfg.subtitle});
  if (cfg.kpis){ const pv=reportPrev(meta,cfg), kp=computeKpis(meta,rows,pv).map(x=>x.cmp?{...x,sm:x.cmp}:x);
    if(kp.length) plan.push({kind:'kpis',title:'Visão geral',sub:periodText(meta,cfg)+(pv&&kp.some(x=>x.cmp)?` · comparado com ${rangeTxt(pv.range)}`:''),kp:kp.slice(0,6)}); }
  for (const spec of reportSpecs(meta,cfg)){
    const res=aggregate(vd.vmeta,spec,vd.rows), L=chartLabels(spec,res);
    plan.push({kind:'chart',spec,res,title:L.title,sub:L.sub+(spec.filter?` · só ${spec.filter.col}: ${spec.filter.val}`:''),
      short:describeChart(vd.vmeta,spec,res,true),long:describeChart(vd.vmeta,spec,res)});
  }
  plan.push({kind:'end',title:'Obrigado'});
  return {plan,rows};
}
// destaque do gráfico para o painel lateral do slide
function chartHighlight(spec,res){
  if (!res||!res.labels.length) return null;
  if (spec.type==='line'){
    const i=res.values.indexOf(Math.max(...res.values));
    return {lb:'Ponto mais alto',name:String(res.labels[i]),vl:fmtNum(res.values[i])};
  }
  // o grupo "Outros (N)" nunca é o destaque: pega o maior item de verdade
  let i=-1; res.values.forEach((v,j)=>{ if(!String(res.labels[j]).startsWith('Outros (')&&(i<0||v>res.values[i])) i=j; });
  if (i<0) return null;
  const tot=res.values.reduce((a,b)=>a+b,0);
  const share=(spec.type==='pie'||!spec.y||spec.agg==='count'||spec.agg==='sum')&&tot>0?` · ${pct1(res.values[i]/tot*100)} do total`:'';
  return {lb:'Destaque',name:String(res.labels[i]),vl:fmtNum(res.values[i])+share};
}
// cores dos slides: azul padrão ou a cor da marca (com ajuste de contraste para títulos e destaques)
function deckPalette(dark){
  const br=brand(), c=br.custom?br.color:'#2962ff', acc=c.slice(1).toUpperCase(), L=lum(c);
  const hl=!br.custom?(dark?'8FA8FF':'2962FF'):dark?(L<0.12?rgbHex(mixRgb(hexRgb(c),[255,255,255],0.5)):acc):(L>0.45?rgbHex(mixRgb(hexRgb(c),[0,0,0],0.45)):acc);
  const P=dark?{bg:'0F0F0F',card:'1A1A1A',text:'FFFFFF',t2:'C9CBD2',t3:'8A8D96',line:'2A2A2A'}:{bg:'FFFFFF',card:'F2F4F7',text:'131722',t2:'3F4350',t3:'6B6F7B',line:'E3E5EA'};
  return {br,P:{...P,accent:acc,hl,onAccent:L>0.55?'111111':'FFFFFF'}};
}

  // logo da marca numa placa branca (fica legível em qualquer fundo); devolve onde o texto pode começar
  const plate=sl=>{ if(!br.logo) return 0.6; const lf=logoFit(br,2.6,0.55);
    sl.addShape(pres.shapes.ROUNDED_RECTANGLE,{x:M,y:0.45,w:lf.w+0.3,h:lf.h+0.3,rectRadius:0.08,fill:{color:'FFFFFF'},line:{color:'FFFFFF'},objectName:'Fundo do logo'});
    sl.addImage({data:br.logo.replace(/^data:/,''),x:M+0.15,y:0.6,w:lf.w,h:lf.h,altText:br.name||'Logo'});
    return 0.45+lf.h+0.3+0.2; };
  pres.defineSlideMaster({title:'CONTEUDO',background:{color:P.bg},
    slideNumber:{x:W-M-0.8,y:H-0.5,w:0.8,h:0.3,fontFace:'Calibri',fontSize:10,color:P.t3,align:'right'},
    objects:[{text:{text:footer,options:{x:M,y:H-0.5,w:8,h:0.3,fontFace:'Calibri',fontSize:10,color:P.t3,margin:0}}}]});
  const T=(sl,text,o)=>sl.addText(text,{margin:0,isTextBox:true,fontFace:'Calibri',...o});
  const card=(sl,x,y,w,h,name)=>sl.addShape(pres.shapes.ROUNDED_RECTANGLE,{x,y,w,h,rectRadius:0.12,fill:{color:P.card},line:{color:P.card},objectName:name});
  const titleSize=t=>t.length>70?24:t.length>45?28:32;
  // motivo visual: colunas coloridas (capa e encerramento)
  const bars=(sl,x0,base,scale)=>{ const hs=[1.5,2.5,1.9,3.2,4.1], cs=PIE_COLORS.dark;
    hs.forEach((h,i)=>sl.addShape(pres.shapes.ROUNDED_RECTANGLE,{x:x0+i*0.82*scale,y:base-h*scale,w:0.56*scale,h:h*scale,rectRadius:0.08,fill:{color:hex(cs[i])},line:{color:hex(cs[i])},objectName:'Coluna decorativa '+(i+1)})); };
  const head=(sl,n,title,sub)=>{
    sl.addShape(pres.shapes.OVAL,{x:M,y:0.62,w:0.5,h:0.5,fill:{color:P.accent},line:{color:P.accent},objectName:'Número do slide'});
    T(sl,String(n).padStart(2,'0'),{x:M,y:0.62,w:0.5,h:0.5,fontSize:13,bold:true,color:P.onAccent,align:'center',valign:'middle'});
    T(sl,title,{x:M+0.75,y:0.5,w:W-2*M-0.75,h:0.75,fontSize:titleSize(title),bold:true,color:P.text,valign:'middle'});
    if (sub) T(sl,sub,{x:M+0.75,y:1.22,w:W-2*M-0.75,h:0.4,fontSize:14,color:P.t3,valign:'top'});
  };
  const dateTxt=new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});
  let n=0;
  for (const s of plan){
    if (s.kind==='cover'){
      const sl=pres.addSlide(); sl.background={color:'0F0F0F'};
      const ky=plate(sl), tyy=Math.max(1.6,ky+0.5);
      T(sl,(br.name||'Apresentação de resultados').toUpperCase(),{x:M,y:ky,w:8,h:0.4,fontSize:12,bold:true,color:'8A8D96',charSpacing:2});
      const ts=s.title.length>60?32:s.title.length>32?38:46;
      T(sl,s.title,{x:M,y:tyy,w:7.6,h:4.1-tyy,fontSize:ts,bold:true,color:'FFFFFF',valign:'bottom',fit:'shrink'});
      if (s.sub) T(sl,s.sub,{x:M,y:4.25,w:7.6,h:0.9,fontSize:20,color:'C9CBD2',valign:'top'});
      const info=[cfg.client?`Preparado para ${cfg.client}`:null,`Dados: ${periodText(meta,cfg)}`,[who,pf.role].filter(Boolean).join(' · ')+` · ${dateTxt}`].filter(Boolean);
      T(sl,info.map((t,i)=>({text:t,options:{breakLine:i<info.length-1,bold:i===0&&!!cfg.client,color:i===0&&cfg.client?'FFFFFF':'C9CBD2'}})),{x:M,y:5.35,w:7.6,h:1.4,fontSize:14,valign:'bottom',paraSpaceAfter:4});
      bars(sl,9.0,6.75,1);
      continue;
    }
    if (s.kind==='end'){
      const sl=pres.addSlide(); sl.background={color:'0F0F0F'}; plate(sl);
      T(sl,'Obrigado',{x:M,y:2.0,w:7.6,h:1.4,fontSize:54,bold:true,color:'FFFFFF',valign:'bottom'});
      T(sl,'Dúvidas e próximos passos: vamos conversar.',{x:M,y:3.5,w:7.6,h:0.6,fontSize:20,color:'C9CBD2'});
      const info=[who,pf.role,pf.company].filter(Boolean);
      T(sl,info.map((t,i)=>({text:t,options:{breakLine:i<info.length-1,bold:i===0,color:i===0?'FFFFFF':'C9CBD2'}})),{x:M,y:5.0,w:7.6,h:1.6,fontSize:14,valign:'bottom'});
      bars(sl,9.0,6.75,1);
      continue;
    }
    n++;
    const sl=pres.addSlide({masterName:'CONTEUDO'});
    head(sl,n,s.title,s.sub);
    if (s.kind==='kpis'){
      const k=s.kp, cols=k.length<=3?k.length:3, rowsN=Math.ceil(k.length/cols), gap=0.3;
      const cw=(W-2*M-gap*(cols-1))/cols, top=2.0, avail=H-0.9-top, ch=Math.min(2.3,(avail-gap*(rowsN-1))/rowsN);
      const cs=PIE_COLORS[mode];
      k.forEach((x,i)=>{
        const cx=M+(i%cols)*(cw+gap), cy=top+Math.floor(i/cols)*(ch+gap);
        card(sl,cx,cy,cw,ch,'Indicador '+(i+1));
        sl.addShape(pres.shapes.OVAL,{x:cx+0.35,y:cy+0.38,w:0.16,h:0.16,fill:{color:hex(cs[i%cs.length])},line:{color:hex(cs[i%cs.length])}});
        T(sl,x.lb,{x:cx+0.62,y:cy+0.25,w:cw-0.95,h:0.42,fontSize:14,color:P.t2,valign:'middle'});
        T(sl,x.vl,{x:cx+0.35,y:cy+0.75,w:cw-0.7,h:0.85,fontSize:String(x.vl).length>18?20:x.small||String(x.vl).length>12?26:36,bold:true,color:P.text,valign:'middle'});
        if (x.sm) T(sl,x.sm,{x:cx+0.35,y:cy+ch-0.6,w:cw-0.7,h:0.4,fontSize:12,color:P.t3,valign:'top'});
      });
      if (cfg.notes) sl.addNotes(k.map(x=>`${x.lb}: ${x.vl}${x.sm?' ('+x.sm+')':''}`).join('\n'));
      continue;
    }
    // slide de gráfico: gráfico nativo à esquerda, leitura à direita
    const res=s.res, spec=s.spec, cx=M, cy=1.85, cw=8.4, chH=H-0.95-cy;
    const px=cx+cw+0.35, pw=W-M-px;
    if (!res||!res.labels.length){
      card(sl,cx,cy,cw,chH,'Sem dados');
      T(sl,'Sem dados para este gráfico no período escolhido.',{x:cx,y:cy,w:cw,h:chH,fontSize:16,color:P.t3,align:'center',valign:'middle'});
    } else {
      const cnt=res.labels.length, labels=res.labels.map(l=>{ l=String(l); return l.length>28?l.slice(0,27)+'…':l; });
      const fmt=res.values.some(v=>Math.abs(v%1)>1e-9)?'#,##0.00':'#,##0';
      const colors=colorsFor(res.labels,mode).map(hex);
      const base={x:cx,y:cy,w:cw,h:chH,
        catAxisLabelColor:P.t2,valAxisLabelColor:P.t3,catAxisLabelFontSize:11,valAxisLabelFontSize:10,
        catAxisLabelFontFace:'Calibri',valAxisLabelFontFace:'Calibri',dataLabelFontFace:'Calibri',legendFontFace:'Calibri',
        dataLabelFontSize:10,dataLabelColor:P.t2,valGridLine:{color:P.line,size:0.75},catGridLine:{style:'none'},
        catAxisLineColor:P.line,valAxisLineShow:false,showLegend:false,valAxisLabelFormatCode:fmt,dataLabelFormatCode:fmt};
      const data=[{name:s.title,labels,values:res.values}];
      const cutL=l=>{ l=String(l); return l.length>28?l.slice(0,27)+'…':l; };
      if (spec.type==='stacked'&&res.stack) sl.addChart(pres.charts.BAR,res.stack.series.map(x=>({name:x.name,labels:res.stack.labels.map(cutL),values:x.values})),{...base,barDir:'col',barGrouping:'stacked',
        chartColors:colorsFor(res.stack.series.map(x=>x.name),mode).map(hex),barGapWidthPct:55,showLegend:res.stack.series.length>1,legendPos:'t',legendFontSize:11,legendColor:P.t2,showValue:false,catAxisLabelRotate:res.stack.labels.length>8?-45:0});
      else if (spec.type==='pivot'&&res.pivot){ const p=res.pivot, hdr=[p.rowName,...p.cols,p.cols.length?'Total':(p.agg==='count'?'Registros':p.measure)];
        const cellO=(t,o={})=>({text:t,options:{fontFace:'Calibri',fontSize:12,color:P.text,fill:{color:o.head?P.card:P.bg},bold:!!o.bold,align:o.num?'right':'left',border:[{type:'none'},{type:'none'},{pt:0.75,color:P.line},{type:'none'}],...o.x}});
        const f=v=>v==null?'—':fmtNum(v);
        const rowsT=[hdr.map((h,i)=>cellO(h,{head:true,bold:true,num:i>0,x:{color:P.t2,fontSize:11}})),...p.rows.map(r=>[cellO(r.key),...r.cells.map(v=>cellO(f(v),{num:true})),cellO(f(r.total),{num:true,bold:true})]),
          [cellO('Total',{bold:true}),...p.total.cells.map(v=>cellO(f(v),{num:true,bold:true})),cellO(f(p.total.total),{num:true,bold:true})]];
        sl.addTable(rowsT,{x:cx,y:cy,w:cw,colW:[Math.min(3,cw*0.36),...Array(hdr.length-1).fill((cw-Math.min(3,cw*0.36))/(hdr.length-1))],rowH:Math.min(0.42,chH/(rowsT.length+0.5)),margin:[3,6,3,6]}); }
      else if (spec.type==='map'||spec.type==='funnel'){ // sem mapa/funil nativo no PowerPoint: barras horizontais na mesma ordem
        const lbs=spec.type==='map'?res.labels.map(l=>ufOf(l)||cutL(l)):labels;
        sl.addChart(pres.charts.BAR,[{name:s.title,labels:lbs,values:res.values}],{...base,barDir:'bar',chartColors:barColors(res,mode).map(hex),barGapWidthPct:40,showValue:cnt<=27,dataLabelPosition:'outEnd',catAxisOrientation:'maxMin'}); }
      else if (spec.type==='pie') sl.addChart(pres.charts.DOUGHNUT,data,{...base,holeSize:58,chartColors:colors,showLegend:true,legendPos:'r',legendFontSize:12,legendColor:P.t2,
        showPercent:true,showValue:false,dataLabelColor:'FFFFFF',dataLabelFontSize:11,dataBorder:{pt:1.5,color:P.bg}});
      else if (spec.type==='line') sl.addChart(pres.charts.LINE,data,{...base,chartColors:[hex(ACCENT[mode])],lineSize:2.5,
        lineDataSymbol:cnt>40?'none':'circle',lineDataSymbolSize:6,showValue:cnt<=12,dataLabelPosition:'t',catAxisLabelRotate:cnt>12?-45:0});
      else sl.addChart(pres.charts.BAR,data,{...base,barDir:spec.type==='hbar'?'bar':'col',chartColors:barColors(res,mode).map(hex),barGapWidthPct:55,
        showValue:cnt<=16,dataLabelPosition:'outEnd',catAxisOrientation:spec.type==='hbar'?'maxMin':'minMax',catAxisLabelRotate:spec.type!=='hbar'&&cnt>8?-45:0});
    }
    // painel "o que os dados mostram"
    card(sl,px,cy,pw,chH,'Leitura do gráfico');
    T(sl,'O que os dados mostram',{x:px+0.3,y:cy+0.28,w:pw-0.6,h:0.4,fontSize:14,bold:true,color:P.hl});
    const hl=chartHighlight(spec,res); let ty=cy+0.8;
    if (hl){
      T(sl,hl.lb.toUpperCase(),{x:px+0.3,y:ty,w:pw-0.6,h:0.3,fontSize:10,bold:true,color:P.t3,charSpacing:1});
      T(sl,hl.name.length>24?hl.name.slice(0,23)+'…':hl.name,{x:px+0.3,y:ty+0.3,w:pw-0.6,h:0.45,fontSize:18,bold:true,color:P.text,valign:'top'});
      T(sl,hl.vl,{x:px+0.3,y:ty+0.8,w:pw-0.6,h:0.4,fontSize:14,color:P.t2});
      ty+=1.45;
    }
    // cabe no painel: ~30 caracteres por linha de 14pt, ~0,26" por linha; corta no fim de uma frase quando possível
    const boxH=cy+chH-ty-0.25, maxC=Math.floor(boxH/0.27)*28;
    let txt=s.short;
    if (txt.length>maxC){ const cut=txt.slice(0,maxC), dot=cut.lastIndexOf('. '); txt=dot>maxC*0.5?cut.slice(0,dot+1):cut.slice(0,cut.lastIndexOf(' '))+'…'; }
    T(sl,txt,{x:px+0.3,y:ty,w:pw-0.6,h:boxH,fontSize:14,color:P.t2,valign:'top'});
    if (cfg.notes) sl.addNotes(s.long);
  }
  const fileName=`${(cfg.title||meta.name).replace(/[\\/:*?"<>|]/g,'_')} - apresentacao.pptx`;
  return {pres,fileName,slides:plan.length};
}
async function downloadDeck(meta,cfg,btn){
  if (btn){ btn.disabled=true; btn.dataset.t=btn.textContent; btn.textContent='Gerando apresentação…'; }
  try{
    const {pres,fileName}=await buildDeck(meta,cfg);
    await pres.writeFile({fileName});
    toast('Apresentação gerada. Abra no PowerPoint, Keynote ou Google Apresentações.');
    saveDeckCfg(meta,cfg);
  }catch(e){ console.error(e); toast(e&&e.code==='lib-load'?'Não foi possível carregar o gerador de apresentações. Verifique sua conexão.':'Não foi possível gerar a apresentação.',true); }
  finally{ if(btn){ btn.disabled=false; btn.textContent=''; btn.append(icon('slides'),btn.dataset.t); } }
}
// mesma apresentação em PDF (16:9), desenhada com jsPDF nas mesmas posições dos slides
function buildDeckPdf(meta,cfg){
  const {plan}=deckPlan(meta,cfg);
  const dark=cfg.theme!=='light', mode=dark?'dark':'light', BP=deckPalette(dark), P=BP.P, br=BP.br;
  const rgb=h=>{ h=String(h).replace('#',''); return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)); };
  const pf=S.profile||{}, who=profileName(), W=13.333, H=7.5, M=0.6;
  const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'in',format:[W,H]});
  const fill=h=>doc.setFillColor(...rgb(h));
  const lh=s=>s/72*1.2;
  // caixa de texto: quebra linhas, corta com "..." se não couber e alinha na vertical
  const T=(text,x,y,w,h,o={})=>{
    doc.setFont('helvetica',o.bold?'bold':'normal'); doc.setFontSize(o.size||14); doc.setTextColor(...rgb(o.color||P.text));
    let lines=doc.splitTextToSize(pdfTxt(text),w); const max=Math.max(1,Math.floor((h+0.01)/lh(o.size||14)));
    if (lines.length>max){ lines=lines.slice(0,max); lines[max-1]=lines[max-1].replace(/\s*\S*$/,'')+'...'; }
    const th=lines.length*lh(o.size||14), ty=o.valign==='bottom'?y+h-th:o.valign==='middle'?y+(h-th)/2:y;
    lines.forEach((l,i)=>doc.text(l,o.align==='center'?x+w/2:o.align==='right'?x+w:x,ty+i*lh(o.size||14)+(o.size||14)/72*0.92,{align:o.align||'left'}));
  };
  const card=(x,y,w,h)=>{ fill(P.card); doc.roundedRect(x,y,w,h,0.12,0.12,'F'); };
  const bg=c=>{ fill(c); doc.rect(0,0,W,H,'F'); };
  const bars=()=>{ [1.5,2.5,1.9,3.2,4.1].forEach((h,i)=>{ fill(PIE_COLORS.dark[i]); doc.roundedRect(9.0+i*0.82,6.75-h,0.56,h,0.08,0.08,'F'); }); };
  const titleSize=t=>t.length>70?24:t.length>45?28:32;
  const dateTxt=new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});
  const footer=[br.name,cfg.title||meta.name].filter(Boolean).join(' · ');
  const plate=()=>{ if(!br.logo) return 0.6; const lf=logoFit(br,2.6,0.55); fill('FFFFFF'); doc.roundedRect(M,0.45,lf.w+0.3,lf.h+0.3,0.08,0.08,'F');
    try{ doc.addImage(br.logo,'PNG',M+0.15,0.6,lf.w,lf.h); }catch(e){ console.warn(e); } return 0.45+lf.h+0.3+0.2; };
  let n=0, first=true, page=0;
  for (const s of plan){
    if (!first) doc.addPage([W,H],'landscape'); first=false; page++;
    if (s.kind==='cover'){
      bg('0F0F0F');
      const ky=plate(), tyy=Math.max(1.6,ky+0.5);
      T((br.name||'Apresentação de resultados').toUpperCase(),M,ky,8,0.4,{size:12,bold:true,color:'8A8D96'});
      T(s.title,M,tyy,7.6,4.1-tyy,{size:s.title.length>60?32:s.title.length>32?38:46,bold:true,color:'FFFFFF',valign:'bottom'});
      if (s.sub) T(s.sub,M,4.25,7.6,0.9,{size:20,color:'C9CBD2'});
      const info=[cfg.client?`Preparado para ${cfg.client}`:null,`Dados: ${periodText(meta,cfg)}`,[who,pf.role].filter(Boolean).join(' · ')+` · ${dateTxt}`].filter(Boolean);
      info.forEach((t,i)=>T(t,M,6.75-(info.length-i)*0.32,7.6,0.32,{size:14,bold:i===0&&!!cfg.client,color:i===0&&cfg.client?'FFFFFF':'C9CBD2'}));
      bars(); continue;
    }
    if (s.kind==='end'){
      bg('0F0F0F'); plate();
      T('Obrigado',M,2.0,7.6,1.4,{size:54,bold:true,color:'FFFFFF',valign:'bottom'});
      T('Dúvidas e próximos passos: vamos conversar.',M,3.5,7.6,0.6,{size:20,color:'C9CBD2'});
      const info=[who,pf.role,pf.company].filter(Boolean);
      info.forEach((t,i)=>T(t,M,6.6-(info.length-i)*0.32,7.6,0.32,{size:14,bold:i===0,color:i===0?'FFFFFF':'C9CBD2'}));
      bars(); continue;
    }
    n++; bg(P.bg);
    // cabeçalho
    fill(P.accent); doc.circle(M+0.25,0.87,0.25,'F');
    T(String(n).padStart(2,'0'),M,0.62,0.5,0.5,{size:13,bold:true,color:P.onAccent,align:'center',valign:'middle'});
    T(s.title,M+0.75,0.5,W-2*M-0.75,0.75,{size:titleSize(s.title),bold:true,valign:'middle'});
    if (s.sub) T(s.sub,M+0.75,1.22,W-2*M-0.75,0.4,{size:14,color:P.t3});
    // rodapé
    T(footer,M,H-0.5,8,0.3,{size:10,color:P.t3});
    T(String(page),W-M-0.8,H-0.5,0.8,0.3,{size:10,color:P.t3,align:'right'});
    if (s.kind==='kpis'){
      const k=s.kp, cols=k.length<=3?k.length:3, rowsN=Math.ceil(k.length/cols), gap=0.3;
      const cw=(W-2*M-gap*(cols-1))/cols, top=2.0, avail=H-0.9-top, ch=Math.min(2.3,(avail-gap*(rowsN-1))/rowsN), cs=PIE_COLORS[mode];
      k.forEach((x,i)=>{
        const cx=M+(i%cols)*(cw+gap), cy=top+Math.floor(i/cols)*(ch+gap);
        card(cx,cy,cw,ch); fill(cs[i%cs.length]); doc.circle(cx+0.43,cy+0.46,0.08,'F');
        T(x.lb,cx+0.62,cy+0.25,cw-0.95,0.42,{size:14,color:P.t2,valign:'middle'});
        T(x.vl,cx+0.35,cy+0.75,cw-0.7,0.85,{size:String(x.vl).length>18?20:x.small||String(x.vl).length>12?26:36,bold:true,valign:'middle'});
        if (x.sm) T(x.sm,cx+0.35,cy+ch-0.6,cw-0.7,0.4,{size:12,color:P.t3});
      });
      continue;
    }
    const res=s.res, spec=s.spec, cx=M, cy=1.85, cw=8.4, chH=H-0.95-cy, px=cx+cw+0.35, pw=W-M-px;
    if (!res||!res.labels.length){ card(cx,cy,cw,chH); T('Sem dados para este gráfico no período escolhido.',cx,cy,cw,chH,{size:16,color:P.t3,align:'center',valign:'middle'}); }
    else {
      const img=chartImage(spec,res,'',{w:Math.round(cw*84),h:Math.round(chH*84),mode,bg:'#'+P.bg,grid:'#'+P.line,t2:'#'+P.t2,border:'#'+P.line,val:'#'+P.t2,font:14});
      doc.addImage(img,'JPEG',cx,cy,cw,chH);
    }
    card(px,cy,pw,chH);
    T('O que os dados mostram',px+0.3,cy+0.28,pw-0.6,0.4,{size:14,bold:true,color:P.hl});
    const hl=chartHighlight(spec,res); let ty=cy+0.8;
    if (hl){
      T(hl.lb.toUpperCase(),px+0.3,ty,pw-0.6,0.3,{size:10,bold:true,color:P.t3});
      T(hl.name.length>24?hl.name.slice(0,23)+'…':hl.name,px+0.3,ty+0.3,pw-0.6,0.45,{size:18,bold:true});
      T(hl.vl,px+0.3,ty+0.8,pw-0.6,0.4,{size:14,color:P.t2});
      ty+=1.45;
    }
    T(s.short,px+0.3,ty,pw-0.6,cy+chH-ty-0.25,{size:14,color:P.t2});
  }
  return {doc,fileName:`${(cfg.title||meta.name).replace(/[\\/:*?"<>|]/g,'_')} - apresentacao.pdf`};
}
function saveDeckCfg(meta,cfg){
  if (S.readOnly) return;
  const m=structuredClone(meta); m.deck=structuredClone(cfg);
  if (JSON.stringify(m.deck)===JSON.stringify(meta.deck)) return;
  m.columns=m.columns.filter(c=>!c.virtual); const i=S.bases.findIndex(b=>b.id===m.id); if(i>=0) S.bases[i]=structuredClone(m);
  saveMeta(m).catch(handleWriteError);
}
async function downloadDeckPdf(meta,cfg,btn){
  if (!pdfReady()) return;
  if (btn){ btn.disabled=true; btn.dataset.t=btn.textContent; btn.textContent='Gerando PDF…'; }

    const off=[]; if(!typeOk(meta,'line',st.x)) off.push(cols.some(c=>c.type==='date')?'Linha: agrupe por uma coluna de data ou número.':'Linha: esta base não tem coluna de data.'); if(!typeOk(meta,'pie',st.x)) off.push('Rosca, funil e empilhadas: agrupe por uma coluna de texto (categorias).'); if(!typeOk(meta,'map',st.x,rows)) off.push('Mapa: agrupe por uma coluna com estados (UF ou nome do estado).');
    typeNote.textContent=off.join(' · ');
    xSel.value=st.x; ySel.value=st.y;
    const aggs=!st.y?['count']:(st.type==='pie'?['sum']:['stacked','pivot','funnel','map'].includes(st.type)?['sum','avg']:['sum','avg','max','min']);
    if (!aggs.includes(st.agg)) st.agg=aggs[0];
    aSel.innerHTML=''; aggs.forEach(a=>aSel.append(el('option',{value:a,selected:st.agg===a,text:AGG[a]}))); aSel.disabled=aggs.length<2;
    // pré-visualização
    if (pv){ try{pv.destroy();}catch(e){} pv=null; }
    pvBody.innerHTML='';
    const res=aggregate(meta,st,rows);
    const L=chartLabels(st,res), yLabel=L.yLabel;
    pvTitle.textContent=L.title; pvSub.textContent=L.sub+(st.filter?` · só ${st.filter.col}: ${st.filter.val}`:'');
    pvDesc.textContent=describeChart(meta,st,res);
    createBtn.disabled=!typeOk(meta,st.type,st.x);
    if (!res||!res.labels.length){ pvBody.append(el('div',{class:'muted',style:'height:120px;display:grid;place-items:center',text:'Sem dados para esta combinação com os filtros atuais.'})); return; }
    if (HTML_TYPES.has(st.type)){ pvBody.append(htmlChart(st,res,meta)); return; }
    const box=el('div',{class:'chart-box'}), cv=el('canvas',{'aria-label':`${yLabel} por ${st.x}`,role:'img'}); box.append(cv); pvBody.append(box);
    requestAnimationFrame(()=>{ const ch=makeChart(cv,st,res,yLabel); if(!ch) return; const i=charts.indexOf(ch); if(i>=0) charts.splice(i,1); pv=ch; });
  }

  const m=el('div',{class:'modal wide',role:'dialog','aria-modal':'true'},
    el('h3',{text:'Novo gráfico'}),
    el('p',{text:`Escolha uma sugestão montada a partir das colunas de “${meta.name}” ou monte o seu. A prévia usa os filtros atuais.`}),
    sugs.length?el('div',{class:'sec-lb',text:'Sugestões para esta base'}):null,
    sugs.length?el('div',{class:'sug-grid'},sugBtns):null,
    el('div',{class:'sec-lb',text:'Tipo de gráfico'}),
    el('div',{class:'type-grid'},typeBtns), typeNote,
    el('div',{class:'sec-lb',text:'Dados'}),
    el('div',{class:'form-row'},el('label',{class:'field'},'Mostrar por',xSel),el('label',{class:'field'},'O que somar',ySel),el('label',{class:'field'},'Cálculo',aSel),sFld),
    el('div',{class:'sec-lb',text:'Prévia'}),
    el('div',{class:'preview'},el('div',{class:'chart-head'},el('div',{style:'flex:1;min-width:0'},pvTitle,pvSub)),pvBody,pvDesc),
    el('div',{class:'actions'},el('button',{class:'btn',onclick:close},'Cancelar'),createBtn));
  bg.append(m); document.body.append(bg);
  sync();
}
// prev (opcional): {rows, range} do período anterior; cada indicador ganha d (variação) e cmp (texto)
function computeKpis(meta,rows,prev){
  const P=prev&&prev.rows;
  const out=[{lb:'Registros',vl:nf.format(rows.length),sm:rows.length===S.rows.length?'total da base':`de ${nf.format(S.rows.length)} no total`,d:P?deltaOf(rows.length,P.length,'registros'):null}];
  meta.columns.forEach((c,j)=>{ if(c.type!=='number'||out.length>=5) return;
    if (CODE_RX.test(c.name)||/(pedido|n[uú]mero|c[oó]d|^n[ºo°.]|nota|matr[ií]cula|^ano$)/i.test(c.name)) return; // somar códigos não faz sentido
    let s=0,n=0,mn=Infinity,mx=-Infinity; for(const r of rows){ const v=r[j]; if(typeof v==='number'){s+=v;n++; if(v<mn)mn=v; if(v>mx)mx=v;} }
    const avg=AVG_RX.test(c.name); // preço unitário, %, taxa, idade…: a soma não diz nada, a média sim
    let d=null; if(P){ let ps=0,pn=0; for(const r of P){ const v=r[j]; if(typeof v==='number'){ ps+=v; pn++; } } if(pn) d=deltaOf(avg?s/(n||1):s,avg?ps/pn:ps,c.name); }
    out.push(avg?{lb:`${c.name} · média`,title:c.name,vl:n?fmtNum(s/n):'—',sm:n?`mín ${fmtNum(mn)} · máx ${fmtNum(mx)}`:'sem valores',d}
      :{lb:`${c.name} · soma`,title:c.name,vl:fmtNum(s),sm:n?`média ${fmtNum(s/n)} · mín ${fmtNum(mn)} · máx ${fmtNum(mx)}`:'sem valores',d});
  });
  const dcol=meta.columns.find(c=>c.type==='date');
  if (dcol){ const j=meta.columns.indexOf(dcol); const ds=rows.map(r=>r[j]).filter(v=>v&&/^\d{4}-\d{2}-\d{2}$/.test(v)).sort(); if(ds.length&&out.length<6) out.push({lb:`Período (${dcol.name})`,vl:`${fmtDate(ds[0])} – ${fmtDate(ds[ds.length-1])}`,small:true}); }
  for (const x of out) if (x.d) x.cmp=`${x.d.txt} vs período anterior`;
  return out;
}

/* ----- Relatório em PDF ----- */
const PDFC={accent:[42,120,214],accentWeak:[234,242,252],text:[17,17,17],t2:[82,81,78],t3:[125,124,119],line:[222,221,216],soft:[245,246,248]};
// fontes padrão do PDF só aceitam Latin-1: troca travessões, aspas curvas etc.
const pdfTxt=s=>String(s??'').replace(/›/g,'>').replace(/[—–]/g,'-').replace(/[“”„]/g,'"').replace(/[‘’]/g,"'").replace(/…/g,'...').replace(/•/g,'-').replace(/[  ]/g,' ').replace(/[^\x00-\xFF]/g,'');
const pct1=v=>nf.format(Math.round(v*10)/10)+'%';

// título, subtítulo e rótulo da medida de um gráfico
function chartLabels(spec,res){
  const yLabel=(!spec.y||spec.agg==='count')?'Quantidade de registros':`${AGG[spec.agg]} de ${spec.y}`;
  const gTxt=res&&res.gran&&!(res.gran==='h'&&/hora|hor[aá]rio/i.test(spec.x))?{y:' por ano',m:' por mês',d:' por dia',h:' por hora'}[res.gran]:'';
  return {yLabel,title:spec.title||yLabel,sub:`${spec.title?yLabel+' ':''}por ${spec.x}${gTxt}`};
}
// explicação do gráfico: o que ele mostra + leituras dos dados (short = versão curta para o card)
function describeChart(meta,spec,res,short=false){
  if (!res||!res.labels.length) return 'Não há dados para este gráfico com os filtros aplicados.';
  const isCount=!spec.y||spec.agg==='count';
  const additive=isCount||spec.agg==='sum';
  let measure=isCount?'a quantidade de registros':`${{sum:'a soma',avg:'a média',max:'o valor máximo',min:'o valor mínimo'}[spec.agg]} de "${spec.y}"`;
  if (spec.abs&&!isCount) measure+=' (sem o sinal de negativo)';
  const scope=spec.filter?`, considerando só "${spec.filter.col}" = ${spec.filter.val}`:'';
  const vals=res.values, labels=res.labels, n=vals.length;
  const total=vals.reduce((a,b)=>a+b,0);
  const idx=labels.map((_,i)=>i).filter(i=>res.ordered||!String(labels[i]).startsWith('Outros ('));
  let iMax=idx[0], iMin=idx[0]; for(const i of idx){ if(vals[i]>vals[iMax]) iMax=i; if(vals[i]<vals[iMin]) iMin=i; }
  const share=v=>additive&&total>0&&vals.every(x=>x>=0)?` (${pct1(v/total*100)} do total)`:'';
  const timeLike=res.ordered&&!!res.gran;
  const per={y:'ano',m:'mês',d:'dia',h:'hora'}[res.gran]||'período';
  const at=l=>res.gran==='h'?`às ${l}`:`em ${l}`;
  let what;
  if (spec.why) what=spec.why;
  else if (timeLike) what=`Mostra a evolução de ${measure} ${res.gran==='h'?'ao longo do dia, hora a hora':`ao longo do tempo, por ${per}`}${scope}.`;
  else if (spec.type==='pie') what=`Mostra como ${measure} se divide entre os valores de "${spec.x}"${scope}.`;
  else what=`Compara ${measure} entre os valores de "${spec.x}"${scope}.`;
  const p=[];
  if (/^movimento$/i.test(spec.x)&&!isCount&&spec.agg==='sum'){
    const e=labels.indexOf('Entrada'), s=labels.indexOf('Saída');
    const ve=e>=0?Math.abs(vals[e]):0, vs=s>=0?Math.abs(vals[s]):0, d=ve-vs;
    p.push(`Entraram ${fmtNum(ve)} e saíram ${fmtNum(vs)}.`);
    p.push(d===0?'Entradas e saídas se anularam no período.':`O resultado foi ${d>0?'positivo':'negativo'} em ${fmtNum(Math.abs(d))}${ve>0?` (as saídas consumiram ${pct1(vs/ve*100)} do que entrou)`:''}.`);
  } else if (timeLike){
    if (n>1) p.push(`O pico foi ${at(labels[iMax])}, com ${fmtNum(vals[iMax])}; o menor valor foi ${at(labels[iMin])}, com ${fmtNum(vals[iMin])}.`);
    if (res.gran!=='h'&&n>=2&&vals[0]!==0){ const ch=(vals[n-1]-vals[0])/Math.abs(vals[0])*100;
      p.push(Math.abs(ch)<0.05?`O valor ficou estável entre ${labels[0]} e ${labels[n-1]}.`:`Entre ${labels[0]} e ${labels[n-1]} houve ${ch>0?'alta':'queda'} de ${pct1(Math.abs(ch))}.`); }
    if (additive) p.push(`Total: ${fmtNum(total)}, média de ${fmtNum(total/n)} por ${per}.`);
  } else {
    p.push(`${spec.type==='pie'?'A maior fatia é':'O destaque é'} "${labels[iMax]}", com ${fmtNum(vals[iMax])}${share(vals[iMax])}.`);
    if (additive&&!res.ordered&&idx.length>=4&&total>0&&vals.every(x=>x>=0)){ const top3=[...idx].sort((a,b)=>vals[b]-vals[a]).slice(0,3).reduce((s,i)=>s+vals[i],0); p.push(`Os 3 primeiros concentram ${pct1(top3/total*100)} do total.`); }
    if (idx.length>1&&iMin!==iMax) p.push(`O menor é "${labels[iMin]}", com ${fmtNum(vals[iMin])}.`);
    if (additive) p.push(`Total: ${fmtNum(total)}.`);
  }
  const fc=spec.forecast&&spec.type==='line'?forecastOf(res):null;
  if (spec.type==='funnel'&&n>=2&&vals[0]){ what=spec.why||`Mostra ${measure} em cada etapa de "${spec.x}", da maior para a menor${scope}.`; p.length=0;
    p.push(`Da primeira etapa ("${labels[0]}") para a última ("${labels[n-1]}") ficam ${pct1(Math.abs(vals[n-1]/vals[0])*100)}.`);
    let worst=1; for(let i=2;i<n;i++) if(vals[i]/vals[i-1]<vals[worst]/vals[worst-1]) worst=i; p.push(`A maior perda é de "${labels[worst-1]}" para "${labels[worst]}": passam ${pct1(Math.abs(vals[worst]/vals[worst-1])*100)}.`); }
  if (spec.type==='map'){ const ufs=res.labels.filter(l=>ufOf(l)).length; if(!spec.why) what=`Mostra ${measure} em cada estado (${ufs} de 27 com dados)${scope}.`; }
  if (spec.type==='stacked'&&spec.series&&res.stack&&res.stack.series.length>1&&!spec.why) what=`Compara ${measure} entre os valores de "${spec.x}", com cada barra dividida por "${spec.series}"${scope}.`;
  if (spec.type==='pivot'&&!spec.why) what=`Tabela resumo: ${measure} por "${spec.x}"${spec.series?` e "${spec.series}"`:''}${scope}.`;
  return [what,...(short?p.slice(0,2):p),fc?forecastText(fc,res):null].filter(Boolean).join(' ');
}

// th (opcional): {w,h,mode:'light'|'dark',bg,grid,t2,border,val,font} para o PDF da apresentação
function chartImage(spec,res,yLabel,th={}){
  const W=th.w||900,H=th.h||400, mode=th.mode||'light', grid=th.grid||'#e8e7e2', t2=th.t2||'#52514e', bgc=th.bg||'#fff';
  const wrap=el('div',{style:`position:fixed;left:-10000px;top:0;width:${W}px;height:${H}px`});
  const cv=el('canvas',{width:W,height:H}); wrap.append(cv); document.body.append(wrap);
  const horiz=spec.type==='hbar', line=spec.type==='line';
  const font={family:'Inter, Arial, sans-serif',size:th.font||13};
  const showVals=res.labels.length<=(line?12:16);
  const bg={id:'bg',beforeDraw(ch){ const c=ch.ctx; c.save(); c.fillStyle=bgc; c.fillRect(0,0,ch.width,ch.height); c.restore(); }};
  const vl={id:'vl',afterDatasetsDraw(ch){ if(!showVals) return; const c=ch.ctx; c.save(); c.font=`600 ${(th.font||13)-1}px Inter, Arial, sans-serif`; c.fillStyle=th.val||'#222';
    ch.getDatasetMeta(0).data.forEach((pt,i)=>{ if(i>=res.values.length) return; const t=fmtNum(res.values[i]); if(horiz){ c.textAlign='left'; c.textBaseline='middle'; c.fillText(t,pt.x+6,pt.y); } else { c.textAlign='center'; c.textBaseline='bottom'; c.fillText(t,pt.x,pt.y-(line?8:5)); } }); c.restore(); }};
  const valueAxis={beginAtZero:true,grace:'10%',grid:{color:grid,drawTicks:false},border:{display:false},ticks:{color:t2,padding:8,font,callback:v=>nfc.format(v)}};
  const catAxis={grid:{display:false},border:{color:th.border||'#cfcec8'},ticks:{color:t2,font,autoSkip:true,maxRotation:horiz?0:40,callback:function(v){ const l=String(this.getLabelForValue(v)); return l.length>26?l.slice(0,25)+'…':l; }}};
  let ch;
  if (HTML_TYPES.has(spec.type)){ wrap.remove(); return htmlChartImage(spec,res,{...th,w:W,h:H,mode,bg:bgc,t2,grid,accent:brand().color}); }
  const extra=extraChartConfig(spec,res,yLabel,{mode,t2,grid,font,fontPx:th.font||13});
  if (extra){ delete extra.labelsOf; Object.assign(extra.options,{responsive:false,animation:false,devicePixelRatio:2}); extra.plugins=[bg,...(extra.plugins||[])]; ch=new Chart(cv,extra); ch.update('none'); const url=cv.toDataURL('image/jpeg',0.93); ch.destroy(); wrap.remove(); return url; }
  if (spec.type==='pie'){
    const cfg=pieConfig(res,{dark:mode==='dark',surf:bgc,t2,fontSize:(th.font||13)+2}); delete cfg.pc;
    Object.assign(cfg.options,{responsive:false,animation:false,devicePixelRatio:2,layout:{padding:16}});
    cfg.options.plugins.tooltip={enabled:false}; cfg.plugins=[bg];
    ch=new Chart(cv,cfg);
  } else {
    const fc=line&&spec.forecast?forecastOf(res):null;
    const sets=[line
      ?{label:yLabel||'Valor',data:fc?[...res.values,...Array(fc.labels.length-res.values.length).fill(null)]:res.values,backgroundColor:withAlpha(ACCENT[mode],.14),borderColor:ACCENT[mode],borderWidth:2.5,pointRadius:res.labels.length>40?0:3.5,pointBackgroundColor:seriesColor(spec,mode),tension:.3,fill:true}
      :{data:res.values,backgroundColor:barColors(res,mode),borderWidth:0,borderRadius:5,borderSkipped:'start',maxBarThickness:46}];
    if (fc) sets.push({label:'Tendência (estimativa)',data:fc.trend,borderColor:t2,backgroundColor:t2,borderDash:[7,6],borderWidth:2,pointRadius:0,fill:false,tension:0,spanGaps:true});
    ch=new Chart(cv,{
    type:line?'line':'bar',
    // mesmas cores do painel (versão para papel branco): cada categoria com sua cor; linha com a cor do gráfico
    data:{labels:fc?fc.labels:res.labels,datasets:sets},
    options:{indexAxis:horiz?'y':'x',responsive:false,animation:false,devicePixelRatio:2,layout:{padding:{top:12,right:horiz?40:12,left:4,bottom:4}},
      plugins:{legend:{display:!!fc,position:'top',align:'end',labels:{color:t2,font,usePointStyle:true,pointStyle:'line',boxWidth:26}},tooltip:{enabled:false}},scales:horiz?{x:valueAxis,y:catAxis}:{x:catAxis,y:valueAxis}},
    plugins:[bg,vl]
  }); }
  ch.update('none');
  const url=cv.toDataURL('image/jpeg',0.93);
  ch.destroy(); wrap.remove();
  return url;
}

async function exportChartsPdf(meta){ markStep('rep');
  if (!window.jspdf?.jsPDF||!window.Chart){ toast('Não foi possível carregar o gerador de PDF. Verifique sua conexão e recarregue a página.',true); return; }
  const specs=meta.charts||[];
  if (!specs.length||!S.rows){ toast('Esta base não tem gráficos para exportar.',true); return; }
  const t=toast('Gerando PDF…',false,60000);
  await new Promise(r=>setTimeout(r,30));
  let doc, filename;
  try{
    const f=S.vfilter, fl=[];
    if (f.col&&f.val!=='') fl.push(`${f.col} = ${f.val}`);
    if (f.from||f.to){ const dc=meta.columns.find(c=>c.type==='date'); fl.push(`${dc?dc.name:'Data'} ${f.from?'de '+fmtDate(f.from):''}${f.from&&f.to?' ':''}${f.to?'até '+fmtDate(f.to):''}`); }
    ({doc,filename}=buildReportPdf(meta,{specs,rows:vizRows(meta),prev:vizPrev(meta),goals:true,filterText:fl.length?`Filtros aplicados: ${fl.join('; ')}`:'Sem filtros: todos os registros da base foram considerados.'}));
  }catch(e){ console.error(e); t.remove(); toast('Não foi possível gerar o PDF.',true); return; }
  t.remove();
  await savePdf(doc,filename);
}
async function savePdf(doc,filename){
  if (downloads){
    try{ await downloads.save({filename,data:doc.output('blob')}); toast('PDF gerado.'); }
    catch(e){ if(e&&(e.code==='cancelled'||e.code==='declined')) return; try{ doc.save(filename); }catch(e2){ toast('Download não concluído.',true); } }
  } else { doc.save(filename); toast('PDF gerado.'); }
}
// monta o PDF (síncrono). o: {specs, rows (linhas da base já filtradas), filterText, kicker, title, kpis}
function buildReportPdf(meta,o){
  const specs=o.specs, rows=o.rows, vd=vizData(meta,rows);
  let doc, filename;
  {
    doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    const PW=210, PH=297, M=15, CW=PW-2*M, BOTTOM=PH-18;
    const T=pdfTxt, fill=c=>doc.setFillColor(...c), ink=c=>doc.setTextColor(...c), stroke=c=>doc.setDrawColor(...c);
    const font=(style,size)=>{ doc.setFont('helvetica',style); doc.setFontSize(size); };
    const fit=(s,w)=>{ const l=doc.splitTextToSize(T(s),w); return l.length>1?l[0].replace(/\s*\S{0,3}$/,'')+'...':(l[0]||''); };

    // Cabeçalho (cor e logo da marca, se configurados no perfil)
    const br=brand(), A=br.custom?hexRgb(br.color):PDFC.accent, AW=mixRgb(A,[255,255,255],0.9), onA=br.custom&&lum(br.color)>0.55?[17,17,17]:[255,255,255];
    fill(A); doc.rect(0,0,PW,36,'F');
    let HW=CW;
    if (br.logo){ const lf=logoFit(br,46,16), pw=lf.w+6, ph=lf.h+6, px=PW-M-pw, py=18-ph/2;
      fill([255,255,255]); doc.roundedRect(px,py,pw,ph,2,2,'F');
      try{ doc.addImage(br.logo,'PNG',px+3,py+3,lf.w,lf.h); }catch(e){ console.warn(e); }
      HW=CW-pw-6; }
    const pf=S.profile||{}, who=[profileName(),pf.role].filter(Boolean).join(' · '), org=[pf.department,pf.company].filter(Boolean).join(' · ');
    ink(onA); font('bold',8.5); doc.text(fit(`${br.name?br.name.toUpperCase()+'  ·  ':''}${o.kicker||'RELATÓRIO DE GRÁFICOS'}`,HW),M,12,{charSpace:0.6});
    font('bold',20); doc.text(fit(o.title||meta.name,HW),M,23);
    font('normal',9); doc.text(fit(`Gerado em ${fmtWhen(Date.now())} · Preparado por ${who}${org?' · '+org:''}`,HW),M,30);
    let y=46;
    ink(PDFC.t2); font('normal',9.5);
    doc.text(T(`${nf.format(rows.length)} registros analisados · ${meta.columns.length} colunas · arquivo ${meta.fileName||'-'}`),M,y); y+=5.5;
    doc.splitTextToSize(T(o.filterText||''),CW).forEach(l=>{ doc.text(l,M,y); y+=4.6; });
    y+=5;

    const section=label=>{ ink(PDFC.text); font('bold',12); doc.text(label,M,y); stroke(A); doc.setLineWidth(0.6); doc.line(M,y+2,M+12,y+2); y+=8; };

    // Indicadores (com variação em relação ao período anterior, quando houver)
    const kp=o.kpis===false?[]:computeKpis(meta,rows,o.prev), gap=4, kw=(CW-gap*2)/3, kh=21;
    if (kp.length) section('Indicadores');
    kp.forEach((k,i)=>{
      const x=M+(i%3)*(kw+gap), yy=y+Math.floor(i/3)*(kh+gap);
      fill(PDFC.soft); doc.roundedRect(x,yy,kw,kh,2,2,'F');
      fill(A); doc.rect(x,yy+4,0.9,kh-8,'F');
      ink(PDFC.t2); font('normal',7.5); doc.text(fit(k.lb,kw-8),x+4.5,yy+6);
      ink(PDFC.text); font('bold',k.small?10.5:14); doc.text(fit(k.vl,kw-8),x+4.5,yy+13.5);
      if (k.cmp){ ink(k.d.good==null?PDFC.t3:k.d.good?[8,128,96]:[200,40,50]); font('bold',6.8); doc.text(fit(k.cmp,kw-8),x+4.5,yy+18); }
      else if (k.sm){ ink(PDFC.t3); font('normal',6.8); doc.text(fit(k.sm,kw-8),x+4.5,yy+18); }
    });
    if (kp.length) y+=Math.ceil(kp.length/3)*(kh+gap)+6;
    if (o.prev&&kp.some(k=>k.cmp)){ y-=3; ink(PDFC.t3); font('normal',7.5); doc.text(T(`Variações comparadas com ${rangeTxt(o.prev.range)}.`),M,y); y+=6; }
    // Metas (só no relatório geral, que usa todos os dados)
    const goals=o.goals?(meta.goals||[]).map(g=>({g,s:goalStatus(meta,g)})).filter(x=>x.s):[];
    if (goals.length){
      section('Metas');
      goals.forEach(({g,s})=>{
        if (y+14>BOTTOM){ doc.addPage(); y=M+4; }
        const col=s.st==='ok'?[8,128,96]:s.st==='track'?A:s.st==='warn'?[176,112,0]:[200,40,50];
        ink(PDFC.text); font('bold',9.5); doc.text(fit(g.name,CW*0.55),M,y+3.5);

// meses inteiros -> os mesmos meses antes; mês ou ano até hoje -> mesmo trecho do mês/ano anterior;
// outros intervalos -> o mesmo número de dias imediatamente antes
function compareRange(from,to,now=new Date()){
  if (!from||!to||from>to) return null;
  const today=isoDay(now), a=pDate(from), b=pDate(to>today&&from<=today?today:to), oe=pDate(to);
  if (a.getDate()===1&&b.getDate()===monthEnd(b)){ const ms=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()+1;
    return {from:isoDay(new Date(a.getFullYear(),a.getMonth()-ms,1)),to:isoDay(new Date(a.getFullYear(),a.getMonth(),0))}; }
  if (a.getMonth()===0&&a.getDate()===1&&oe.getFullYear()===a.getFullYear()&&oe.getMonth()===11){ const y=a.getFullYear()-1;
    return {from:`${y}-01-01`,to:isoDay(new Date(y,b.getMonth(),Math.min(b.getDate(),new Date(y,b.getMonth()+1,0).getDate())))}; }
  if (a.getDate()===1&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()){ const pm=new Date(a.getFullYear(),a.getMonth()-1,1);
    return {from:isoDay(pm),to:isoDay(new Date(pm.getFullYear(),pm.getMonth(),Math.min(b.getDate(),monthEnd(pm))))}; }
  const days=Math.round((b-a)/864e5)+1, pb=new Date(a); pb.setDate(pb.getDate()-1); const pa=new Date(pb); pa.setDate(pa.getDate()-days+1);
  return {from:isoDay(pa),to:isoDay(pb)};
}

}

function deltaOf(cur,prev,name){

  if (prev===0) return cur===0?{pct:0,dir:0,txt:'igual',good:null}:null;

const GOAL_PER=[['month','Este mês'],['week','Esta semana'],['year','Este ano'],['all','Todo o período']];
function goalRange(p,now=new Date()){
  if (p==='week'){ const a=new Date(now); a.setDate(a.getDate()-((a.getDay()+6)%7)); const b=new Date(a); b.setDate(b.getDate()+6); return {from:isoDay(a),to:isoDay(b)}; }

function goalStatus(meta,g,rows=S.rows){

    else if (live){ st='track'; txt=`No ritmo para bater a meta: faltam ${fmtNum(t-v)}`; }

}

/* ----- Tendência (previsão simples por linha reta) ----- */
const keyLabel=(k,gran)=>gran==='y'?k:gran==='m'?`${MESES[+k.split('-')[1]-1]}/${k.slice(2,4)}`:fmtDate(k);
function forecastOf(res){
  if (!res||!res.keys||!['d','m','y'].includes(res.gran)) return null;
  const ks=res.keys, vs=res.values, now=new Date();
  const curKey=res.gran==='m'?isoDay(now).slice(0,7):res.gran==='y'?String(now.getFullYear()):isoDay(now);
  const partial=ks[ks.length-1]===curKey; // período atual ainda em andamento: fica fora do cálculo
  const fitN=vs.length-(partial?1:0); if(fitN<4) return null;
  const take=Math.min(fitN,res.gran==='d'?60:24), x0=fitN-take;
  let sx=0,sy=0,sxx=0,sxy=0; for(let i=x0;i<fitN;i++){ sx+=i; sy+=vs[i]; sxx+=i*i; sxy+=i*vs[i]; }

  const b=(take*sxy-sx*sy)/den, a=(sy-b*sx)/take;
  const next=k=>{ if(res.gran==='y') return String(+k+1); if(res.gran==='m'){ const [y,m]=k.split('-').map(Number); const d=new Date(y,m,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; } const d=pDate(k); d.setDate(d.getDate()+1); return isoDay(d); };

  const trend=keys.map((_,i)=>i<x0?null:(nonNeg?Math.max(0,a+b*i):a+b*i));
  return {keys,labels:keys.map(k=>keyLabel(k,res.gran)),trend,slope:b,partial,n:ks.length};
}

  const per={d:'dia',m:'mês',y:'ano'}[res.gran], rel=Math.abs(fc.slope)/(Math.max(...res.values.map(Math.abs))||1);
  const dir=rel<0.005?'estável':`${fc.slope>0?'alta':'queda'} de cerca de ${fmtNum(Math.abs(fc.slope))} por ${per}`;
  return `Tendência: ${dir}. Se o ritmo continuar, ${fc.labels[fc.labels.length-1]} deve ficar perto de ${fmtNum(fc.trend[fc.trend.length-1])}.${fc.partial?` O último ${per} ainda está em andamento e não entrou no cálculo.`:''} É uma estimativa simples, não uma garantia.`;
}

function newToken(){ const a=new Uint8Array(18); crypto.getRandomValues(a); return [...a].map(b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join(''); }
const shareSig={}; let shareTimer=null;
function scheduleShare(meta){
  if (!meta||!meta.share||!meta.share.token||S.mode!=='cloud') return;
  clearTimeout(shareTimer);
  shareTimer=setTimeout(()=>{ const m=currentMeta(); if(m&&m.id===meta.id&&m.share&&S.rows&&!S.dirty) publishShare(m,S.rows).catch(e=>console.error(e)); },2500);
}
async function publishShare(meta,rows){
  const tok=meta.share.token, vd=vizData(meta,rows), pf=S.profile||{}, br=brand();
  const data=JSON.parse(JSON.stringify({owner:S.uid,baseId:meta.id,name:meta.name,fileName:meta.fileName||'',
    columns:vd.vmeta.columns.map(c=>({name:c.name,type:c.type})),charts:meta.charts||[],goals:meta.goals||[],rowCount:vd.rows.length,tv:meta.tv||null,
    // base do Google Sheets sem colunas de outras bases: a TV pode reler a planilha sozinha
    source:meta.source&&meta.source.type==='gsheet'&&vd.vmeta.columns.length===meta.columns.length?{type:'gsheet',id:meta.source.id,gid:meta.source.gid}:null,
    by:{name:profileName(),role:pf.role||'',company:pf.company||'',brand:{name:br.name,color:br.custom?br.color:'',logo:br.logo,lw:br.lw,lh:br.lh}}}));
  const json=JSON.stringify(vd.rows), sig=JSON.stringify(data).length+':'+hashStr(JSON.stringify(data))+':'+json.length+':'+hashStr(json);
  if (shareSig[tok]===sig) return; // nada mudou desde a última publicação
  const chunks=chunkRows(vd.rows), ref=shareRef(tok);
  const prev=await ref.get().catch(()=>null), old=prev&&prev.exists?(prev.data().chunkCount||0):0;
  // o documento principal é gravado por último: quem acompanha ao vivo (TV) só recarrega com os blocos já prontos
  if (!prev||!prev.exists) await ref.set({...data,chunkCount:0,updatedAt:0}); // as regras exigem o dono antes dos blocos
  for (let i=0;i<chunks.length;i++) await retry(()=>ref.collection('chunks').doc(cid(i)).set({json:JSON.stringify(chunks[i])}));
  await ref.set({...data,chunkCount:chunks.length,updatedAt:Date.now()});
  for (let i=chunks.length;i<old;i++) await retry(()=>ref.collection('chunks').doc(cid(i)).delete());
  shareSig[tok]=sig;
}
async function unpublishShare(tok){
  const ref=shareRef(tok), d=await ref.get(); if(!d.exists) return;
  for (let i=0;i<(d.data().chunkCount||0);i++) await retry(()=>ref.collection('chunks').doc(cid(i)).delete());
  await ref.delete(); delete shareSig[tok];
}

async function loadShareData(tok){
  const ref=shareRef(tok), d=await ref.get(); if(!d.exists) throw new Error('not-found');
  const x=d.data(), snap=await ref.collection('chunks').get();
  const docs=snap.docs.filter(c=>parseInt(c.id,10)<(x.chunkCount||0)).sort((a,b)=>a.id<b.id?-1:1);
  const rows=[]; for (const c of docs) for (const r of JSON.parse(c.data().json||'[]')) rows.push(r);
  return {x,rows};
}
function applyShare(x,rows){
  const meta={id:'share',name:x.name,fileName:x.fileName,columns:x.columns||[],charts:x.charts||[],goals:x.goals||[],tv:x.tv||null,source:x.source||null,updatedAt:x.updatedAt,rowCount:rows.length};
  Object.assign(S,{bases:[meta],currentId:'share',rows,basesLoaded:true});
  S.share={...S.share,by:x.by||{},stamp:x.updatedAt,loading:false,error:false};
  S.profile={name:x.by?.name||'',role:x.by?.role||'',company:x.by?.company||'',brand:x.by?.brand||{}};
  S.tvAt=Date.now(); document.title=`${x.name} · painel compartilhado`;
}

async function pollShareSheet(){

  try{
    const tb=await fetchSheetTable(m.source), map=m.columns.map(c=>tb.columns.findIndex(x=>x.name===c.name));

    const rows=tb.rows.map(r=>map.map((j,k)=>tb.columns[j].type===m.columns[k].type?r[j]:convert(r[j],m.columns[k].type)));
    if (JSON.stringify(rows)!==JSON.stringify(S.rows)){ S.rows=rows; S.tvAt=Date.now(); render(); }
  }catch(e){ console.warn(e); }
}

function parseSheetUrl(u){ const m=/\/spreadsheets\/d\/([a-zA-Z0-9_-]{20,})/.exec(String(u||'')); if(!m) return null; const g=/[#&?]gid=(\d+)/.exec(u); return {id:m[1],gid:g?g[1]:'0'}; }
async function fetchSheetTable(src){
  const urls=[`https://docs.google.com/spreadsheets/d/${src.id}/export?format=csv&gid=${src.gid}`,`https://docs.google.com/spreadsheets/d/${src.id}/gviz/tq?tqx=out:csv&gid=${src.gid}`];
  for (const u of urls){
    try{ const r=await fetch(u,{cache:'no-store'}); if(!r.ok) continue; const txt=await r.text(); if(/^\s*<(!doctype|html)/i.test(txt)) continue;
      const t=(await readWorkbook(new File([txt],'planilha.csv',{type:'text/csv'})))[0]; if(t) return t; }catch(e){ console.warn(e); }
  }
  const e=new Error('sheet'); e.code='sheet'; throw e;
}

const syncing=new Set();
async function syncSheet(meta,silent){
  const src=meta&&meta.source; if(!src||src.type!=='gsheet'||S.readOnly||syncing.has(meta.id)) return;
  if (S.dirty){ if(!silent) toast('Salve ou descarte suas edições antes de sincronizar.',true); return; }
  syncing.add(meta.id); const t=silent?null:toast('Buscando dados no Google Sheets…',false,60000);
  try{
    const tb=autoClean(await fetchSheetTable(src));
    if (S.currentId!==meta.id||S.dirty||!S.rows) return;
    const m=structuredClone(currentMeta()), old=new Map(m.columns.map(c=>[c.name,c.type])); // mantém os tipos que a pessoa ajustou
    const cols=keepCalcs(m.columns,tb.columns.map(c=>({name:c.name,type:old.get(c.name)||c.type})));
    const rows=applyCalcs({columns:cols},tb.rows.map(r=>r.map((v,j)=>cols[j].type!==tb.columns[j].type?convert(v,cols[j].type):v)));
    if (JSON.stringify(rows)===JSON.stringify(S.rows)&&JSON.stringify(cols)===JSON.stringify(m.columns)){ if(!silent) toast('Tudo certo: a base já está igual ao Google Sheets.'); return; }
    m.columns=cols; m.source={...src,syncedAt:Date.now()};
    const names=new Set(cols.map(c=>c.name)); m.charts=(m.charts||[]).filter(c=>(!c.x||names.has(c.x))&&(!c.y||names.has(c.y))); if(!m.charts.length) m.charts=autoCharts(cols,rows);
    await saveBase(m,rows,'Antes da sincronização com o Google Sheets'); S.rows=rows; render();
    toast(`Dados atualizados com o Google Sheets (${nf.format(rows.length)} linhas).`);
  }catch(e){ console.error(e); if(!silent) toast(e.code==='sheet'?'Não foi possível ler a planilha. Confira se ela continua compartilhada como “Qualquer pessoa com o link”.':'Não foi possível sincronizar agora.',true,7000); }
  finally{ syncing.delete(meta.id); if(t) t.remove(); }
}

function categorize(desc){
  const s=' '+fold(desc).replace(/[^a-z0-9]+/g,' ').trim()+' ';
  if (s.trim()==='') return null;
  for (const [cat,kws] of CAT_RULES) if (kws.some(k=>s.includes(k))) return cat;
  return 'Outros';
}
const DESC_RX=/descri|hist[oó]rico|estabelecimento|lan[cç]amento|detalhe|memo|favorecido|benefici|origem|destino|nome|identifica/i;
function descColumn(columns,rows){
  const c=columns.map((c,j)=>({c,j})).filter(({c,j})=>c.type==='text'&&!/^(movimento|categoria)$/i.test(c.name)&&!isTimeCol(rows,j));
  return (c.find(o=>/descri|hist[oó]rico|estabelecimento|lan[cç]amento/i.test(o.c.name))||c.find(o=>DESC_RX.test(o.c.name))||c.sort((a,b)=>distinctCount(rows,b.j,500)-distinctCount(rows,a.j,500))[0])?.j??-1;
}
// extratos lidos de PDF/imagem: cria a coluna "Categoria" quando dá para reconhecer boa parte dos lançamentos
function categorizeTable(t){
  if (t.columns.some(c=>/^categoria$/i.test(c.name))) return;
  const j=descColumn(t.columns,t.rows); if(j<0) return;
  const cats=t.rows.map(r=>categorize(r[j])), known=cats.filter(c=>c&&c!=='Outros').length;
  if (t.rows.length<3||known<t.rows.length*0.25) return;
  t.columns.splice(j+1,0,{name:'Categoria',type:'text'});
  t.rows=t.rows.map((r,i)=>{ const a=r.slice(); a.splice(j+1,0,cats[i]); return a; });
}

  const sel=el('select',{},texts.map(({c,j})=>el('option',{value:String(j),text:c.name}))); sel.value=String(dj>=0?dj:texts[0].j);
  const existing=meta.columns.findIndex(c=>/^categoria$/i.test(c.name));
  const prev=el('div',{class:'cat-prev'}), err=el('div',{class:'form-err'});
  let cats=[];
  const draw=()=>{
    const j=+sel.value; cats=S.rows.map(r=>categorize(r[j])); prev.innerHTML='';
    const g=new Map(); cats.forEach((c,i)=>{ if(!c) return; let o=g.get(c); if(!o){ o={n:0,ex:[]}; g.set(c,o); } o.n++; const ex=String(S.rows[i][j]??'').slice(0,40); if(o.ex.length<3&&ex&&!o.ex.includes(ex)) o.ex.push(ex); });
    const list=[...g.entries()].sort((a,b)=>(a[0]==='Outros')-(b[0]==='Outros')||b[1].n-a[1].n);

/* ----- Limpeza de dados ----- */
const blankCell=v=>v==null||(typeof v==='string'&&v.trim()==='');
const tidy=s=>s.trim().replace(/\s+/g,' ');
function cleanScan(meta,rows){
  const out={empty:0,trim:0,dup:0,variants:[],types:[]};
  for (const r of rows){ if(r.every(blankCell)) out.empty++; for(const v of r) if(typeof v==='string'&&v!==tidy(v)) out.trim++; }
  const seen=new Set(); for (const r of rows){ if(r.every(blankCell)) continue; const k=JSON.stringify(r.map(v=>typeof v==='string'?tidy(v):v)); if(seen.has(k)) out.dup++; else seen.add(k); }
  meta.columns.forEach((c,j)=>{
    if (c.type!=='text'||c.virtual||c.calc) return;
    const groups=new Map();
    for (const r of rows){ const v=r[j]; if(typeof v!=='string'||!v.trim()) continue; const s=tidy(v), k=fold(s); let g=groups.get(k); if(!g){ g=new Map(); groups.set(k,g); } g.set(s,(g.get(s)||0)+1); if(groups.size>3000) return; }
    for (const g of groups.values()) if (g.size>1){
      const best=[...g.entries()].sort((a,b)=>b[1]-a[1]||(/^[A-ZÀ-Ý]/.test(b[0])-/^[A-ZÀ-Ý]/.test(a[0])))[0][0];
      let n=0; for (const [s,k] of g) if(s!==best) n+=k;
      out.variants.push({j,col:c.name,best,others:[...g.keys()].filter(s=>s!==best),n});
    }
    if (!/(pedido|n[uú]mero|c[oó]d|sku|^ref|nota|matr[ií]cula|^id\b)/i.test(c.name)){ const t=detectType(c.name,rows.map(r=>r[j])); if(t!=='text') out.types.push({j,col:c.name,type:t}); }
  });
  return out;
}

    return el('label',{class:'ck-row clean-row'+(n?'':' off')},ck,el('span',{},el('b',{text:title}),el('small',{text:n?desc:'Nada encontrado.'}),n&&extra?extra:null),el('span',{class:'clean-n',text:n?nf.format(n):'0'})); };
  const vEx=sc.variants.slice(0,4).map(v=>el('div',{class:'clean-ex',text:`${v.col}: ${v.others.slice(0,2).map(s=>`“${s}”`).join(', ')} → “${v.best}”`}));

      rows=rows.map(r=>r.map((v,j)=>typeof v==='string'&&map.has(j+'|'+tidy(v))?map.get(j+'|'+tidy(v)):v)); done.push('grafias'); }

    catch(e){ t.remove(); handleWriteError(e); return false; }
  },'clean-modal');

/* ----- Higienização automática na importação -----
   Corrige o que atrapalha análises sem mudar o sentido dos dados: espaços, marcadores de vazio (“-”, “N/A”,
   “#REF!”), cabeçalhos repetidos no meio da tabela, linhas de total/subtotal (somariam em dobro), linhas e
   colunas vazias, números e datas guardados como texto e o mesmo valor escrito de jeitos diferentes.
   Linhas idênticas só são removidas quando há uma coluna de identificação (pedido, código, nota…);
   sem ela podem ser registros repetidos de verdade, então só avisamos. */
const PLACEHOLDER_RX=/^(-+|—|–|\.+|n\/?a|n\/?d|#n\/?[ad]|#ref!?|#value!?|#valor!?|#div\/0!?|#name\?|#nome\?|null|nulo|none|nan|undefined|sem informa[cç][aã]o|n[aã]o informado|\?+)$/i;
const TOTAL_ROW_RX=/^(sub-?total|total|total geral|totais|soma|somat[oó]rio|grand total)\s*:?$/i;
const ID_COL_RX=/(^id\b|^id[_\s]|pedido|c[oó]d|n[uú]mero|nota fiscal|^nf\b|protocolo|transa[cç][aã]o|^n[ºo°.]\s)/i;
function autoClean(t){
  let cols=t.columns.map(c=>({...c,name:String(c.name).replace(/\s+/g,' ').trim()||c.name})), rows=t.rows.map(r=>r.slice());
  const log=[], L=(n,one,many)=>{ if(n) log.push((n===1?one:many).replace('{n}',nf.format(n))); };
  // 1. espaços sobrando e marcadores de vazio
  let sp=0, ph=0;
  rows=rows.map(r=>r.map(v=>{ if(typeof v!=='string') return v; const s=tidy(v); if(s!==v) sp++; if(s==='') return null; if(PLACEHOLDER_RX.test(s)){ ph++; return null; } return s; }));
  L(sp,'1 célula com espaços sobrando foi ajustada','{n} células com espaços sobrando foram ajustadas');
  L(ph,'1 marcador de vazio (como “-” ou “N/A”) virou célula vazia','{n} marcadores de vazio (como “-”, “N/A” ou “#REF!”) viraram células vazias');
  // 2. cabeçalho repetido no meio dos dados (tabelas coladas uma embaixo da outra)
  const hk=cols.map(c=>fold(c.name)); let hdr=0;
  rows=rows.filter(r=>{ let m=0,n=0; r.forEach((v,j)=>{ if(v!=null){ n++; if(fold(String(v))===hk[j]) m++; } }); if(n&&m>=Math.max(2,n*0.6)){ hdr++; return false; } return true; });
  L(hdr,'1 linha de cabeçalho repetida no meio dos dados foi removida','{n} linhas de cabeçalho repetidas no meio dos dados foram removidas');
  // 3. linhas de total/subtotal: só texto “Total” (e no máximo mais um texto) junto de números
  let tot=0;
  rows=rows.filter(r=>{ const txt=r.filter(v=>typeof v==='string'); if(txt.length&&txt.length<=2&&txt.some(v=>TOTAL_ROW_RX.test(v))&&r.some(v=>typeof v==='number')){ tot++; return false; } return true; });
  L(tot,'1 linha de total/subtotal foi removida (ela somaria os valores em dobro)','{n} linhas de total/subtotal foram removidas (elas somariam os valores em dobro)');
  // 4. linhas e colunas vazias
  const before=rows.length; rows=rows.filter(r=>!r.every(blankCell));
  L(before-rows.length,'1 linha vazia foi removida','{n} linhas vazias foram removidas');
  const keep=cols.map((c,j)=>rows.some(r=>!blankCell(r[j]))), ec=keep.filter(k=>!k).length;
  if (ec&&ec<cols.length){ const gone=cols.filter((_,j)=>!keep[j]).map(c=>c.name); cols=cols.filter((_,j)=>keep[j]); rows=rows.map(r=>r.filter((_,j)=>keep[j]));
    log.push(`${ec===1?'A coluna vazia':'As colunas vazias'} ${gone.map(n=>`“${n}”`).join(', ')} ${ec===1?'foi removida':'foram removidas'}`); }
  // 5. números e datas guardados como texto
  const fixed=[];
  cols.forEach((c,j)=>{ if(c.type!=='text'||/(pedido|n[uú]mero|c[oó]d|sku|^ref|nota|matr[ií]cula|^id\b|cpf|cnpj|cep|telefone|celular)/i.test(c.name)) return;
    const nt=detectType(c.name,rows.map(r=>r[j])); if(nt==='text') return;
    c.type=nt; for(const r of rows) r[j]=convert(r[j],nt); fixed.push(`“${c.name}” (${nt==='number'?'número':'data'})`); });
  if (fixed.length) log.push(`${fixed.length===1?'Coluna lida como texto passou':'Colunas lidas como texto passaram'} a ser tratada${fixed.length===1?'':'s'} pelo tipo certo: ${fixed.join(', ')}`);
  // 6. mesmo valor escrito de jeitos diferentes (maiúsculas, acentos, espaços)
  const sc=cleanScan({columns:cols},rows);
  if (sc.variants.length){ const map=new Map(); for(const v of sc.variants) for(const o of v.others) map.set(v.j+'|'+o,v.best);
    let n=0; rows=rows.map(r=>r.map((v,j)=>{ if(typeof v==='string'&&map.has(j+'|'+v)){ n++; return map.get(j+'|'+v); } return v; }));
    const ex=sc.variants.slice(0,2).map(v=>`“${v.others[0]}” → “${v.best}”`).join(', ');
    L(n,`1 valor escrito de outro jeito foi padronizado (${ex})`,`{n} valores escritos de jeitos diferentes foram padronizados (ex.: ${ex})`); }
  // 6b. CPF/CNPJ com dígito verificador errado (só avisa; não altera)
  cols.forEach((c,j)=>{ const cn=/cnpj/i.test(c.name), cp=/\bcpf\b/i.test(c.name); if(!cn&&!cp) return;
    let bad=0; for(const r of rows){ const v=r[j]; if(v==null||v==='') continue; const d=onlyDigits(v);
      const ok=cn&&cp?(d.length<=11?cpfOk(d.padStart(11,'0')):cnpjOk(d.padStart(14,'0'))):cn?cnpjOk(d.padStart(14,'0')):cpfOk(d.padStart(11,'0')); if(!ok) bad++; }
    if (bad) log.push(`${nf.format(bad)} ${bad===1?'valor':'valores'} da coluna “${c.name}” ${bad===1?'tem':'têm'} número inválido (o dígito verificador não confere): vale conferir na tabela`); });
  // 7. linhas idênticas
  const seen=new Set(); let dup=0; const idj=cols.findIndex(c=>ID_COL_RX.test(c.name));
  const out=[]; for(const r of rows){ const k=JSON.stringify(r); if(seen.has(k)){ dup++; if(idj>=0) continue; } else seen.add(k); out.push(r); }
  let dupLeft=0;
  if (dup&&idj>=0){ rows=out; L(dup,`1 linha duplicada (mesmo “${cols[idj].name}” e mesmos valores) foi removida`,`{n} linhas duplicadas (mesmo “${cols[idj].name}” e mesmos valores) foram removidas`); }
  else dupLeft=dup;
  return {...t,columns:cols,rows,cleanLog:log,dupLeft};
}
const cleanInfo=t=>t.cleanLog&&(t.cleanLog.length||t.dupLeft)?{at:Date.now(),items:t.cleanLog,dup:t.dupLeft||0}:null;

  const c=meta.cleanLog; if(!c) return null;
  const box=el('details',{class:'clean-note'},

      el('span',{class:'muted',text:` · ${c.items.length} ${c.items.length===1?'ajuste':'ajustes'}${c.dup?` · ${c.dup} ${c.dup===1?'linha repetida':'linhas repetidas'} para conferir`:''}`})),

  return box;
}

/* ----- Consultas (CNPJ e CEP) e enriquecimento de bases -----
   Dados públicos da Receita Federal (CNPJ) e dos Correios (CEP), consultados direto do navegador em APIs
   abertas: BrasilAPI (principal), publica.cnpj.ws e ViaCEP (reserva). Sem custo e sem servidor.
   Dados de pessoas físicas (CPF), score de crédito e placas não são consultados: exigem fornecedores pagos
   autorizados e base legal (LGPD). Para CPF o site só confere se o número é válido. */
const onlyDigits=s=>String(s??'').replace(/\D/g,'');

function cnpjOk(c){ c=onlyDigits(c); if(c.length!==14||/^(\d)\1+$/.test(c)) return false;
  const dv=n=>{ let s=0,p=n-7; for(let i=0;i<n;i++){ s+=+c[i]*p--; if(p<2) p=9; } const r=s%11; return r<2?0:11-r; };
  return dv(12)===+c[12]&&dv(13)===+c[13]; }
function cpfOk(c){ c=onlyDigits(c); if(c.length!==11||/^(\d)\1+$/.test(c)) return false;
  for (const n of [9,10]){ let s=0; for(let i=0;i<n;i++) s+=+c[i]*(n+1-i); if((s*10)%11%10!==+c[n]) return false; } return true; }

async function getJson(u){
  const r=await fetch(u,{headers:{Accept:'application/json'}});
  if (r.status===404||r.status===400) return null;
  if (!r.ok){ const e=new Error('http '+r.status); e.retry=r.status===429||r.status>=500; throw e; }
  return r.json();
}
function cnpjFromBrasil(j){

const cnpjCache=new Map(), cepCache=new Map();
// {notFound} quando a Receita não tem o CNPJ; {error} quando nenhum serviço respondeu (tentar mais tarde)
async function getCnpj(raw){
  const c=onlyDigits(raw).padStart(14,'0');
  if (!cnpjOk(c)) return {invalid:true};
  if (cnpjCache.has(c)) return cnpjCache.get(c);
  let out=null;
  for (let a=0;a<3&&!out;a++){
    try{ const j=await getJson(`https://brasilapi.com.br/api/cnpj/v1/${c}`); out=j?cnpjFromBrasil(j):{notFound:true}; }
    catch(e){ if(!e.retry&&a>0) break; await sleep(1500*(a+1)); }
  }
  if (!out||out.notFound){ try{ const j=await getJson(`https://publica.cnpj.ws/cnpj/${c}`); if(j) out=cnpjFromWs(j); else out=out||{notFound:true}; }catch(e){ out=out||{error:true}; } }

  return out;
}
async function getCep(raw){
  const c=onlyDigits(raw).padStart(8,'0');
  if (c.length!==8||/^0+$/.test(c)) return {invalid:true};
  if (cepCache.has(c)) return cepCache.get(c);
  let out=null;
  try{ const j=await getJson(`https://brasilapi.com.br/api/cep/v2/${c}`); if(j) out={cep:c,logradouro:j.street||'',bairro:j.neighborhood||'',cidade:j.city||'',uf:j.state||'',ibge:j.ibge?.city||''}; }catch(e){}
  if (!out){ try{ const j=await getJson(`https://viacep.com.br/ws/${c}/json/`); out=j&&!j.erro?{cep:c,logradouro:j.logradouro||'',bairro:j.bairro||'',cidade:j.localidade||'',uf:j.uf||'',ibge:j.ibge||''}:{notFound:true}; }catch(e){ out={error:true}; } }
  if (!out.error) cepCache.set(c,out);
  return out;

/* ----- Consulta SQL sobre todas as bases -----
   SQLite de verdade rodando no navegador (sql.js / WebAssembly). Cada base vira uma tabela num banco em
   memória: as consultas trabalham numa cópia e nunca alteram as bases. O banco é recriado sozinho quando
   alguma base muda. Consultas salvas ficam na conta (data/users/{uid}/app → queries). */
let sqlLib=null;
const SQLJS='https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/';
function getSqlJs(){ return sqlLib||(sqlLib=loadScript(SQLJS+'sql-wasm.js').then(()=>window.initSqlJs({locateFile:f=>SQLJS+f})).catch(e=>{ sqlLib=null; throw e; })); }
const sqlSlug=s=>fold(s).replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').replace(/^(\d)/,'t_$1')||'tabela';
const sqlQ=s=>'"'+String(s).replace(/"/g,'""')+'"';
const SQ=()=>S.sql||(S.sql={db:null,sig:'',tables:[],text:'',res:null,err:'',busy:false,status:''});
async function ensureSqlDb(progress){
  const st=SQ(), sig=S.bases.map(b=>b.id+':'+b.updatedAt).join('|');
  if (st.db&&st.sig===sig) return st.db;
  progress&&progress('Carregando o motor SQL…');
  const SQL=await getSqlJs();
  const db=new SQL.Database(), tables=[], used=new Set();
  for (const [i,b] of S.bases.entries()){
    progress&&progress(`Carregando “${b.name}” (${i+1} de ${S.bases.length})…`);
    const rows=await getRows(b.id); let name=sqlSlug(b.name); while(used.has(name)) name+='_2'; used.add(name);
    const cols=b.columns.map((c,j)=>({name:c.name,type:c.type,j})).filter(c=>!b.columns[c.j].virtual);
    if (!cols.length) continue;
    db.run(`CREATE TABLE ${sqlQ(name)} (${cols.map(c=>`${sqlQ(c.name)} ${c.type==='number'?'REAL':'TEXT'}`).join(', ')})`);
    const ins=db.prepare(`INSERT INTO ${sqlQ(name)} VALUES (${cols.map(()=>'?').join(',')})`);
    db.run('BEGIN'); for (const r of rows) ins.run(cols.map(c=>{ const v=r[c.j]; return v==null||v===''?null:typeof v==='number'?v:String(v); })); db.run('COMMIT'); ins.free();
    tables.push({name,baseId:b.id,baseName:b.name,cols,count:rows.length});
  }
  if (st.db){ try{ st.db.close(); }catch(e){} }
  Object.assign(st,{db,sig,tables}); return db;
}
function sqlExamples(){
  const st=SQ(), out=[], t=st.tables[0]; if(!t) return out;
  out.push({name:'Ver as primeiras linhas',sql:`SELECT *\nFROM ${t.name}\nLIMIT 100;`});
  const txt=t.cols.find(c=>c.type==='text'&&!CODE_RX.test(c.name)), num=t.cols.find(c=>c.type==='number'&&MEAS_RX.test(c.name))||t.cols.find(c=>c.type==='number'), dt=t.cols.find(c=>c.type==='date');
  if (txt) out.push({name:`Total por ${txt.name}`,sql:`SELECT ${sqlQ(txt.name)},\n       COUNT(*) AS registros${num?`,\n       ROUND(SUM(${sqlQ(num.name)}), 2) AS total,\n       ROUND(AVG(${sqlQ(num.name)}), 2) AS media`:''}\nFROM ${t.name}\nGROUP BY ${sqlQ(txt.name)}\nORDER BY ${num?'total':'registros'} DESC;`});

// mensagens do SQLite em português, com a dica mais provável
function sqlErrPt(msg){
  const m=String(msg||'');
  let x;
  if ((x=m.match(/no such table: (\S+)/))) return `A tabela ${x[1]} não existe. Veja os nomes das tabelas na lista à esquerda (clique para inserir).`;
  if ((x=m.match(/no such column: (.+)/))) return `A coluna ${x[1]} não existe. Nomes com espaço ou acento precisam de aspas duplas, por exemplo "Valor total".`;
  if (/syntax error/.test(m)) return `Erro de sintaxe: ${m.replace(/^.*?:/,'').trim()}. Confira vírgulas, aspas e parênteses.`;
  if (/ambiguous column/.test(m)) return 'Coluna ambígua: ela existe em mais de uma tabela da junção. Use apelido.coluna, por exemplo a."Cliente".';
  if (/incomplete input/.test(m)) return 'A consulta está incompleta. Falta fechar aspas, parênteses ou terminar o comando.';
  return m;
}
async function runSql(text){
  const st=SQ(); text=String(text||'').trim(); if(!text) return;
  st.busy=true; st.err=''; st.status='Executando…'; render();
  try{
    const db=await ensureSqlDb(s=>{ st.status=s; const e=document.querySelector('.sql-status'); if(e) e.textContent=s; });
    const t0=performance.now(), rs=db.exec(text), ms=Math.round(performance.now()-t0);

}

/* ----- Colunas calculadas -----
   Fórmulas no estilo Excel em português: [Receita] - [Custo], SE([Valor]>100; "Alto"; "Baixo"), ARRED([x]/[y]*100; 1).
   A fórmula vira uma função JS montada só com peças conhecidas (números, textos, colunas, operadores e funções
   da lista), então não dá para executar código arbitrário. Os valores são gravados na base, e são recalculados
   sempre que a base é salva (edição, nova planilha, sincronização, limpeza). */
const numv=x=>typeof x==='number'?x:x==null||x===''?null:(isNaN(parseNum(x))?null:parseNum(x));
const dstr=x=>{ const s=x==null?'':String(x); return /^\d{4}-\d{2}-\d{2}/.test(s)?s.slice(0,10):null; };
const FX={
  SE:(c,a,b=null)=>c?a:b, IF:(c,a,b=null)=>c?a:b, E:(...a)=>a.every(Boolean), AND:(...a)=>a.every(Boolean), OU:(...a)=>a.some(Boolean), OR:(...a)=>a.some(Boolean), NAO:x=>!x, NOT:x=>!x,
  SEERRO:(x,alt)=>x==null||(typeof x==='number'&&!isFinite(x))?alt:x, IFERROR:(x,alt)=>x==null||(typeof x==='number'&&!isFinite(x))?alt:x,
  VAZIO:x=>x==null||x==='', ISBLANK:x=>x==null||x==='',
  ARRED:(x,n=0)=>{ x=numv(x); if(x==null) return null; const p=10**(numv(n)||0); return Math.round(x*p)/p; }, ROUND:(x,n=0)=>FX.ARRED(x,n),
  ABS:x=>{ x=numv(x); return x==null?null:Math.abs(x); }, MAXIMO:(...a)=>{ const v=a.map(numv).filter(x=>x!=null); return v.length?Math.max(...v):null; }, MINIMO:(...a)=>{ const v=a.map(numv).filter(x=>x!=null); return v.length?Math.min(...v):null; },
  MAX:(...a)=>FX.MAXIMO(...a), MIN:(...a)=>FX.MINIMO(...a), SOMA:(...a)=>a.map(numv).filter(x=>x!=null).reduce((s,x)=>s+x,0), SUM:(...a)=>FX.SOMA(...a),
  MEDIA:(...a)=>{ const v=a.map(numv).filter(x=>x!=null); return v.length?v.reduce((s,x)=>s+x,0)/v.length:null; },
  ANO:d=>{ d=dstr(d); return d?+d.slice(0,4):null; }, MES:d=>{ d=dstr(d); return d?+d.slice(5,7):null; }, DIA:d=>{ d=dstr(d); return d?+d.slice(8,10):null; },
  ANOMES:d=>{ d=dstr(d); return d?d.slice(0,7):null; }, TRIMESTRE:d=>{ d=dstr(d); return d?`${d.slice(0,4)}-T${Math.ceil(+d.slice(5,7)/3)}`:null; },
  DIASEMANA:d=>{ d=dstr(d); return d?['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][pDate(d).getDay()]:null; },
  HOJE:()=>isoDay(new Date()), DIAS:(fim,ini)=>{ fim=dstr(fim); ini=dstr(ini); return fim&&ini?Math.round((pDate(fim)-pDate(ini))/864e5):null; },
  SOMARDIAS:(d,n)=>{ d=dstr(d); n=numv(n); if(!d||n==null) return null; const x=pDate(d); x.setDate(x.getDate()+n); return isoDay(x); },
  TEXTO:x=>x==null?'':String(x), MAIUSCULA:x=>x==null?null:String(x).toUpperCase(), MINUSCULA:x=>x==null?null:String(x).toLowerCase(),
  ESQUERDA:(s,n=1)=>s==null?null:String(s).slice(0,numv(n)||0), DIREITA:(s,n=1)=>s==null?null:String(s).slice(-(numv(n)||0)), ARRUMAR:s=>s==null?null:tidy(String(s)),
  CONTEM:(s,t)=>s!=null&&fold(s).includes(fold(t)), CONCAT:(...a)=>a.map(x=>x==null?'':String(x)).join(''), VALOR:x=>numv(x), NUM:x=>numv(x)};
const FX_HELP=[['SE(condição; se sim; se não)','SE([Valor]>1000; "Grande"; "Pequeno")'],['ARRED(número; casas)','ARRED([Lucro]/[Receita]*100; 1)'],['SEERRO(valor; alternativa)','SEERRO([A]/[B]; 0)'],
  ['ANO, MES, DIA, ANOMES, TRIMESTRE, DIASEMANA (data)','ANOMES([Data])'],['DIAS(fim; início)','DIAS(HOJE(); [Data de abertura])'],['SOMARDIAS(data; n)','SOMARDIAS([Data]; 30)'],
  ['E, OU, NAO, VAZIO, CONTEM','SE(CONTEM([Descrição]; "pix"); "Pix"; "Outro")'],['MAIUSCULA, MINUSCULA, ESQUERDA, DIREITA, ARRUMAR','ESQUERDA([CEP]; 5)'],['Juntar textos com &','[Cidade] & "/" & [UF]']];
function compileFormula(src,columns,selfName){
  const toks=[], re=/\s+|(\d+(?:[.,]\d+)?)|("(?:[^"]|"")*"|'(?:[^']|'')*')|\[([^\]]+)\]|([A-Za-zÀ-ÿ_][A-Za-zÀ-ÿ0-9_]*)|(<=|>=|<>|!=|==|[=<>+\-*/^&(),;%])/gy;

  re.lastIndex=0;
  while (pos<src.length){
    re.lastIndex=pos; m=re.exec(src); if(!m||m.index!==pos) throw new Error(`Não entendi o trecho “${src.slice(pos,pos+12)}”`);
    pos=re.lastIndex;
    if (m[1]) js+=m[1].replace(',','.');
    else if (m[2]) js+=JSON.stringify(m[2].slice(1,-1).replace(m[2][0]==='"'?/""/g:/''/g,m[2][0]));
    else if (m[3]){ const name=m[3].trim(); if(selfName&&fold(name)===fold(selfName)) throw new Error('A fórmula não pode usar a própria coluna.');
      const j=columns.findIndex(c=>fold(c.name)===fold(name)); if(j<0) throw new Error(`A coluna [${name}] não existe nesta base.`); js+=`v[${j}]`; }
    else if (m[4]){ const id=fold(m[4]).toUpperCase().replace(/[^A-Z0-9_]/g,'');
      if (id==='VERDADEIRO'||id==='TRUE') js+='true'; else if(id==='FALSO'||id==='FALSE') js+='false';
      else if (FX[id]) js+=`F.${id}`; else throw new Error(`Função ${m[4]} não existe. Veja a lista de funções.`); }
    else if (m[5]){ const o=m[5];
      js+=o==='='||o==='=='?'==':o==='<>'||o==='!='?'!=':o==='^'?'**':o===';'||o===','?',':o==='&'?'+""+':o==='%'?'/100':o;
      if (o==='(') depth++; if (o===')'){ depth--; if(depth<0) throw new Error('Há um parêntese fechando a mais.'); } }
  }
  if (depth>0) throw new Error('Falta fechar um parêntese.');
  if (!js.trim()) throw new Error('Escreva uma fórmula.');
  let fn; try{ fn=new Function('v','F',`"use strict"; return (${js});`); }catch(e){ throw new Error('A fórmula está incompleta ou com operador sobrando.'); }

/* ----- Alertas automáticos (anomalias) -----
   Sem precisar criar metas: compara o último dia e o último mês com o histórico da própria base, aponta a
   categoria que mais mudou e registros com valor muito fora do padrão. Só fala quando a diferença é grande. */
function mainMeasure(meta){
  const nums=meta.columns.filter(c=>c.type==='number'&&!c.virtual&&!CODE_RX.test(c.name)&&!AVG_RX.test(c.name)&&!/saldo|(pedido|n[uú]mero|c[oó]d|nota|matr[ií]cula|^ano$)/i.test(c.name));
  return nums.find(c=>/valor|total|receita|fatur|venda|custo|despesa|lucro|montante|quantia|amount|pago|recebido/i.test(c.name))||nums.find(c=>MEAS_RX.test(c.name))||nums[0]||null;
}
function detectAnomalies(meta,rows){
  const out=[], dj=meta.columns.findIndex(c=>c.type==='date'); if(dj<0||rows.length<20) return out;
  const yc=mainMeasure(meta), yj=yc?meta.columns.indexOf(yc):-1, what=yc?yc.name:'registros';
  const val=r=>yj<0?1:(typeof r[yj]==='number'?r[yj]:0);
  const fmtV=v=>yj<0?`${nf.format(v)} registros`:fmtNum(v);
  const today=isoDay(new Date()), byDay=new Map(), byMonth=new Map();
  for (const r of rows){ const d=dayOf(r[dj]); if(!d||d>today) continue; byDay.set(d,(byDay.get(d)||0)+val(r)); const m=d.slice(0,7); byMonth.set(m,(byMonth.get(m)||0)+val(r)); }
  const days=[...byDay.keys()].sort(); if(days.length<10) return out;
  // 1) último dia com dados x os 28 dias anteriores
  const last=days[days.length-1], ld=pDate(last), prev=[];
  for (let i=1;i<=28;i++){ const d=new Date(ld); d.setDate(d.getDate()-i); prev.push(byDay.get(isoDay(d))||0); }
  if (prev.filter(v=>v!==0).length>=20){
    const mean=prev.reduce((a,b)=>a+b,0)/prev.length, sd=Math.sqrt(prev.reduce((a,b)=>a+(b-mean)**2,0)/prev.length), v=byDay.get(last), z=sd?(v-mean)/sd:0, pc=mean?(v-mean)/Math.abs(mean)*100:0;
    if (Math.abs(z)>=2&&Math.abs(pc)>=30) out.push({dir:pc>0?'up':'down',title:`${what} em ${fmtDate(last)}: ${pc>0?'acima':'abaixo'} do normal`,
      text:`Foram ${fmtV(v)}, ${pct1(Math.abs(pc))} ${pc>0?'acima':'abaixo'} da média dos 28 dias anteriores (${fmtV(mean)} por dia).`});
  }
  // 2) último mês completo x média dos 6 anteriores; e o mês atual no ritmo de hoje
  const months=[...byMonth.keys()].sort(), cur=today.slice(0,7), done=months.filter(m=>m<cur);
  if (done.length>=4){ const lm=done[done.length-1], base=done.slice(-7,-1), avg=base.reduce((a,m)=>a+byMonth.get(m),0)/base.length, v=byMonth.get(lm), pc=avg?(v-avg)/Math.abs(avg)*100:0;
    if (Math.abs(pc)>=25) out.push({dir:pc>0?'up':'down',title:`${what} em ${keyLabel(lm,'m')}: ${pc>0?'mês forte':'mês fraco'}`,text:`Fechou em ${fmtV(v)}, ${pct1(Math.abs(pc))} ${pc>0?'acima':'abaixo'} da média dos ${base.length} meses anteriores (${fmtV(avg)}).`}); }
  if (byMonth.has(cur)&&done.length>=3){ const now=new Date(), frac=now.getDate()/monthEnd(now);
    if (frac>=0.25&&frac<1){ const base=done.slice(-6), avg=base.reduce((a,m)=>a+byMonth.get(m),0)/base.length, proj=byMonth.get(cur)/frac, pc=avg?(proj-avg)/Math.abs(avg)*100:0;
      if (Math.abs(pc)>=25) out.push({dir:pc>0?'up':'down',title:`Ritmo de ${keyLabel(cur,'m')}: ${pc>0?'acima':'abaixo'} do normal`,text:`No ritmo atual, o mês deve fechar perto de ${fmtV(proj)}, ${pct1(Math.abs(pc))} ${pc>0?'acima':'abaixo'} da média mensal (${fmtV(avg)}).`}); } }
  // 3) categoria que mais mudou do penúltimo para o último mês completo
  if (done.length>=2){ const [m0,m1]=done.slice(-2);
    let best=null;
    meta.columns.forEach((c,j)=>{ if(c.type!=='text'||c.virtual||CODE_RX.test(c.name)) return; const n=distinctCount(rows,j,40); if(n<2||n>30) return;
      const a=new Map(), b=new Map(); let tot=0;
      for (const r of rows){ const d=dayOf(r[dj]); if(!d) continue; const m=d.slice(0,7); if(m!==m0&&m!==m1) continue; const k=r[j]==null||r[j]===''?null:String(r[j]); if(k==null) continue; const t=m===m0?a:b; t.set(k,(t.get(k)||0)+val(r)); if(m===m1) tot+=Math.abs(val(r)); }
      for (const [k,v1] of b){ const v0=a.get(k)||0; if(!v0||Math.abs(v1)<tot*0.1) continue; const pc=(v1-v0)/Math.abs(v0)*100; if(Math.abs(pc)>=40&&(!best||Math.abs(pc)>Math.abs(best.pc))) best={col:c.name,k,v0,v1,pc}; } });
    if (best) out.push({dir:best.pc>0?'up':'down',title:`${best.col} “${best.k}”: ${best.pc>0?'subiu':'caiu'} ${pct1(Math.abs(best.pc))}`,text:`Em ${keyLabel(m1,'m')} foram ${fmtV(best.v1)}, contra ${fmtV(best.v0)} em ${keyLabel(m0,'m')}.`}); }
  // 4) registros com valor muito fora do padrão (acima de Q3 + 3×IQR)
  if (yj>=0){ const vs=rows.map(r=>r[yj]).filter(v=>typeof v==='number').sort((a,b)=>a-b);

function summaryCat(meta,rows,skip){

  return c.find(o=>PARTY_RX.test(o.c.name)&&!/descri|hist[oó]rico/i.test(o.c.name))||c.find(o=>/categoria|produto|vendedor|cliente|setor|canal/i.test(o.c.name))||c[0]||null;
}
function easySummary(meta,rows,prev){
  if (!rows||!rows.length) return null;
